id: https://github.com/con/talks/catalog/talks.schema
name: con-talks-catalog
title: CON talks catalog (talks.yaml)
version: DRAFT
description: >-
  Schema of `talks.yaml`, the catalog of talks by members of the Center for
  Open Neuroscience (CON). It is an authoring-friendly *source* format; its
  slots and identifiers map onto datalad-concepts `xyzri` records for the
  CON website (see catalog/PLAN.md, §2, §3 and §5).

  Controlled values (licenses, event kinds) are enums whose permissible
  values carry the identifier they stand for (`meaning`), so exporters take
  identifiers from this schema instead of hard-coding them.

  DRAFT: derived from catalog/samples/talks.yaml for review of the plan.
license: CC-BY-4.0

prefixes:
  linkml: https://w3id.org/linkml/
  talks: https://github.com/con/talks/catalog/talks.schema/
  bibo: http://purl.org/ontology/bibo/
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  spdxlic: https://spdx.org/licenses/
  xyzrins: https://concepts.datalad.org/s/demo-research-information/ns/
default_prefix: talks
default_range: string

imports:
  - linkml:types

types:
  PartialDate:
    typeof: string
    description: >-
      A date at the precision that is known: YYYY, YYYY-MM, or YYYY-MM-DD.
      A year-only value must be quoted ('2016'): unquoted, YAML reads it
      as a number.
    pattern: '^\d{4}(-[01]\d(-[0-3]\d)?)?$'

slots:
  slug:
    identifier: true
    description: >-
      Key of a registry entry. For people and projects it equals the
      con-site-specific slug (xyzrins:persons/<slug>, xyzrins:projects/<slug>).
    pattern: '^[a-z0-9][a-z0-9-]*$'
  title:
    slot_uri: dcterms:title
  name:
    slot_uri: schema:name
  description:
    slot_uri: dcterms:description
  url:
    range: uri
  start:
    range: PartialDate
  end:
    range: PartialDate
  date:
    range: PartialDate
  license:
    range: License

classes:
  TalkCatalog:
    tree_root: true
    description: The whole talks.yaml file.
    attributes:
      collections:
        range: uri
        multivalued: true
        description: >-
          Collections every deposit of a talk should also be in, in addition
          to an event's collection (e.g. CON's Zenodo community).
      people:
        range: Person
        multivalued: true
        inlined: true
      organizations:
        range: Organization
        multivalued: true
        inlined: true
      events:
        range: Event
        multivalued: true
        inlined: true
      video_archives:
        range: VideoArchive
        multivalued: true
        inlined: true
      topics:
        range: Topic
        multivalued: true
        inlined: true
      talks:
        range: Talk
        multivalued: true
        inlined_as_list: true
        required: true

  Person:
    slots: [slug, name]
    slot_usage:
      name:
        required: true
    attributes:
      orcid:
        pattern: '^\d{4}-\d{4}-\d{4}-\d{3}[0-9X]$'
      github:
        pattern: '^[A-Za-z0-9-]+$'

  Organization:
    slots: [slug, name]
    slot_usage:
      name:
        required: true
    attributes:
      ror:
        description: ROR identifier, without the https://ror.org/ prefix.
        pattern: '^0[a-z0-9]{8}$'

  Event:
    description: >-
      A conference, workshop, webinar (series), session, ... A session or
      a single webinar can be part of another event.
    slots: [slug, name, url, start, end]
    slot_usage:
      name:
        required: true
    attributes:
      acronym: {}
      kind:
        range: EventKind
        required: true
      part_of:
        range: Event
        description: Slug of the event this one is part of.
      location:
        description: Free-text place (city, venue).
      room:
        description: Free-text room within the venue.
      online:
        range: boolean
      organizers:
        multivalued: true
        description: >-
          Slugs of people and/or organizations (from the `people` and
          `organizations` registries) who organized the event.
      project:
        description: con-site-specific project slug (e.g. distribits).
      cierge:
        range: integer
        description: Number of the con/cierge "New Event" issue.
      collection:
        range: MaterialsCollection
        inlined: true

  MaterialsCollection:
    description: >-
      Where an event collects the materials (slides, posters) of its
      presentations, and what it requires of deposits there. For example,
      US-RSE'26 collects them in the Zenodo community `usrse26`, with a fixed
      publication date and a default license. Not specific to any platform:
      the platform follows from `url`.
    slots: [url, license]
    slot_usage:
      url:
        required: true
        description: The collection, e.g. https://zenodo.org/communities/usrse26
    attributes:
      publication_date:
        range: PartialDate
        description: Publication date deposits must carry.
      due:
        range: PartialDate
        description: Deadline for depositing materials.

  VideoArchive:
    slots: [slug, title]
    attributes:
      base:
        range: uri
        required: true
      layout:
        range: ArchiveLayout
        required: true
      video_url:
        required: true
        description: >-
          Template for a video's web UI URL; placeholders {base}, {id},
          and {channel} (collections only).

  Topic:
    slots: [slug, title]
    attributes:
      assets:
        multivalued: true
        description: Reusable files (glob patterns allowed) for this topic.

  Talk:
    slots: [title, description, license]
    slot_usage:
      title:
        required: true
    attributes:
      id:
        identifier: true
        description: >-
          TALK-ID; the deck filename stem and key of its published URL.
          Never reused.
        pattern: '^(\d{4}|202x)-[A-Za-z0-9][A-Za-z0-9.-]*$'
      pid:
        description: >-
          Site PID to use instead of xyzrins:talks/<id> (e.g. to keep the
          PID of a talk migrated from Zotero).
      kind:
        range: TalkKind
        required: true
      status:
        range: TalkStatus
        required: true
      authors:
        range: Person
        multivalued: true
        required: true
      keywords:
        multivalued: true
      projects:
        multivalued: true
        description: con-site-specific project slugs.
      arc:
        range: StoryArc
      grants:
        multivalued: true
        description: con-site-specific grant slugs.
      zotero:
        pattern: '^[A-Z0-9]{8}$'
        description: Zotero item key in the CON group library.
      slides:
        range: Slides
        inlined: true
        required: true
      deposits:
        range: Deposit
        multivalued: true
        inlined_as_list: true
      companions:
        multivalued: true
        description: Companion directories in this repository.
      derived_from:
        range: Talk
        multivalued: true
      listed:
        range: boolean
        description: List a talk hosted elsewhere in index.html.
      presentations:
        range: Presentation
        multivalued: true
        inlined_as_list: true
      reuse:
        range: Reuse
        inlined: true

  Slides:
    slots: [url]
    attributes:
      format:
        range: SlideFormat
        required: true
      source:
        description: Path of the deck in this repository.
      exports:
        multivalued: true
        description: Paths of exports (PDF, PPTX) in this repository.

  Deposit:
    description: >-
      A record of the talk's materials in a repository such as Zenodo or OSF.
      The platform and record id follow from `url`; DOIs are filled in by
      the repository and pulled back (catalog/PLAN.md §6).
    slots: [url]
    slot_usage:
      url:
        required: true
        description: Landing page of the record, e.g. https://zenodo.org/records/22783262
    attributes:
      doi:
        pattern: '^10\.\d{4,9}/\S+$'
      concept_doi:
        pattern: '^10\.\d{4,9}/\S+$'
        description: DOI of all versions of the record.

  Presentation:
    slots: [date]
    attributes:
      event:
        range: Event
        required: true
      presenters:
        range: Person
        multivalued: true
      commit:
        pattern: '^[0-9a-f]{7,40}$'
      recordings:
        range: Recording
        multivalued: true
        inlined_as_list: true

  Recording:
    attributes:
      youtube:
        pattern: '^[A-Za-z0-9_-]{11}$'
        required: true
      start:
        range: integer
        description: Offset (seconds) of the talk within a longer recording.
      end:
        range: integer
      archived_in:
        range: ArchivedCopy
        multivalued: true
        inlined_as_list: true

  ArchivedCopy:
    attributes:
      archive:
        range: VideoArchive
        required: true
      channel:
        description: Channel directory; required for collection archives.

  Reuse:
    description: >-
      Notes for authors of future decks: the role INDEX.md played so far.
      `spine` is the talk's structure, `notes` anything else worth knowing,
      and `highlights` lists the slides worth borrowing, each with its
      reveal.js anchor and topic tags. index.html renders the highlights as
      "Reusable slides by topic", and people and AI assistants read them
      when assembling a new deck. Not exported to the website or Zenodo.
    attributes:
      spine: {}
      notes: {}
      highlights:
        range: Highlight
        multivalued: true
        inlined_as_list: true

  Highlight:
    description: A slide (or group of slides) worth reusing in other decks.
    attributes:
      text:
        required: true
      slide:
        description: reveal.js fragment, e.g. '#/3/1'.
        pattern: '^#/\d+(/\d+)?$'
      topics:
        range: Topic
        multivalued: true

enums:
  License:
    description: Licenses, identified by SPDX.
    permissible_values:
      CC-BY-4.0:
        meaning: spdxlic:CC-BY-4.0
      CC-BY-SA-4.0:
        meaning: spdxlic:CC-BY-SA-4.0
      CC0-1.0:
        meaning: spdxlic:CC0-1.0
  EventKind:
    description: >-
      Kinds of events. Exported as XYZEventType records with the `meaning`
      as PID; bibo terms where they exist, CON-local types otherwise.
    permissible_values:
      conference:
        meaning: bibo:Conference
      workshop:
        meaning: bibo:Workshop
      session:
        meaning: xyzrins:event-types/session
      webinar:
        meaning: xyzrins:event-types/webinar
      webinar-series:
        meaning: xyzrins:event-types/webinar-series
      seminar:
        meaning: xyzrins:event-types/seminar
      meeting:
        meaning: xyzrins:event-types/meeting
  TalkKind:
    description: Kinds of talks (all exported as fabio:Presentation).
    permissible_values:
      talk: {}
      lightning: {}
      webinar: {}
      keynote: {}
      tutorial: {}
      template:
        description: Not a talk (e.g. 0000-zoom-background); never listed.
  TalkStatus:
    description: Where a talk is in its life cycle.
    permissible_values:
      draft: {}
      scheduled: {}
      given: {}
      shelved: {}
  SlideFormat:
    description: Format of the slides.
    permissible_values:
      revealjs: {}
      marp: {}
      google-slides: {}
      pptx: {}
      pdf: {}
      other: {}
  ArchiveLayout:
    description: Layout of an annextube archive (decides its URL template).
    permissible_values:
      collection: {}
      single-channel: {}
  StoryArc:
    description: Recurring story arcs (SOUL.md §7).
    permissible_values:
      origin-stack-today: {}
      challenges-solutions-takehome: {}
      yoda-principle-a-day: {}
      nirvana: {}
      ai-coding-ladder: {}
      reuse-compose-extend-standardize: {}
      mvc-stack: {}
