talks:
- id: 2026-usrse-con-talk
  title: "Reuse, Compose, Extend, Standardize, Automate: Two Decades of RSEing Open (Neuro)Science at CON"  # [usrse]
  kind: talk
  status: scheduled
  # [usrse] program lists 5 authors; the abstract also lists John A. Lee.
  # The record is where this gets decided; the program list is used here.
  authors: [yaroslav-halchenko, cody-baker, austin-macdonald, isaac-to, vadim-melnik]
  description: >-                                                # [usrse] first paragraph of the abstract
    For two decades the team of the Center for Open Neuroscience (CON) has
    been building an open, largely domain-agnostic research-software stack —
    first for neuroimaging, then for neuroscience broadly, and now used well
    beyond. Five actions — Reuse, Compose, Extend, Standardize, and Automate —
    carried us here, and we expect them to keep us productive as AI agents
    enter the workflow.
  keywords: [reuse, modularity, community standards, federation, reproducibility,
             distributed data management, neuroinformatics, FAIR, open source]  # [usrse]
  projects: [neurodebian, pymvpa, datalad, dandi, ember, openneuro, bids, nwb, con-tinuous, datalad-registry]  # [usrse] named in the abstract
  license: CC-BY-4.0                                             # event policy [usrse]
  slides:
    format: revealjs
    source: 2026-usrse-con-talk.html
  zenodo:
    record: 22783262                                             # [user] the abstract deposit
  companions: [2026-usrse/]
  derived_from: [2022-nih-compcore, 2024-distribits-datalad, 2025-distribits-YODA, 2023-bids-dicom, 2023-brain-dandi]  # [index] "borrowed from"
  presentations:
  - event: usrse-2026-ai-assisted-code-development
    date: 2026-10-19                                             # [usrse]
    # presenters: not recorded in any source read
  reuse:
    spine: >-                                                    # [index], abbreviated
      the five-verb spine (Reuse / Compose / Extend / Standardize / Automate)
      plus a "Reuse, in reverse" coda, an Automate section, and an HI+AI close.
    highlights:
    - text: '"Two decades, five verbs" intro slide (NEW).'      # [index]
      topics: [five-verbs]
    - text: '"The five verbs climb the SciOps ladder" mapping.'  # [index]
      topics: [five-verbs]

