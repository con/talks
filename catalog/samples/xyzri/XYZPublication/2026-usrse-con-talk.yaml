description: For two decades the team of the Center for Open Neuroscience (CON)
  has been building an open, largely domain-agnostic research-software stack — first
  for neuroimaging, then for neuroscience broadly, and now used well beyond. Five
  actions — Reuse, Compose, Extend, Standardize, and Automate — carried us here,
  and we expect them to keep us productive as AI agents enter the workflow.
