# SPDX-License-Identifier: Apache-2.0
[workspace]
name = "stamped-in-practice-poster"
channels = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "14.0" }, "linux-64"]

[dependencies]
python = ">=3.12,<3.14"
numpy = ">=2,<3"
scipy = ">=1.15,<2"
matplotlib-base = ">=3.10,<4"
nibabel = ">=5.3,<6"
nilearn = ">=0.14,<0.15"
pillow = ">=11,<13"
pypdf = ">=6,<7"
qrcode = ">=8,<9"
poppler = "*"
nodejs = ">=22,<23"
pre-commit = "*"
git = "*"

[pypi-dependencies]
zxing-cpp = "==2.3.0"
datalad = "*"
git-annex = "*"

[tasks]
setup-browser = "npm ci && npx playwright install chromium"
figures = "python scripts/render-narps-figures.py"
table = "python update-results.py"
build = { cmd = "node build-poster.cjs --out-dir exports", depends-on = ["figures", "table"] }
verify = "python verify-pdf.py --review-dir exports"
links = "python verify-links.py --review-dir exports"
