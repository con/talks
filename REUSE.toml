# === 4. Known provenance: adaptations of Michael Hanke's CC-BY material =====

# Adapted from "Carrots! Not sticks!" by Michael Hanke,
# <https://hedgedoc.psychoinformatics.de/edfuJiNaSNufM4trL8_HhA#/>.
# No license is stated on that page; the author confirmed CC-BY for all of it
# (Matrix, 2026-10).  CC-BY-4.0 permits adaptations under other terms, but the
# adaptations here deliberately stay on the upstream license.
[[annotations]]
path = [
    "pics/humancarrot_*.svg",
    "pics/borrowed/human+carrot.png",
    "pics/borrowed/human+carrot_black.png",
]
precedence = "override"
SPDX-FileCopyrightText = [
    "Michael Hanke <michael.hanke@gmail.com>",
    "2026 Yaroslav O. Halchenko <yaroslav.o.halchenko@dartmouth.edu>",
]
SPDX-License-Identifier = "CC-BY-4.0"

# ReproNim containers / STAMPED artwork: mixed-copyright throughout. Michael
# Hanke created the original YODA figure (without the containers layer) under
# CC-BY; the containers and STAMPED layers, the svgtune recipe that drives
# them, and the *_tuned/ layer variants it produces are built atop it here.
# Both copyrights therefore apply across the whole set -- there is no clean
# seam at which to split it.
[[annotations]]
path = [
    "pics/repronim-containers-*",
    "pics/repronim-containers-stamped.svg",
