version = 1

# ---------------------------------------------------------------------------
# How this file is organised
#
# Blocks are evaluated in order and a LATER block WINS over an earlier one for
# any path both of them match.  So the layout here is:
#
#   1. a catch-all for everything authored in this repository;
#   1b. vendored upstream that the catch-all must not reach;
#   2. the "we cannot determine this" markers for third-party material;
#   3. narrowing blocks for material whose provenance IS known.
#
# Only the LAST matching block is consulted for a given file -- `precedence`
# does not arbitrate between blocks, it only decides how a block combines with
# copyright/licensing found INSIDE the file.  The catch-all uses "closest" so
# an in-file SPDX header (as in 2026-nih-bids2.0/) wins outright; the markers
# use "aggregate" so that if a borrowed file does carry a header, that
# evidence is kept rather than discarded -- which matters most precisely where
# we are admitting we do not know who owns something.
#
# KNOWN LIMITATION: `reuse lint` skips every symlink (REUSE spec 3.3 excludes
# symlinks from "Covered Files").  282 of this repository's tracked files are
# git-annex symlinks, so the linter verifies only about half the tree -- 300
# files, of roughly 590 tracked.  The annotations below still describe the
# annexed files correctly; they are simply not machine-checked here.  See
# "Not everything here is ours" in README.md.
# ---------------------------------------------------------------------------


# === 1. Everything authored in this repository =============================

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2022-2026 Yaroslav O. Halchenko <yaroslav.o.halchenko@dartmouth.edu>"
SPDX-License-Identifier = "CC-BY-SA-4.0"


# === 1b. Vendored upstream, not authored here ==============================

# These three are reveal.js 4.3.1 upstream verbatim -- package.json declares
# "name": "reveal.js", "license": "MIT" and Hakim El Hattab as author.  The
# catch-all above would otherwise assert our copyright and a ShareAlike grant
# over somebody else's MIT code, which is the exact failure this file exists
# to prevent.  reuse does not read package.json's own "license" field, so the
# annotation has to be explicit.
[[annotations]]
path = ["package.json", "package-lock.json", "gulpfile.js"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Hakim El Hattab <hakim.elhattab@gmail.com> and reveal.js contributors"
SPDX-License-Identifier = "MIT"

# Git submodules.  The REUSE spec treats each submodule as a separate Project
# and reuse-tool skips them, so these lines are never exercised by `reuse
# lint` -- but REUSE.toml is also read by humans, and without this block the
# catch-all above reads as a claim over ~2MB of third-party MIT code.
# 2022-nih-compcore is our own talk subdataset and carries this repository's
# terms.
[[annotations]]
path = ["reveal.js", "reveal.js-mermaid-plugin"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Hakim El Hattab and reveal.js contributors; zjffun and reveal.js-mermaid-plugin contributors"
SPDX-License-Identifier = "MIT"


