version = 1

# ---------------------------------------------------------------------------
# How this file is organised
#
# Blocks are evaluated in order and a LATER block WINS over an earlier one for
# any path both of them match.  So the layout here is:
#
#   1. a catch-all for everything authored in this repository;
#   2. the "we cannot determine this" markers for third-party material;
#   3. narrowing blocks for material whose provenance IS known.
#
# The catch-all uses precedence = "closest", so an in-file SPDX header (as
# already present in e.g. 2026-nih-bids2.0/) always wins over it.
#
# KNOWN LIMITATION: `reuse lint` skips every symlink (REUSE spec 3.3 excludes
# symlinks from "Covered Files").  282 of this repository's 587 tracked files
# are git-annex symlinks, so the linter verifies only about half the tree.  The
# annotations below still describe those files correctly; they are simply not
# machine-checked here.  See the "Licensing" section of README.md.
# ---------------------------------------------------------------------------


# === 1. Everything authored in this repository =============================

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2022-2026 Yaroslav O. Halchenko <yaroslav.o.halchenko@dartmouth.edu>"
SPDX-License-Identifier = "CC-BY-SA-4.0"


# === 2. Third-party material of undetermined provenance ====================

# The "borrowed" tree and the cited PDFs: screenshots of web pages and
# publications, figures, cartoons, photographs.  Not ours, provenance largely
# unreconstructable.  See LICENSES/LicenseRef-ThirdPartyMixed.txt.
[[annotations]]
path = ["pics/borrowed/**", "3rd-party/**"]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-ThirdPartyMixed"

# Portraits of CON team members, used on the "who we are" slides.  Copyright
# rests with the respective individuals and photographers, not with this
# repository.
[[annotations]]
path = "pics/con-whoweare/**"
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-ThirdPartyMixed"

