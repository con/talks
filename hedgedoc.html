<!doctype html>

<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>HedgeDoc slides</title>
		<meta name="description" content="Render a HedgeDoc markdown slide deck with the reveal.js of this repository">

		<!--
		  Viewer for HedgeDoc-flavored markdown slide decks (what HedgeDoc
		  shows in "Slide mode" / under /p/), rendered with our reveal.js:

		    python3 -m http.server 8000      # or: npm start
		    http://localhost:8000/hedgedoc.html?md=path/to/talk.md

		  The markdown must come over http(s): browsers refuse to fetch()
		  file:// URLs, and remote servers only work if they send CORS
		  headers.  tools/hedgedoc-fetch makes a local copy (with images).

		  Mimics HedgeDoc: YAML front matter is stripped and its slideOptions
		  go to Reveal.initialize(); "---" separates horizontal and "----"
		  vertical slides; "Note:" starts speaker notes; single newlines are
		  line breaks (unless "breaks: false"); theme defaults to "white".
		  Any reveal.js option can be overridden in the URL, as can the
		  theme, e.g. ?md=talk.md&theme=beige&slideNumber=c
		-->

		<link rel="stylesheet" href="reveal.js/dist/reset.css">
		<link rel="stylesheet" href="reveal.js/dist/reveal.css">
		<link rel="stylesheet" href="reveal.js/dist/theme/white.css" id="theme">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="reveal.js/plugin/highlight/monokai.css">

	</head>
	<body>
		<div class="reveal">
			<div class="slides"></div>
		</div>

		<script src="reveal.js/dist/reveal.js"></script>
		<script src="reveal.js/plugin/notes/notes.js"></script>
		<script src="reveal.js/plugin/markdown/markdown.js"></script>
		<script src="reveal.js/plugin/highlight/highlight.js"></script>
		<script src="reveal.js-mermaid-plugin/plugin/mermaid/mermaid.js"></script>
		<script>
			const params = new URLSearchParams( window.location.search );
			const slides = document.querySelector( '.reveal .slides' );

			// Just enough YAML for HedgeDoc front matter: top-level scalars
			// and one level of nested mapping (slideOptions).  Lists and
			// block scalars (e.g. "abstract: >") are skipped.
			function parseFrontMatter( yaml ) {
				const scalar = v => {
					v = v.trim();
					const quoted = v.match( /^(['"])(.*)\1$/ );
					if( quoted ) return quoted[2];
					v = v.replace( /\s+#.*$/, '' );
					if( v === '' || v === '~' || v === 'null' ) return null;
					if( v === 'true' || v === 'false' ) return v === 'true';
					if( /^-?\d+(\.\d+)?$/.test( v ) ) return Number( v );
					return v;
				};
				const meta = {};
				let nested = null;
				for( const line of yaml.split( /\r?\n/ ) ) {
					let m;
					if( !line.trim() || /^\s*#/.test( line ) ) continue;
					if( ( m = line.match( /^([\w-]+):\s*(.*)$/ ) ) ) {
						nested = null;
						if( m[2].trim() === '' ) meta[m[1]] = nested = {};
						else meta[m[1]] = /^[>|]/.test( m[2] ) ? null : scalar( m[2] );
					}
					else if( nested && ( m = line.match( /^\s+([\w-]+):\s*(.*)$/ ) ) ) {
						nested[m[1]] = scalar( m[2] );
					}
				}
				return meta;
			}

			// Line-wise massaging of the markdown (code fences left alone):
			// - HedgeDoc's markdown-it (CommonMark) lets an HTML comment on its
			//   own line end a preceding paragraph or list, but marked folds it
			//   into them -- so "<!-- .element: ... -->" after a list would style
			//   its last item instead of the list.  A blank line before such
			//   comments makes marked agree.
			// - relative URLs in HTML attributes (raw HTML, .element/.slide
			//   comments) are relative to the markdown file, not to this page.
			//   Markdown links/images are taken care of by marked's baseUrl.
			function preprocess( markdown, baseUrl ) {
				const ATTR_RE = /(\s(?:src|href|data-src|data-background(?:-image|-video|-iframe)?)=)(["'])(.*?)\2/g;
				const rebase = ( match, attr, quote, url ) => {
					if( !url || /^([a-z][a-z0-9+.-]*:|#|\/\/)/i.test( url ) ) return match;
					// data-background can also be a color or a gradient
					if( /data-background=$/.test( attr ) && !/\.\w{3,4}$/.test( url ) ) return match;
					return attr + quote + new URL( url, baseUrl ).href + quote;
				};
				let fenced = false;
				return markdown.split( '\n' ).map( ( line, i, lines ) => {
					if( /^\s{0,3}(```|~~~)/.test( line ) ) fenced = !fenced;
					if( fenced ) return line;
					line = line.replace( ATTR_RE, rebase );
					const previous = i > 0 ? lines[i - 1].trim() : '';
					// keep "---\n<!--" as is: no slide separator without a blank line
					if( line.startsWith( '<!--' ) && previous && !/^-{3,}$/.test( previous ) ) {
						line = '\n' + line;
					}
					return line;
				} ).join( '\n' );
			}

			function showError( message ) {
				const section = document.createElement( 'section' );
				const pre = document.createElement( 'pre' );
				pre.style.cssText = 'white-space:pre-wrap;font-size:0.5em;text-align:left;padding:1em';
				pre.textContent = message;
				section.appendChild( pre );
				slides.appendChild( section );
				Reveal.initialize( { hash: false, history: false } );
			}

			// HedgeDoc renders ```mermaid code blocks as diagrams: turn them into
			// what our mermaid plugin expects (and before highlight gets to them)
			const MermaidFences = {
				id: 'mermaid-fences',
				init: ( deck ) => {
					deck.getSlidesElement().querySelectorAll( 'pre > code.mermaid' ).forEach( code => {
						const div = document.createElement( 'div' );
						div.className = 'mermaid';
						div.textContent = code.textContent;
						code.parentNode.replaceWith( div );
					} );
				}
			};

			async function main() {
				const md = params.get( 'md' );
				if( !md ) {
					return showError( 'No markdown given.\n\nUsage: hedgedoc.html?md=path/or/url/to/talk.md[&theme=beige]' );
				}
				const mdUrl = new URL( md, window.location.href ).href;

				let text;
				try {
					const response = await fetch( mdUrl );
					if( !response.ok ) throw new Error( `HTTP ${response.status} ${response.statusText}` );
					text = await response.text();
				}
				catch( error ) {
					return showError(
						`Could not load ${mdUrl}\n${error}\n\n` +
						( window.location.protocol === 'file:'
							? 'Browsers do not let a file:// page fetch other files. Serve this directory instead:\n' +
							  '  python3 -m http.server 8000   (or: npm start)\n' +
							  '  http://localhost:8000/hedgedoc.html?md=' + md
							: 'A remote server must allow cross-origin (CORS) requests.\n' +
							  'Otherwise fetch a local copy:  tools/hedgedoc-fetch ' + md )
					);
				}

				let meta = {};
				const frontMatter = text.match( /^---[ \t]*\r?\n([\s\S]*?)\r?\n(?:---|\.\.\.)[ \t]*(?:\r?\n|$)/ );
				if( frontMatter ) {
					meta = parseFrontMatter( frontMatter[1] );
					text = text.slice( frontMatter[0].length );
				}
				const slideOptions = ( meta.slideOptions && typeof meta.slideOptions === 'object' ) ? meta.slideOptions : {};

				const theme = params.get( 'theme' ) || slideOptions.theme || 'white';
				if( /^[\w-]+$/.test( theme ) ) {
					document.getElementById( 'theme' ).href = `reveal.js/dist/theme/${theme}.css`;
				}
				if( typeof meta.title === 'string' ) document.title = meta.title;

				const section = document.createElement( 'section' );
				section.setAttribute( 'data-markdown', '' );
				section.setAttribute( 'data-separator', '^\\r?\\n---\\r?\\n$' );
				section.setAttribute( 'data-separator-vertical', '^\\r?\\n----\\r?\\n$' );
				const template = document.createElement( 'textarea' );
				template.setAttribute( 'data-template', '' );
				// no leading blank lines: the markdown plugin would count them as
				// indentation and un-indent all lines by that much
				template.textContent = preprocess( text, mdUrl ).replace( /^\s*\n/, '' );
				section.appendChild( template );
				slides.appendChild( section );

				Reveal.initialize( {
					// HedgeDoc's defaults ...
					controls: true,
					progress: true,
					slideNumber: true,
					hash: true,
					history: true,
					center: true,
					transition: 'none',
					// ... overridden by the deck's own slideOptions
					...slideOptions,
					markdown: {
						// HedgeDoc's markdown-it uses breaks: true, typographer: true
						breaks: meta.breaks !== false,
						smartypants: true,
						baseUrl: mdUrl,
					},
					plugins: [ RevealMarkdown, MermaidFences, RevealHighlight, RevealNotes, RevealMermaid ]
				} );
			}

			main();
		</script>
	</body>
</html>
