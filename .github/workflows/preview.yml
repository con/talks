name: Preview

# Runs automatically for pull requests from branches of this repository
# (opened, pushed to, reopened: deploy; closed: remove), and can be run
# manually (Actions -> Preview -> Run workflow) with a pull request number,
# e.g. for pull requests from forks. It publishes, under `pr-preview/pr-<N>/` on the `gh-pages` branch, a
# preview of only the decks (top-level *.html) that pull request adds or
# changes, together with just the files they use (reveal.js, css/, pics/...),
# with git-annex'ed content fetched from datasets.datalad.org.
# Run it manually with `remove` to delete a preview again. Pull requests
# which change no decks get no preview (and no failing check).
#
# The pull request's content is built with a read-only token; only the
# resulting files are handed to the deploy job, which has write access.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      action:
        description: Deploy or remove the preview
        required: true
        type: choice
        options:
          - deploy
          - remove
        default: deploy

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

env:
  ANNEX_REMOTE_URL: https://datasets.datalad.org/centerforopenneuroscience/talks/.git

jobs:
  params:
    # Pull requests from forks get a read-only token and cannot deploy
    # (run the workflow manually for those).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.p.outputs.pr }}
      action: ${{ steps.p.outputs.action }}
    steps:
      - name: Work out pull request and action
        id: p
        env:
          EVENT: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            PR=$EVENT_PR
            if [[ "$EVENT_ACTION" == closed ]]; then ACTION=remove; else ACTION=deploy; fi
          else
            PR=$INPUT_PR
            ACTION=$INPUT_ACTION
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

  build-preview:
    needs: params
    if: needs.params.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      decks: ${{ steps.decks.outputs.decks }}
      head-sha: ${{ steps.pr.outputs.head-sha }}
    steps:
      - name: Look up pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.params.outputs.pr }}
        run: |
          read -r STATE HEAD_SHA < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state + " " + .head.sha')
          if [[ "$STATE" != open ]]; then
            echo "::error::Pull request #$PR_NUMBER is $STATE."
            exit 1
          fi
          echo "head-sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # the merge of the pull request into its base, so HEAD^1 is the
          # base; full history for git-annex
          ref: refs/pull/${{ needs.params.outputs.pr }}/merge
          fetch-depth: 0

      - name: Find changed decks
        id: decks
        run: |
          # top-level *.html only: decks live at the repository root
          DECKS=$(git diff --name-only --diff-filter=AMR HEAD^1 HEAD -- '*.html' \
            | grep -E '^[A-Za-z0-9][A-Za-z0-9._+-]*\.html$' | tr '\n' ' ' || true)
          if [ -z "$DECKS" ]; then
            if [[ "${{ github.event_name }}" == pull_request ]]; then
              echo "::notice::Pull request #${{ needs.params.outputs.pr }} changes no decks; no preview."
              echo "decks=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Pull request #${{ needs.params.outputs.pr }} changes no decks; nothing to preview."
            exit 1
          fi
          echo "Decks to preview: $DECKS"
          echo "decks=$DECKS" >> "$GITHUB_OUTPUT"

      - name: Get reveal.js
        if: steps.decks.outputs.decks != ''
        # not `submodules: true`: 2022-nih-compcore has a relative URL that
        # only resolves on datasets.datalad.org
        run: git submodule update --init --depth 1 reveal.js reveal.js-mermaid-plugin

      - name: Set up git-annex
        if: steps.decks.outputs.decks != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-annex
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin '+refs/heads/git-annex:refs/remotes/origin/git-annex'
          git remote add --fetch datasets.datalad.org "$ANNEX_REMOTE_URL"
          git annex init --quiet

      - name: Build site
        if: steps.decks.outputs.decks != ''
        env:
          DECKS: ${{ steps.decks.outputs.decks }}
        run: |
          set -o pipefail
          # the builder comes from this workflow's own commit: the pull
          # request being previewed need not (and usually does not) have it
          git fetch --no-tags --quiet origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:tools/build_preview.py" > "$RUNNER_TEMP/build_preview.py"
          read -ra DECKS <<< "$DECKS"
          python3 "$RUNNER_TEMP/build_preview.py" preview-site "${DECKS[@]}" | tee "$RUNNER_TEMP/build.log"
          if grep -q '^MISSING: ' "$RUNNER_TEMP/build.log"; then
            {
              echo "### Files not available for the preview"
              echo
              echo "Not on any reachable annex remote yet (e.g. not pushed to datasets.datalad.org), or referenced but nonexistent:"
              echo
              sed -n 's/^MISSING: \(.*\)/- `\1`/p' "$RUNNER_TEMP/build.log"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload site
        if: steps.decks.outputs.decks != ''
        uses: actions/upload-artifact@v7
        with:
          name: preview-site
          path: preview-site/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  deploy-preview:
    needs: [params, build-preview]
    # also run for `remove`, where the build is skipped
    if: ${{ !cancelled() && (needs.params.outputs.action == 'remove' || (needs.build-preview.result == 'success' && needs.build-preview.outputs.decks != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download site
        if: needs.params.outputs.action == 'deploy'
        uses: actions/download-artifact@v8
        with:
          name: preview-site
          path: preview-site

      - name: Deploy preview
        id: preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: preview-site
          preview-branch: gh-pages
          action: ${{ needs.params.outputs.action }}
          pr-number: ${{ needs.params.outputs.pr }}
          deploy-commit-message: Deploy preview for PR ${{ needs.params.outputs.pr }}
          remove-commit-message: Remove preview for PR ${{ needs.params.outputs.pr }}
          # The action's own comment looks for the pull request in the
          # triggering event, which `workflow_dispatch` does not carry.
          comment: false

      - name: Compose preview comment
        if: needs.params.outputs.action == 'deploy'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          HEAD_SHA: ${{ needs.build-preview.outputs.head-sha }}
          DECKS: ${{ needs.build-preview.outputs.decks }}
          DEPLOYMENTS_URL: ${{ github.server_url }}/${{ github.repository }}/deployments
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo ":rocket: Preview of $HEAD_SHA:"
            echo
            for deck in $DECKS; do
              echo "- [$deck](${PREVIEW_URL%/}/$deck)"
            done
            echo
            echo "It will be live once the [GitHub Pages deployment]($DEPLOYMENTS_URL) finishes."
            echo "Images whose git-annex content is not on datasets.datalad.org yet are listed in the [build summary]($RUN_URL)."
            echo "Re-run the [Preview workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/preview.yml) to update it."
          } > "$RUNNER_TEMP/comment.md"

      - name: Comment preview link
        if: needs.params.outputs.action == 'deploy'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-preview
          number: ${{ needs.params.outputs.pr }}
          path: ${{ runner.temp }}/comment.md

      - name: Comment preview removal
        if: needs.params.outputs.action == 'remove'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-preview
          number: ${{ needs.params.outputs.pr }}
          message: |
            Preview removed.
