  - author: tsalo
    createdAt: '2020-08-03T13:45:51Z'
    body: "@gllmflndn wrote:\r\n\r\nAll of the information stored in _scans.tsv files could be stored instead in JSON sidecar files. \r\nGiven the potential redundancy, as mentioned in https://github.com/rordenlab/dcm2niix/issues/93#issuecomment-299329243, I would consider removing _scans.tsv from the specification."
  - author: tsalo
    createdAt: '2020-08-05T15:08:22Z'
    body: 'Personally, I would prefer to see the scans tsv restructured a bit (see #29) rather than removed. Extracting an acquisition time that applies to a whole set of files from the same acquisition is difficult with jsons, and could be much easier with an altered tsv file. Additionally, the tsv file is a great place for scan-level information like QC ratings.'
  - author: robertoostenveld
    createdAt: '2020-08-05T15:15:23Z'
    body: 'The `scans.tsv` file is also very useful for experimental details that vary from scan to scan. For example, the subjects alertness/fatigue ratings or some other experimental variable that is not assessed by the scanner but by the experimenter in another way. That is proper data in itself, not metadata about the recording. '
- number: 26
  title: Make capitalization of suffixes consistent
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/26
  author: tsalo
  assignees: []
  labels:
  - suffixes
  createdAt: '2020-08-03T13:41:26Z'
  updatedAt: '2024-11-05T01:51:11Z'
  closedAt: null
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\nSee: https://groups.google.com/forum/?utm_medium=email&utm_source=footer#!msg/bids-discussion/yOYaLNTh-_A/rPLd3JpsAgAJ \r\n\r\nI see 3 possible routes \r\n1. not care about capitalization (ie accept bold and BOLD)\r\n2. not capitalize and keep the standard consistency\r\n3. have a mix, no specific rationale with \"old\" suffixes and \"NEW\" ones  \r\n\r\nI must say 2 and 3 seem at first sight preferable to 1 - but I would probably go for 2 if there are no strong rationale for 3 (which there may be)\r\n\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original authors**: @jbpoline \r\n"
  comments:
  - author: tsalo
    createdAt: '2020-08-03T13:43:10Z'
    body: "@jcolomb wrote:\r\n\r\nI have just spent 6 hours to debug an application developed on windows but that should run on linux because of a capitalisation problem: my 2 cents: do not accept any capital letter."
  - author: jbteves
    createdAt: '2020-08-04T22:22:42Z'
    body: 'I am in favor of route (2). '
  - author: yarikoptic
    createdAt: '2024-02-28T01:13:55Z'
    body: "@tsalo would it then also cover entity's values? \r\nor those should be fine as long as they are not coming from controlled (in BIDS) vocab (like `_task-rest`)\r\n\r\nI am asking because not sure how Windows would behave if there was e.g. `_task-one` and `_task-One` -- would it be different/the same name?  I think we in DataLad and git in general had similar gotchas , e.g. https://www.hanselman.com/blog/git-is-casesensitive-and-your-filesystem-may-not-be-weird-folder-merging-on-windows ."
  - author: tsalo
    createdAt: '2024-02-28T02:34:53Z'
    body: "I don't particularly want to restrict freeform values (i.e., the `label` pattern for certain entities), but I can see why having case-insensitive unique values would be a good restriction. I personally want to adopt a single convention for suffixes, since some are currently capitalized, while others are not.\r\n\r\nI should clarify, though, that the original proposal was @jbpoline's. I just copied it over from the old BIDS 2.0 Google Doc. Though I _do_ support it, in the form of JB's option 2."
  - author: yarikoptic
    createdAt: '2024-02-28T02:49:25Z'
    body: "oh -- and that reminded me about\r\n- https://github.com/bids-standard/bids-specification/pull/858\r\nso we have now https://github.com/bids-standard/bids-specification/blob/master/src/common-principles.md#case-collision-intolerance formulated and there is TODO in bids-validator\r\n- https://github.com/bids-standard/bids-validator/issues/1330"
  - author: Lestropie
    createdAt: '2024-06-25T00:37:53Z'
    body: "This came to mind recently, particularly thinking about https://github.com/bids-standard/bids-specification/issues/1862 and https://github.com/bids-standard/bids-specification/pull/1831.\r\n\r\nMy initial instinct before coming across this existing Issue was that capitalisation could apply exclusively to:\r\n- Acronyms\r\n- Established mathematical symbols (eg. \"T1\")\r\n\r\nThis would arguably then extend beyond suffices to directory names also; eg. `sub-01/anat/`, `sub-01/DWI/`, `sub-01/func/`.\r\n\r\nNot 100% sold on the idea, but considered it worthwhile listing."
  - author: CPernet
    createdAt: '2024-06-28T07:15:12Z'
    body: 'oh boy stop pointing out at inconsistency here .. @yarikoptic s'' baby for BIDS 2.0 lol '
  - author: CPernet
    createdAt: '2024-06-28T07:15:33Z'
    body: should we here just lower case all 4 cases?
  - author: Lestropie
    createdAt: '2024-06-29T03:29:22Z'
    body: "> should we here just lower case all 4 cases?\r\n\r\nI think from this comment you may have erroneously associated [my comment here](https://github.com/bids-standard/bids-2-devel/issues/26#issuecomment-2187692072) with the ongoing discussion around DWI scanner-generated derivatives on BIDS 1.x. It is however intentionally associated with BIDS 2.0 discussion. What to do about capitalisation of specifically DWI scanner-generated derivatives in 1.x would be better placed at https://github.com/bids-standard/bids-specification/pull/1864."
- number: 25
  title: Drop sidecar JSON files and store all metadata in the header
  state: CLOSED
  url: https://github.com/bids-standard/bids-2-devel/issues/25
  author: tsalo
  assignees: []
  labels:
  - 'impact: high'
  - metadata
  createdAt: '2020-08-03T13:39:43Z'
  updatedAt: '2024-04-11T20:30:30Z'
  closedAt: '2024-04-11T20:30:30Z'
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\nThis could be done with NIFTI header extension. JSON could still be used internally. This would also remove the need for the hierarchical rule (which is quite confusing). The downside is that is that it’s harder to view and edit metadata (without specialized tools).\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original authors**: Unknown\r\n"
  comments:
  - author: jbteves
    createdAt: '2020-08-04T22:28:58Z'
    body: "I would be in favor of this. The solution to viewing would be to make a simple tool which extracts only the metadata (such as AFNI's `3dinfo`, or to ask major package developers to add viewing options to metadata. @neurolabusc do you think it would be hard to add a metadata viewer to `mricroGL` if this proposal were accepted?\r\nI'm also tagging @afni-rickr and @leej3 as I believe we had chatted about something like this briefly at Code Convergence. "
  - author: robertoostenveld
    createdAt: '2020-08-05T07:32:56Z'
    body: 'This solution only works for NIFTI files, not for other file formats that are used for storing raw data (such as FIF or EDF). '
  - author: neurolabusc
    createdAt: '2020-08-05T10:44:58Z'
    body: "@jbteves, such a change would be easy to support with MRIcroGL and dcm2niix. There are clear benefits, which is identical to moving from the two-file Analyze/NIfTI .hdr/.img to the one file .nii (and other two file formats like .nhdr/.raw, .head/.brik, etc):\r\n 1. Since the BIDS information is embedded in the same file as the other information, a user does not need to make sure to keep them together and to make sure file names correspond.\r\n 2. For macOS users, applications have [restricted file system access](https://developer.apple.com/library/archive/documentation/Security/Conceptual/AppSandboxDesignGuide/AppSandboxInDepth/AppSandboxInDepth.html). Specifically, while a user may have read permission for a file, it does not mean that an application launched by that user has access to a file. Therefore, if a user drops the file `img.nii `onto an application to load it, it does not necessarily mean the application has permission to read the associated `img.json`. \r\n\r\nFor full disclosure, I did advocate for single files (and also emphasized the dangers of using ASCII for floating point values and the [Inheritance Principle](https://github.com/bids-standard/bids-specification/blob/master/src/02-common-principles.md#the-inheritance-principle)) when the BIDS sidecar was developed. However, the consensus was that the benefits of having a separate, human readable file outweighed these costs. Using a text editor to edit text fields in a binary file would corrupt the binary data, converting binary data to base64 (e.g. GIfTI) would impact file size as well as read/write speeds, and other methods would require custom tools.\r\n\r\nLike any format, BIDS was a compromise of different strengths and limitations. From a Darwinian perspective, the format that we have has been wildly popular so it seems to fill a niche. We now have many tools adapted to the format as defined, so we need to think carefully regarding the unintended consequences of new changes to a robust and popular format. When we change a format, we also need to change all the tools and all the documentation. As an analogy, I would point to the way Python 3 broke compatibility to improve the language as a cautionary tale. This caused a lot of grief to users or those who searched stack exchange for code snippets to solve their problems. "
  - author: afni-rwcox
    createdAt: '2020-08-06T14:39:29Z'
    body: "I am in favor of a single file approach, where practicable, for ease of file transport and I/O. In particular, I now feel my decision (1994) for the .HEAD/.BRIK file pair was not a good one. I was deeply involved in the NIfTI-1 planning, and in that case the .hdr/.img pair was there just be be compatible with ANALYZE-7.5 -- which desire drove a lot of the rest of the NIfTI-1 decision making process, to ease the transition for some of the NIfTI-1 stakeholders.\r\n\r\nAn extension should announce its format at the beginning. In the case of AFNI-generated .nii files, the contents that _would_ be in .HEAD file are encoded in XML, and the AFNI extension starts with \r\n```\r\n   <?xml version='1.0' ?>\r\n   <AFNI_attributes\r\n```\r\nwhich is at least somewhat informative about what is to follow - that is to say, it is clearly _not_ JSON, a Google protocol buffer message, or random unformatted stuff.  Why did I use XML, not JSON? Because I started using XML for inter-program messaging in late 2002 (pre-NIfTI) and so it was available to me. I was unable to get the NIfTI team to even consider using an XML-based header, so instead I came up with the \"let's do a remix of ANALYZE 7.5\" approach, which was adopted after significant changes (improvements!) by the team discussions. When I came to put AFNI header data into the NIfTI extension, I decided to use the XML code I'd already developed to make it at least _potentially_ readable by someone else.\r\n\r\nWhy this long story? To help shape the future by the errors and successes of the past. NIfTI-1 was a success, because it was simple enough to get buy-in from important developers, and added enough capability to the ANALYZE 7.5 format to be worth the effort. The NIfTI extensions (not my idea, was added in discussions) made the format very useful for all, at the same time keeping a simple core. These were a valuable pairing - simple core + extensions. Having a standard simple format for extensions would have been even better.\r\n\r\nJSON is pretty simple in its basic structure (more so than XML, for sure), and so is a logical way to store random extra info. In principle, the entire header for a dataset could be a JSON (or perhaps a string of JSONs, to allow for extensions) - that is, drop the NIfTI header entirely and encode it in JSON.\r\n\r\nHowever, this approach has one significant drawback - in NIfTI, the byte offset to the start of the image data is encoded in the header, which makes it easy to memory-map the data file rather than read it with file I/O. In the days of streaming data around, this may sound pitiful, but is less so when one has to deal with multi-gigabyte size files as the units of data collections.\r\n\r\nOK, too long -- I'm stopping this meandering and going back to dealing with email. Did I mention that Outlook sucks?"
  - author: yarikoptic
    createdAt: '2024-04-11T20:30:30Z'
    body: "I will make an executive decision to close this issue since I am very inline with @robertoostenveld factual statement that BIDS is not only about NIfTIs.  As such I think this issue has no chance for being \"solved\".\r\nIf someone wants to extend NIfTI with a formalized NIfTI extension to mirror BIDS sidecar file -- it is a separate question/issue to be developed/agreed upon. Someone could start a BEP on that aspect. bids-validator then could be tuned to ensure consistency between embedded and \"external\" (in .json) records.\r\n\r\nAlso note  a single file solution in general \"inflexible\" to support \"cheap\" metadata modifications/fixes which is now a motivation e.g. for NWB files to use Zarr filesets instead of a single HDF5 file."
