  - author: Remi-Gau
    createdAt: '2024-02-27T15:55:32Z'
    body: "note that given that BIDS support citation.cff, it may be good to see if things are not better done via citation.cff than by extending dataset_description\r\n\r\nI think that the next version of citation.cff may allow more details WRT contributors for example"
  - author: yarikoptic
