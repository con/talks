- number: 52
  title: MEEG+iEEG --> Make it a requirement that channels in bids sidecar and raw file are in order
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/52
  author: sappelhoff
  assignees: []
  labels:
  - MEG
  - iEEG
  - EEG
  - metadata
  createdAt: '2021-02-10T09:20:08Z'
  updatedAt: '2022-04-10T19:49:30Z'
  closedAt: null
  body: "came up in https://github.com/mne-tools/mne-bids/issues/697#issuecomment-776537456\r\n\r\nWe currently have the following in the spec:\r\n\r\nEEG: \r\n> To avoid confusion, the channels SHOULD be listed in the order they appear in the EEG data file.\r\n\r\n[source](https://bids-specification.readthedocs.io/en/latest/04-modality-specific-files/03-electroencephalography.html#channels-description-_channelstsv)\r\n\r\niEEG:\r\n\r\n> Channels SHOULD appear in the table in the same order they do in the iEEG data file.\r\n\r\n[source](https://bids-specification.readthedocs.io/en/latest/04-modality-specific-files/04-intracranial-electroencephalography.html#channels-description-_channelstsv)\r\n\r\nMEG:\r\n\r\n> To avoid confusion, the channels SHOULD be listed in the order they appear in the MEG data file.\r\n\r\n[source](https://bids-specification.readthedocs.io/en/latest/04-modality-specific-files/02-magnetoencephalography.html#channels-description-_channelstsv)\r\n\r\nour proposal (cc @hoechenberger @agramfort ) is to turn this \"SHOULD\" into a \"MUST\". This would be in line with the BIDS principle to place most burden on the dataset curation stage, as that's a one-time-burden. All steps that follow after this will have an easier time. For example, tools can rely on the sidecar files, and don't have to double check with the raw files.\r\n\r\nPotential issue(s):\r\n\r\n- We currently cannot validate a MUST, because we lack JS readers for ephys formats\r\n- Breaking backwards incompatibility for all currently existing datasets that did not follow the RECOMMENDATION (\"SHOULD\") that we now want to turn into a REQUIREMENT (\"MUST\")\r\n\r\nSomewhat parallel issue(s):\r\n\r\n- bids-standard/bids-specification#667 \r\n\r\n"
  comments:
  - author: hoechenberger
    createdAt: '2021-02-10T09:21:42Z'
    body: +100 on this one.
  - author: agramfort
    createdAt: '2021-02-10T11:02:53Z'
    body: '+1000 :)


      >

      '
  - author: agramfort
