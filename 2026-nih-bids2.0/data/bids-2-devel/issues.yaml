  body: "Should perform necessary actions on a BIDS 1.?.? datasets to migrate them into a \"proper\" BIDS 2.0.0 (and/or later) dataset. Some of the actions I foresee it to do (to be modified as we go)\r\n\r\n- [x] rename `participants.tsv` to `subjects.tsv` . https://github.com/bids-standard/bids-2-devel/issues/14\r\n- [ ] provide ... field to `dataset_description.json` to describe layout (could be with or without session): https://github.com/bids-standard/bids-2-devel/issues/54 \r\n\r\nwhile working on those we should test it \r\n\r\n- [x] tested on https://github.com/bids-standard/bids-examples  . \r\n   - [x]  Should use new dyno based validator against the modified schema from [BIDS 2.0 PR](https://github.com/bids-standard/bids-specification/pull/1775)\r\n   - [x] Valid bids 1.x datasets should remain valid bids 2.x after migration.\r\n   - [ ] should be integrated with `bids-examples` repo to carry `bids-2.0` branch which gets updated by converting all examples into BIDS 2.0 specification. To be triggered when migration script changes (could be done from workflow here triggering a workflow there), or when `bids-examples` master branch changes "
