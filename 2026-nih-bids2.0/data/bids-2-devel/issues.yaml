  body: "In principle all issues we have already filed should go through the\r\n[BIDS 2.0](https://github.com/orgs/bids-standard/projects/10/views/1?layout=board) and be moved from \"No status\" to either \"Punted\" or \"Todo\" or even \"In progress\" or \"Done\" if somehow in those advanced stages.\r\n\r\nThere is a [listing of issues sorted by :+1: ](https://github.com/bids-standard/bids-2-devel/issues?q=is%3Aissue+is%3Aopen+sort%3Areactions-%2B1-desc) which could be of help to choose candidates"
