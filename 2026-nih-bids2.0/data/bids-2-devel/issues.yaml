    body: "**But** besides \"paradigm\" applicability, I am not sure I saw (but I never looked) application of it for `.tsv` files.  @effigies @Lestropie are you aware of some good examples uses of inheritance for .tsv files?\r\n\r\nMoreover [inheritance principle](https://bids-specification.readthedocs.io/en/stable/common-principles.html#the-inheritance-principle) is somewhat specific for .tsv and .bval/.bvec files in that there is no \"inheritance\" -- lowest level in hierarchy is taken (.json - accumulates from higher levels), and that plays better with \"summarization\"."
  - author: effigies
    createdAt: '2024-05-31T13:30:02Z'
    body: "Inheritance is baked into `channels.tsv` and `electrodes.tsv`, as these are generally expected to be constant within sessions, so they have fewer entities than the data files they apply to. We are having to add entities because some dataset curators want to duplicate them for every data file, which was not previously excluded by the validator. While this is allowing curators to decrease their reliance on the inheritance principle, for tools, it increases it, as they now must look for the same file in more potential locations.\r\n\r\nFor TSV files, I think the equivalent to the summarization principle would be that there must be exactly one applicable TSV file of a given type. So you could have a `channels.tsv` for each data file, but that would be mutually exclusive with one for the entire session. Likewise, you could have one `task-nback_events.tsv` at the root level, but then that must not be overridden by a specific run."
  - author: marcelzwiers
    createdAt: '2024-05-31T13:53:05Z'
    body: "> the entire BIDS is \"RDB on the filesystem level\"\r\n\r\nI don't agree with that and as I see it, BIDS is a study format, nothing relational about it. True, for some data there are two locations for storing thing, either in the subject folder, or e.g. in the particpants.tsv file. But then you always choose, one or the other, there is never a relation between them (like there is a relation between jsons adhering to inheritance principle).\r\n\r\nAnd the fact that 20% of the openneuro datasets use it is a description of the situation, not an argument for it's benefits :-) (it would have been trivially easy for these studies to store it all on the sub/ses level)\r\n\r\n> Moreover [inheritance principle](https://bids-specification.readthedocs.io/en/stable/common-principles.html#the-inheritance-principle) is somewhat specific for .tsv and .bval/.bvec files in that there is no \"inheritance\" -- lowest level in hierarchy is taken (.json - accumulates from higher levels), and that plays better with \"summarization\".\r\n\r\nI agree with that, and I do support your \"summarization\" proposal as an improvement over the inheritance principle... It meets the goal of metadata deduplication, while reducing ambiguities and overly complex schemes, e.g. when pooling data"
  - author: Remi-Gau
    createdAt: '2024-05-31T14:20:56Z'
    body: "> it would have been trivially easy for these studies to store it all on the sub/ses level\r\n\r\nTrivial to some but not to all: remember that some of the people who create the datasets barely know what a json file is or how to interact with it with python or matlab.\r\n\r\nSo creating (and especially updating) a single file at the root of the dataset will be a lot easier for them than having to edit manually many many many json files.\r\n\r\n"
  - author: marcelzwiers
    createdAt: '2024-05-31T14:35:54Z'
    body: "> Trivial to some but not to all: remember that some of the people who create the datasets barely know what a json file is or how to interact with it with python or matlab.\r\n\r\nI actually fear for them dealing properly with the inheritance principle. I think it would be better to have such people use tools for editing/maintaining BIDS datasets, such as [CuBIDS](https://cubids.readthedocs.io/en/latest/)?"
  - author: yarikoptic
    createdAt: '2024-05-31T15:08:39Z'
    body: "> And the fact that 20% of the openneuro datasets use it is a description of the situation, not an argument for it's benefits :-)\r\n\r\nit was a response to your \r\n\r\n> However, I have yet to encounter a single dataset in which I have found any use for this principle\r\n\r\nnot an argument although it can easily become one if expanded, e.g. \"I and others, as shown by above example, find it extremely useful\".  But this issue is not about that topic. If you would like to discuss inheritance principles cons, please chime in instead on\r\n\r\n- #36 "
  - author: yarikoptic
    createdAt: '2024-05-31T15:14:00Z'
    body: "> Likewise, you could have one `task-nback_events.tsv` at the root level, but then that must not be overridden by a specific run.\r\n\r\n*In principle*, I think this should be ok in \"summarization\" formulation as \"overridden\" would be replaced with \"duplicated\". *In practice* it would be tricky/impossible since for `_events.tsv` there is really nothing which could constitute the \"identity\" of an event, so unless an event row duplicated exactly, it would be just another added event (possibly for the same onset/duration but different metadata), so impossible to identify and to warn user that there might be inconsistency etc."
  - author: dorahermes
    createdAt: '2024-05-31T15:16:56Z'
    body: "I completely agree with the above proposal as it eliminates value overloading (having a value at one level override a value at a different level). \r\n\r\nSome notes from a BIDS curation perspective in a clinical environment. Non-technical staff does really well working with human readable files with simple rules and avoiding the use of additional software packages: either a file exists at the top, or at the individual level. This works most of the time. When we have to change a field at the individual level in hundreds of files, they often reach out to someone who can code. \r\n\r\nOne example use-case is the channels.tsv file for EEG/iEEG. This file exists for every data file and bad channels can be annotated there as they can differ across sessions and runs. The columns are the same across all subjects but include some optional user specified columns. If a channels.json file can exist only at the top level to specify these columns (that are the same across all subjects) that is convenient. The proposal described here would strongly facilitate this use case, which is extremely common for us, if I am correct."
  - author: effigies
    createdAt: '2024-05-31T15:26:54Z'
    body: "I think we may be getting off-topic (feel free to hide this comment as off-topic if you agree), but I'm confused by the following:\r\n\r\n> _In practice_ it would be tricky/impossible since for `_events.tsv` there is really nothing which could constitute the \"identity\" of an event, so unless an event row duplicated exactly, it would be just another added event (possibly for the same onset/duration but different metadata), so impossible to identify and to warn user that there might be inconsistency etc.\r\n\r\nTSV files are not merged, they are located. Unless you are proposing this change, nobody would try to merge events.tsv files found at multiple levels. Given that you say it would be tricky/impossible, I don't think you're proposing it...\r\n\r\nNow, TSV files can be *joined*, but those are specific ones. For example `participants.tsv`, `sub-*_sessions.tsv` and `sub-*[_ses-*]_scans.tsv` can be joined on the `participant_id` and `session_id` columns in order to provide metadata for each scan file, but this isn't a merging of two files with the same suffix."
  - author: yarikoptic
    createdAt: '2024-05-31T15:36:30Z'
    body: "@dorahermes re `channels.tsv` -- could you elaborate more, may be point to example dataset?  The\r\n\r\n>  The columns are the same across all subjects but include some optional user specified columns.\r\n\r\nsounds like requiring common columns provided at top level `channels.tsv` and then per subj/session `sub-*_ses-*_channels.tsv` providing additional columns... If I get it right , it would go \"against\" current inheritance rule and our discussion above with @effigies on that:  \r\n\r\n> TSV files are not merged, they are located. Unless you are proposing this change, nobody would try to merge events.tsv files found at multiple levels. Given that you say it would be tricky/impossible, I don't think you're proposing it...\r\n\r\nI am \"considering\" or \"approaching\" it ;-) And as @dorahermes points out above (if I got her right) we might want to not just \"append\" but \"extend\" (more like we do for json if we consider json to be a simple single row, and tsv is a list of such rows). Overall, I think it could be very beneficial if we could generalize principle so it doesn't *differ*  in handling .tsv and .json files.\r\n\r\nNote that if we have `participant_id` and `session_id` , we only have `name` and not `channel_id` within [channels.tsv](https://bids-specification.readthedocs.io/en/stable/modality-specific-files/near-infrared-spectroscopy.html#channels-description-_channelstsv)"
  - author: yarikoptic
    createdAt: '2024-05-31T15:49:30Z'
    body: "re `_channels.tsv`: a *note* that we do not force uniqueness on \"name\" of a channel. Also there is no entities for those suffixes such as  `channel` and `event`, thus no `_id`s, name of which is `{entitylongname}_id` and value is `{entityshortname}-{value}` and already defined for \r\n\r\nNB \"edited\" for difference in name/value\r\n\r\n```shell\r\n❯ grep '_id:$' objects/columns.yaml\r\ndesc_id:\r\nparticipant_id:\r\nsample_id:\r\nsession_id:\r\n```\r\nbut I guess could be generalized for any entity (context: #54).\r\nSo inheritance/summarization could be easily extended to support loading from multiple .tsv files \"appending\" (rows) and/or \"extending\" (columns) for files with `_id` columns ensuring alignment etc."
  - author: marcelzwiers
    createdAt: '2024-05-31T17:12:04Z'
    body: "Another issue I haven't seen much discussion on (but correct me if I'm wrong, as I also missed the previous discussion on the inheritance cons, thank you @yarikoptic), is what I would call the file collection/grouping problem. So how to deal with e.g.:\r\n\r\n```\r\n[summarize.json]\r\nsub-01\r\n  `anat\r\n     |-sub-01_run-1_acq-foo_MP2RAGE.nii.gz\r\n     |-sub-01_run-1_acq-foo_UNIT1.nii.gz\r\n     |-sub-01_run-2_acq-foo_MP2RAGE.nii.gz\r\n     |-sub-01_run-2_acq-foo_UNIT1.nii.gz\r\n     |-sub-01_acq-bar_MP2RAGE.nii.gz\r\n     `-sub-01_acq-bar_UNIT1.nii.gz\r\n```\r\nHow many summarize json sidecars would you make? Obviously, you would not make one for each run, but would you make one for each `acq` value? Would it be useful to have something like an `IntendFor` field in the summarize json (with support for wildcards, so you don't have to include an explicit list, but just the semantics. E.g. `{\"IntendedFor\": \"bids::sub-*/anat/sub-*_run-*_acq-foo_*.nii.gz\"}`)?"
  - author: Lestropie
    createdAt: '2024-06-03T04:46:52Z'
    body: "> ... I am not sure I saw (but I never looked) application of it for .tsv files.... are you aware of some good examples uses of inheritance for .tsv files?\r\n\r\nI don't deal with a wide breadth of different BIDS data from which to generate examples, but one that always irks me is complex DWI data. It is increasingly recommended to export magnitude & phase data for DWI as it facilitates superior denoising. In the absence of inheritance, this means that the diffusion gradient table (which is currently exclusively `bvec` / `.bval` rather than `.tsv` as originally requested, but could be `.tsv` following https://github.com/bids-standard/bids-specification/pull/352) would need to be exactly duplicated across the magnitude and phase component images. Defining these data once, omitting the `_part-(mag|phase)` entity, to me makes far more sense. But as with other discussion here, this is purely use of the IP (here: Inheritance Principle) to *avoid duplication*, *not* to *supersede*.\r\n\r\n> I know that it looks like that the general consensus is that we should keep or improve the inheritance/summarization principle.\r\n\r\nThe discussion on this Issue might skew differently to community opinion. I've been told on multiple occasions that there are many who would prefer for it to be removed entirely. I don't have my finger on the pulse on exactly what those proportions might look like.\r\n\r\nOne concern I have is that a naive community poll may skew toward removal because of a) an expectation of manual curation of such and b) consideration of raw BIDS data only, whereas community opinions following a) creation of a tool for automated application and b) consideration of the complexities of derivative data may yield a different result. So I'd like to at least create a compelling case.\r\n\r\n> So how to deal with e.g.:\r\n\r\nAll depends on the metadata contents; and more esoterically whether JSON files without suffices are permitted. \r\nAt the extreme end, I could imagine:\r\n-   `sub-01.json` containing all fields applicable to all images\r\n-   `sub-01/anat/sub-01_MP2RAGE.json` containing any fields consistent across all `_MP2RAGE` images\r\n-   `sub-01/anat/sub-01_UNIT1.json` containing any fields consistent across all `_UNIT1` images (eg. units?)\r\n-   `sub-01/anat/sub-01_acq-foo.json` containing any fields applicable only to `acq-foo` (ie. how it differs from `acq-bar`)\r\n-   `sub-01/anat/sub-01_acq-bar.json` containing any fields applicable only to `acq-bar` (ie. how they differ from `acq-foo`)\r\n-   `sub-01/anat/sub-01_run-1_acq-foo.json` containing any fields applicable only to run 1 of `acq-bar` (ie. what differs to run 2, maybe acquisition time?)\r\n-   `sub-01/anat/sub-01_run-2_acq-foo.json` containing any fields applicable only to run 2 of `acq-bar` (ie. what differs to run 1)\r\n\r\nThis actually ends up with more metadata files than there are data files. But unlike exclusively using sidecars, it is immediately discoverable exactly what it is that differs between eg. entity-linked file collections `acq-foo` and `acq-bar`, by the contents of the respectively named metadata files. These may be more obscure use cases in the context of BIDS Raw, but in my experience with trying to develop complex BIDS Derivatives I think that cases like these are going to be increasingly prevalent in time.\r\n\r\nRegardless of my own opinion, I don't see the debate progressing in an informed way in the absence of tangible examples of what data look like with vs. without the IP, or in the absence of software to use or not use the IP (complex examples like that above I would never expect a human to manually curate). Hence why I invested some time and effort in generating an Issue list for such: https://github.com/Lestropie/IP-freely/issues.\r\n"
  - author: marcelzwiers
    createdAt: '2024-06-03T09:30:52Z'
    body: "> But unlike exclusively using sidecars, it is immediately discoverable exactly what it is that differs between eg. entity-linked file collections acq-foo and acq-bar, by the contents of the respectively named metadata files.\r\n\r\nYes, that's nice, but I think that this level of complexity just to deduplicate to the bitter end can be hard to grasp and would harm the acceptation / proper use of BIDS amongst the average neuroscientists. The inheritance principle makes things much less human readable and simple. For instance, I cannot just inspect a sidecar file anymore, I need tooling to search for data in the filetree hierarchy to get a complete view. So before deciding on a solution, I think we should clearly define who the users are that the inheritance principle tries to target? Is it the neuroscientist that manually edits/curates their BIDS data? Is it the programmer that makes BIDS-derivatives processing pipelines? And we need to consider if the benefits for one group of users really outweighs the downsides for the other users. I believe the summarize proposal of @yarikoptic is aimed as a middle ground?"
  - author: Lestropie
    createdAt: '2024-06-04T01:53:37Z'
    body: "Fully appreciate the argument for IP abolition. There's a good reason there's no consensus on the topic. \r\n\r\nThe question of \"not just inspecting a sidecar ... needing tooling to search for (meta)data in the file tree hierarchy\" has a natural converse, being something like \"metadata are not unique ... need tooling to determine what data in the file tree hierarchy take the same values\". There's complex relationships between metadata across data files regardless of how you cut it, it's a question of what types of operations you want to best facilitate.\r\n\r\nWhat's landed me on the pro-IP side is that I'm further along in attempting to standardise complex derivatives. Consider the second of the two cases above. In a BIDS *raw* dataset, if two data files have the same value for some metadata field, that *might* be interesting, or it might not be. I would personally argue that it communicates the natural hierarchical nature of the data, but agree it comes with a complexity cost if stored explicitly in such a way. But with BIDS raw, data files are generally pretty independent of one another (with the exception of entity-linked file collections, which I'll come back to). With BIDS Derivatives, it will be more common for there to be *more strongly linked* file collections: a \"singular\" computational outcome is often by necessity spread across multiple data files. Here, shared metadata across sidecars is not mere happenstance or an opportunity for storage compression: the dataset would be considered corrupt were those metadata to not be exactly identical across data files. Moreover, within a dataset containing many files in a modality directory, human discernment of what data files encode the results of that particular computation vs. encode something else becomes increasingly difficult; a metadata file containing the relevant fields that is applicable via IP only to data files encoding the outcome of that computation would clearly communicate that grouping.\r\n\r\nThis is really just the existing entity-linked file collections concept, only more strongly asserted. Enhancing the IP, particularly by removing the restriction of one applicable metadata file per filesystem level, would greatly enhance this concept. Currently, there's no way to really \"encode\" an entity-linked file collection. Different data files may have more or less metadata fields that are equal or different between them, and more or less mutual vs. distinct entities, but it's all quite \"fuzzy\". Defining a metadata file that is applicable to multiple data files, containing only the mutually shared metadata fields, and named based on only the mutual entities, would be *what defines* that entity-linked file collection.\r\n\r\nAlso, given the principle is not a novel proposal for 2.0 but has stood throughout 1.x, I think there's a need for better tooling regardless of what happens for 2.0. Any software for reading / writing BIDS data really should by now be fully IP-aware. And I think there's moreover [a need for software dedicated to the IP](https://github.com/Lestropie/IP-freely/issues). I think having such tooling at hand might help inform that decision making process.\r\n\r\n> I think we should clearly define who the users are that the inheritance principle tries to target? Is it the neuroscientist that manually edits/curates their BIDS data? Is it the programmer that makes BIDS-derivatives processing pipelines?\r\n\r\nFor anyone doing exclusively *manual* curation of a BIDS dataset, I would expect that curation to almost exclusively omit the IP. Most commonly they'll be running something like `dcm2niix`, which gives a NIfTI & JSON per DICOM series, followed by filesystem-level renaming. Introducing IP usage would be more manual effort and only increase likelihood of errors. So the only case where someone *might* manually utilise the IP is if they are forced to define all of their metadata manually. Even in this scenario, use of the IP is not compulsory: if a user understands the principle and their data, they can exploit it; if not, they can omit it.\r\n\r\nI think longer-term the more prevalent \"users\" will be App developers / those who interpret the *outputs* from those Apps. Writing shared metadata once to one file, appropriately named, is slightly more concise in code than having a base shared dictionary and duplicating it with minor changes across multiple output metadata files, though it's a pretty subtle difference. To me it's moreso about communication of the relationships between data files. For a BIDS Derivatives dataset, not all data files in a modality directory are equally distinct from one another; some are more strongly related than others, and the IP is one way of communicating those relationships.\r\n\r\n> I believe the summarize proposal of @yarikoptic is aimed as a middle ground?\r\n\r\nI think that proposing to change the name of the principle may be misleading as to the scope of that change. The proposal is only to forbid having some data file with multiple applicable metadata files where some field takes different values across such files. That I think would be an unambiguously good change, would simplify both lay and systematised descriptions of the principle, and would be more algorithmically compatible with automated approaches. But it wouldn't resolve any of the concerns you have yourself raised here.\r\n"
  - author: yarikoptic
    createdAt: '2024-06-06T16:56:59Z'
    body: "Attn @dorahermes  @Lestropie and others -- if in general you consider this issue/idea good -- please upvote by :+1: . If you consider it a bad idea -- downvote with :-1: . \r\n\r\nI would appreciate if general discussion of IP \"disadvantages\" would be discussed *elsewhere*, e.g. in the issue #36 if you feel strongly that IP \"must die\". **But** as far as I see it, the IP is to stay in some form, which might potentially remove some aspects  (e.g. as the *summarization* here removing overloading), and/or be enriched with additional tooling or principles (alike IntededFor for groupping).  For those I would also advise to start projects (like @Lestropie did) or other issues and cross-link back here.\r\n\r\nIn this issue, and later in a PR against bids-2.0 branch, I would appreciate more specific/targetted feedback or assistance with this idea.  E.g. \r\n- I might wait for @Lestropie 's tool and then would love to use it (or see someone contributing) to implement that checker of openneuro datasets.\r\n- may be you have some use-cases where summarization would open opportunities?\r\n- may be you want even to take a stab at formalizing it in a PR?"
- number: 64
  title: Relax extension requirements, maybe rename to formats
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/64
  author: TheChymera
  assignees: []
  labels: []
  createdAt: '2024-02-27T13:22:02Z'
  updatedAt: '2024-03-12T08:12:53Z'
  closedAt: null
  body: "With some file formats supporting data across modalities (any volumetric data can be NIfTI, any raster image can be TIFF, anyting at all can be ZARR) I wonder if it makes sense to restrict these “extensions”.\r\n\r\nI'm also wondering whether the terminology shouldn't be renamed to “formats”.\r\n\r\nMore generally, I'm also not sure why the emergence of a new format would need to be “accepted” by BIDS first before a dataset using it can be BIDS-compliant.\r\nIs there any reason why we would ever say no?\r\nIf not, why not allow any *data* format?\r\n\r\nI'm mentioning data format specifically, because for metadata files, which BIDS as a standard controls the contents of, we can't just have people using `participants.xlsx`. But BIDS does not control the analysis of TIFF, or NWB, or MNAF (my new amazing format), so why not let people use whatever fits their use case? \r\n\r\nI see some utility in discouraging bad practices, such as proprietary or `.m` files for everything, or compressed `.jpeg` for optical imaging — so maybe allowing anything would go too far. But in any case I think open formats with no compression could be globally accepted."
  comments:
  - author: sappelhoff
    createdAt: '2024-02-27T15:29:10Z'
    body: ">  Is there any reason why we would ever say no?\r\n> If not, why not allow any data format?\r\n\r\nthe main reason is to provide an incentive for people to flock around a few data formats and make them better ... as opposed to everyone \"brewing their own thing\". The latter leads to an increased burden in managing IO software, and also for end users to be able to \"know\" more data formats."
  - author: TheChymera
    createdAt: '2024-02-27T18:41:14Z'
    body: "> the main reason is to provide an incentive for people to flock around a few datasets and make them better\r\n\r\nDid you mean “data formats” instead of “datasets”? If not I don't think that's something I ever saw as a goal of BIDS, i.e. consolidating a small number of datasets as opposed to allowing better access to as many as possible — nor do I see what it has to do with data formats.\r\n\r\nIf you meant “data formats”... it's not just that we're limiting the total number of formats we support, but also constraining them per modality for reasons that are more historical than anything. In a sense that constrains the IO software. Lots of data can be represented as NIfTI, and thereby analyzed with the rich NIfTI tools, so why restrict that? Blanket permitting all/some formats would allow formats to better spread across use cases based on the tooling support they have."
  - author: sappelhoff
    createdAt: '2024-02-27T19:02:27Z'
    body: "> Did you mean “data formats” instead of “datasets”? \r\n\r\nyes, sorry.\r\n\r\n>  but also constraining them per modality for reasons that are more historical than anything.\r\n\r\nI wouldn't say that we do that for \"historical\" reasons. To my understanding we do that to reflect the most common practices in the field where a particular modality is used. For example, NIfTI is used in MRI ... but not in EEG, even though you probably *could* somehow encode EEG data in NIfTI.\r\n\r\n> Blanket permitting all/some formats would allow formats to better spread across use cases based on the tooling support they have.\r\n\r\nyes, but it will also invite edge cases, where a single dataset curator is exceptionally well versed in a particular data format and uses/applies it ... however the large majority of the community won't be able to use it because they lack the tools/skills.\r\n\r\n---\r\n\r\nI am playing a bit of a devil's advocate here. I personally don't have a big horse in this race. But I do think that fewer, rather than more, data formats are a good idea. I am saying this coming from a project like MNE-Python, where every other few months somebody is requesting support for yet another data format that is entirely unnecessary as the data could be represented in an already existing (open) format.\r\n"
  - author: yarikoptic
    createdAt: '2024-02-28T00:49:19Z'
    body: "The whole point of any standardization is to *minimize* variability. BIDS did not only minimize variability in how people name their files, but also in file formats to use. Hence you @TheChymera can always open `participants.tsv` and not some `participants.xyz` of an unknown nature. Allowing for any file format immediately opens *unlimited* variability, and thus makes standard much less valuable. And hence in BIDS we limit to most common format(s).\r\n\r\nSomeone in turn could establish some \"BIDS naming convention\" or \"BIDS naming principles\" which would then allow for arbitrary file formats to be used and rather just promote use of schema and the rest of the logic behind files organization. But it would be a different project.\r\n\r\n~~I think it is time for us to add some indicators to issues so we could get some kind of a sense on which ones to keep open or close, so :-1: this one as IMHO I do not think it would be wanted/result in being implemented.~~ apparently I have already added on that 7 months ago in README.md ;)"
  - author: poldrack
    createdAt: '2024-02-28T15:37:57Z'
    body: +1 to closing this.
  - author: TheChymera
    createdAt: '2024-02-28T21:24:42Z'
    body: "> can always open participants.tsv and not some participants.xyz of an unknown nature\r\n\r\n@yarikoptic but that's exactly *not* what I meant. I was referring to data formats specifically. I even gave the exact same example:\r\n\r\n> I'm mentioning data format specifically, because for metadata files, which BIDS as a standard controls the contents of, we can't just have people using participants.xlsx.\r\n\r\n\r\nYes, the metadata files, like the file naming conventions, are optimized for easy browsing, readability, and (maybe on purpose maybe incidentally) are very convenient to manipulate with GNU coreutils or other ubiquitous CLI packages.\r\nThe point is *data files* are different because they require additional tooling anyway:\r\n\r\n* Proposal 1: So if we already “support” a format, why not support it wherever the experimenter might find it useful?\r\n* Proposal 2: If we do not support a format yet, why not auto-support any data format? Do we have any examples where we have vetoed a file format?\r\n\r\nI already mentioned that proposal 2 was probably not as good as proposal 1, because there are *some* reasons to exclude e.g. proprietary formats.\r\n\r\n---\r\n\r\n@sappelhoff\r\n\r\n> To my understanding we do that to reflect the most common practices in the field where a particular modality is used.\r\n\r\nBut should a dataset be “invalid” for using an uncommon practice, even if it's still open source and useful to the experimenter?\r\n\r\n> yes, but it will also invite edge cases, where a single dataset curator is exceptionally well versed in a particular data format and uses/applies it ... however the large majority of the community won't be able to use it because they lack the tools/skills.\r\n\r\nIsn't that an edge case we want? Think of the following: MRI expert wants to integrate data with microscopy, and use NIfTI for everything, including the microscopy data, so it can all be handled in the same space with the same tools. Why block that?\r\n\r\n> I am playing a bit of a devil's advocate here. I personally don't have a big horse in this race. But I do think that fewer, rather than more, data formats are a good idea.\r\n\r\nIn a sense, that's addressed by proposal 1. The guy from the NIfTI example is me. I'd like to use NIfTI for more things. More broader acceptance of formats that are already accepted could materialize in a consolidation around fewer formats. I also think there are other people who would like to `.zarr` everything.\r\n"
  - author: sappelhoff
    createdAt: '2024-03-11T14:57:04Z'
    body: ">  Do we have any examples where we have vetoed a file format?\r\n\r\nduring several BEP processes (e.g., EEG, iEEG) several file formats have been vetoed"
  - author: TheChymera
    createdAt: '2024-03-12T01:32:30Z'
    body: '@sappelhoff oh, I was unaware, thanks for telling me. Do you remember which ones they were or have a link tot he discussions? I''m curious what demonstrably disqualifies a format.'
  - author: sappelhoff
    createdAt: '2024-03-12T08:12:52Z'
    body: "Most of these discussions happened on the old BEP006 Google Doc, and there was a community survey about data formats used in the community in 2018. the survey results used to be reported here: https://bids.berkeley.edu/news/bids-megeegieeg-data-format-survey. Unfortunately this archive did not preserve images: https://web.archive.org/web/20230130152808/https://bids.berkeley.edu/news/bids-megeegieeg-data-format-survey ... but perhaps you can do some digging and find something.\r\n\r\n> I'm curious what demonstrably disqualifies a format.\r\n\r\nwe wanted the file formats to:\r\n\r\n- have an open specification and be usable (in terms of a potential license)\r\n- be widely used in the community (no niche formats)\r\n- be able to hold most data the community would possibly want to save (and **all** data considering the union of all accepted formats)"
- number: 63
  title: Allow for using an arbitrary suffix and/or arbitrary entity
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/63
  author: TheChymera
  assignees: []
  labels:
  - enhancement
  - suffixes
  - flexibility
  createdAt: '2024-02-20T06:13:15Z'
  updatedAt: '2025-12-04T15:19:54Z'
  closedAt: null
  body: "As mentioned in [this issue](https://github.com/bids-standard/bids-2-devel/issues/62) there are a lot of quasi-BIDS standards. In fact, given that most people's data almost fits into BIDS, I think quasi-BIDS might be more popular than BIDS.\r\n\r\nIt has been in any case for me, just 2 examples:\r\n1. Suffixes: I ended up using `_cbv` long before we got it merged because that's what my data was.\r\n2. Key-value pairs: I'm currently working on [this data](https://github.com/bids-standard/bids-specification/issues/1697) which needs new key-value pairs that [don't mesh well, not just with current BIDS, but also not with upcoming BIDS](https://github.com/bids-standard/bids-specification/issues/1281#issuecomment-1930533153). It will thus remain quasi-BIDS for the foreseeable future.\r\n\r\nI think the first problem arises from the fact that *suffix* is currently a whitelist term. It's simply not conceivable that the “suffix” values we record will cover all possibly relevant values. It is however conceivable — given the rapid development of neuroimaging experiments — that even if we cover all relevant values, new values will emerge long before we have a chance to add them.\r\nSame goes for key-value pairs, where values are indeed flexible, but keys are again whitelisted.\r\n\r\nWhat I would propose is to increase flexibility by allowing the injection of custom key-value pairs, with the standard specifying a way to document them in the `dataset_description.json`.\r\nThe same could be done for suffix, [if we are to keep it as a special entity](https://github.com/bids-standard/bids-2-devel/issues/58), where there are certain pre-defined keys, but ultimately the keys are free-form if they have an entry in `dataset_description.json`.\r\n\r\nI know what you're thinking, it sounds like chaos, but from the usability point of view, keys are equivalent (well, maybe not `run`). Ultimately you just filter by them to create categories for comparisons. Allowing users to add a new custom category for their data would provide a more natural and lightweight method for key adoption than it being tied to a BEP. It would also prevent people from constantly having the impulse to overload predefined key-value pairs, particularly `acq-` attracts a lot of that, but I've also seen it for `task-`. This would make the keys that we *do* specify less prone to abuse and more standard.\r\n\r\nAs BIDS becomes bigger and more widely adopted I also expect the BEP process to become increasingly lengthy and complicated for newcomers, so it would be nice to have built-in “extension” support in the actual dataset. No pull/merge/delay involved.  "
  comments:
  - author: yarikoptic
    createdAt: '2024-02-26T20:05:38Z'
    body: "\"Make BIDS-2 more flexible\" is not specific enough. Many (if not all) issues filed here are already about that topic. To me it sounds like\r\n\r\n## Allow for using an arbitrary suffix and/or arbitrary entity\r\n\r\nwhich I will rename this issue to now. And indeed from current description it sounds like \"chaos\" and to the degree of desired effect here is **already possible** since if someone does not care about standardizing (in effect what *whitelisting* within standard does) - they can just use them and add to `.bidsignore` to pacify the validator. The point is that nobody besides selected few would know how to treat those ad-hoc suffixes/entities.  But ok -- let's use aforementioned suggested name for this method. And \"chaos\" could be reduced as such specification could \"complement\" BIDS schema and thus BIDS validator  should be able to take advantage of those additional suffixes/entries, so they would not be ignored but validated against, and tools/queries (if tools support flexible suffix/entities handling) would be able to handle them.\r\n\r\nBut overall - it might be a large effort to formalize such specification.  It is pretty much on par with \"**Allow for a list of BIDS Extensions to augment schema with**\" approach below in that it would require a \"language\" flexible enough to specify them - across different data types, etc. \"**Allow to point to a forked BIDS schema**\" might be much easier to achieve but would be more fragile.\r\n\r\n# Alternatives/Complimentary approaches:\r\n\r\nThe whole point behind BEPs and me facilitating smaller atomic changes such as PRs for adding individual entities (ref: https://github.com/bids-standard/bids-specification/issues/371) is to standardize the semantic behind those added suffixes/entities. \r\n\r\nBut then we can parallel to\r\n- NWB where there are facilities for \"NWB extensions\" which in a sense add additional schema for data structure within NWB for a needed aspect: https://github.com/nwb-extensions .  There it makes it possible for PyNWB (and MatNWB) to load such data and access that added extended namespace. \r\n- Similar'ish discussion is going on in Zarr [ZEP0004](https://zarr.dev/zeps/draft/ZEP0004.html) on formalizing referencing of *conventions* imposed on top of a Zarr, which is otherwise a generic array storage format.\r\n\r\nNow that we have BIDS schema, it sounds feasible to indeed formalize some way to establish specification of either \"Forked BIDS\" or \"BIDS with extensions\".\r\n\r\n## Allow to point to a forked BIDS schema\r\n\r\nYou must remember how we used that custom `BIDSVersion` with a branch of the modified schema in DANDI. So this could be one way to allow a \"forked BIDS\": where e.g. BIDSVersion would point to a forked schema prefix. Then tools would need to be able to download and use that schema instead of the one identified by a version string.  But it would still limit applicability since it would not be clear (to a human or a machine) on what those changes in the fork are.  Kinda along with the concern I raised in  https://github.com/ome/ngff/issues/228#issuecomment-1960434309 where the idea is to point to a zarr extension with a versioned URL, but thus not revealing \"semantic\" of that target.\r\n\r\n## Allow for a list of BIDS Extensions to augment schema with\r\n\r\nWork out on how to provide \"overlay\"/\"extension\" to BIDS schema and then have something like `BIDSExtensions: [...]` which would allow for an overlay on top of current (specified in BIDSVersion) schema.  That is somewhat more inline with NWB extensions, which even go further and store that schema within NWB file itself.\r\n"
  - author: TheChymera
    createdAt: '2024-02-27T12:35:12Z'
    body: "> `.bidsignore` [vs.]  thus BIDS validator should be able to take advantage of those additional suffixes/entries, so they would not be ignored but validated against\r\n\r\nYes, that's what I meant. `.bidsignore` just means “this is not BIDS”, which is useful to keep, but it would be good to allow additional key-value pairs to be validated and parsed.\r\n\r\n---\r\n\r\nThe problem I see with these two approaches you suggested (and incidentally with NWB extensions):\r\n\r\n> Allow for a list of BIDS Extensions to augment schema with\r\n\r\n> Allow to point to a forked BIDS schema\r\n\r\nis that now you need to keep track of not only your data, but the corresponding schema directory, and of course a validator that can parse it. This is the validator version vs. BIDS version vs. schema version discussion again, but with the added complexity of plug-in management/compatibility (what if two schema extensions conflict?) on top of that.\r\n\r\nIn a sense the reason why we have a schema at all is to manage the logic of what entries are allowed where. Following the reference re-write (see the lines starting with `$ref` [here](https://github.com/bids-standard/bids-specification/blob/f90fd70bfe988162066ecbdcd475fe08e4c09fb5/src/schema/rules/files/deriv/imaging.yaml)), the schema has become more parsimonious and intransparent for human reading.\r\n\r\nSo if anything the concern of intransparency\r\n\r\n> The point is that nobody besides selected few would know how to treat those ad-hoc suffixes/entities.\r\n\r\nwould apply to schema forking and schema extensions more than to custom key injection.\r\nWith respect to the “user”, i.e. analyzer of the data, ultimately keys are just categories for analysis, which can have a human-readable blurb, like everything else does.\r\n\r\nA simple specification for adding custom keys in a dataset, would be easy to produce for anybody willing to look up an example — and easy to interpret for anybody willing to open the description text file:\r\n\r\n```json\r\n{\r\n  \"Name\": \"The mother of all experiments\",\r\n  \"BIDSVersion\": \"2.0.0\",\r\n  \"DatasetType\": \"raw\",\r\n  \"License\": \"CC0\",\r\n  \"Authors\": [\r\n    \"Paul Broca\",\r\n    \"Carl Wernicke\"\r\n  ],\r\n  \"CustomKeys\": [\r\n    {\r\n      \"Shorthand\": \"seed\",\r\n      \"Description\": \"Injection site for connectivity tracer\",\r\n      \"Directory\": true\r\n    }\r\n  ],\r\n}\r\n```\r\n\r\nSince the key is dataset-specific, the schema logic is unnecessary, so I see no need to overcomplicate this specification process by requiring it to be encoded it in a derived schema."
  - author: yarikoptic
    createdAt: '2024-02-28T01:29:46Z'
    body: "*as is* this would be \"too open\" since would not bind to specific modalities etc, not stating the order (ok - could be added last; or have \"AfterEntity\" to specify which entity to go after) among entities, which level the `Directory` created on, although might play well with \r\n- #54 \r\n \r\nSo indeed would be more useful for humans than just ignoring in .bidsignore, but it might need more thought on specification (note there is no Keys, there is Entities) to become viable. "
  - author: TheChymera
    createdAt: '2024-02-28T21:54:14Z'
    body: "> but it might need more thought on specification \r\n\r\nOk, I'd be happy to think it out more.\r\n\r\n> could be added last; or have \"AfterEntity\" to specify which entity to go after\r\n\r\nIs explicit ordering going to be part of BIDS2? If not, `AfterEntitiy` is not needed.\r\n\r\nI always thought “entity” refers to the “key”+“value” pair, but ok, let's fix that.\r\nAnything else we should maybe include in the following?\r\n\r\n```json\r\n{\r\n  \"Name\": \"The mother of all experiments\",\r\n  \"BIDSVersion\": \"2.0.0\",\r\n  \"DatasetType\": \"raw\",\r\n  \"License\": \"CC0\",\r\n  \"Authors\": [\r\n    \"Paul Broca\",\r\n    \"Carl Wernicke\"\r\n  ],\r\n  \"CustomEntities\": [\r\n    {\r\n      \"Shorthand\": \"seed\",\r\n      \"Description\": \"Injection site for connectivity tracer\",\r\n      \"Directory\": true,\r\n    }\r\n  ],\r\n}\r\n```"
  - author: yarikoptic
    createdAt: '2024-02-29T15:49:53Z'
    body: "> Is explicit ordering going to be part of BIDS2?\r\n\r\nI don't think there is any incentive so far to get rid of it, but actually looking into how to implement #54 might add an aspect on that.\r\n\r\nAs for if anything else -- I think it would be valuable and useful for BEP032 if you looked into contributing to \r\n\r\n- https://github.com/bids-standard/bids-specification/pull/1705\r\n\r\non some entity which is to be added in BEP032 (if any) to see what it \"takes\" - ie what is there besides order (e.g. specification which data types it applies, etc.) And that as a result would guide you to provide a complete spec above.\r\n"
- number: 62
  title: 'Use-case(s): BIDS-inspired/like standards'
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/62
  author: yarikoptic
  assignees: []
  labels: []
  createdAt: '2024-02-13T16:02:30Z'
  updatedAt: '2025-06-10T11:39:56Z'
  closedAt: null
  body: "Quite often projects do not adopt BIDS due to complexity or not perfect fit, and then establish new a file layout and/or metadata convention/standard while saying they are \"BIDS-like\".  **The likeness varies greatly.** Quite often it is simply the aspect of having folders and file names with some metadata in them. Those are not worth mentioning here. But there is a good number of BIDS-like standards (in my words - *formalized descriptions adopted by a considerable number of people*) which are worth reviewing and analyzing for what could minimize divergence between them and current BIDS through possibly introducing missing but reasonable and desired features into BIDS 2.0.\n\nThis issue would be used to collect pointers and possibly summarize rationale and major features behind them.\n\n### DANDI layout \n\nEstablished by me and @satra for https://dandiarchive.org, primarily due to complete lack of usable standard/layout at that earlier point in time . \n\n- There is no specification, and layout is largely \"enforced\" via `dandi organize` command on a set of .nwb files.\n- `dandiset.yaml` schema is defined within pydantic model in https://github.com/dandi/dandi-schema/blob/master/dandischema/models.py#L1405\n- see https://github.com/dandi/dandi-cli/issues/1498\n\n<details><summary>Notable divergences:</summary>\n\n- no `dataset_description.json` - metadata is in \"in-house\" `dandiset.yaml`\n- no `ses-*/` level subfolder but there is `ses-` entity in the target filenames (convergence possible through #54)\n- no datatype (AKA modality) subfolder (related: #55, convergence possible through #54)\n- main file format is `.nwb` (convergence through https://bids.neuroimaging.io/bep032 for animal ephys data, discussed/not (yet) accepted in BIDS 1.0 for `micr/`: https://github.com/bids-standard/bids-specification/pull/1632)\n- entity labels/values could contain `-` and `+`.  (TODO: ref BIDS PR)\n- Suffix can contain `+` (no PR yet I think)\n- Suffix contains (often multiple) data modalities contained within the single .nwb file, concatenated with `+`\n\n</details>\n\n### PsychDS\n\nhttps://psych-ds.github.io/  https://github.com/psych-ds/psych-DS (attn @mekline and @bleonar5 - would appreciate details/feedback alike for DANDI here or in a dedicated issue/doc)\n\n- Overall motivation: Re-use BIDS schema formalization to derive a customized subset of the BIDS standard to simplify domain specific use and adoption.\n\n### NeuroBlueprint\n\nhttps://neuroblueprint.neuroinformatics.dev/latest/specification.html .\nRequest for summarization of rationale/divergences: https://github.com/neuroinformatics-unit/NeuroBlueprint/issues/51\n\n### SPARC Data Structure (SDS)\n\nThe [SPARC platform](https://docs.sparc.science/) has a preprint online that describes a BIDS inspired data structure: https://www.biorxiv.org/content/10.1101/2021.02.10.430563v2. Rough details are also on their [wiki](https://docs.sparc.science/docs/overview-of-sparc-dataset-format).\n- Example dataset online: https://sparc.science/datasets/382?datasetDetailsTab=files and in https://metacell.github.io/sds-viewer/?doi=10.26275%2Fcheq-otb2\n- Document on [\"population, specimen, subject, sample\"](https://github.com/SciCrunch/sparc-curation/blob/master/docs/participants.org)\n\n\n### TemplateFlow\n\nhttps://www.templateflow.org/usage/archive/#acceptable-data-types\n\n- A related discussion \"has happened\" in https://github.com/bids-standard/bids-specification/issues/1281\n\n### Brain-Development.org Atlas\n\nhttps://brain-development.org/brain-atlases/atlases-from-the-dhcp-project/cortical-surface-template/ describes itself as \"using BIDS conventions\", and proceeds to define custom entities and metadata.\n\n### NiPoppy\n\nStudy-level description which includes bids dataset and uses some conventions (like `derivatives/` subfolder with clearer defined naming convention).\n\n- https://github.com/bids-standard/bids-specification/pull/1861 attempts to converge NiPoppy and BIDS\n\n### CAPS\n\n[ClinicA Processed Structure](https://aramislab.paris.inria.fr/clinica/docs/public/latest/CAPS/Introduction/):\n\n> When the development of Clinica started in 2015, the BIDS specifications did not provide specific rules for the processed data. As a result, the goal of CAPS (designed by the [Aramis Lab](http://www.aramislab.fr/)) was to define a hierarchy for the data processed using Clinica. The idea is to include in a single folder all the results of the different pipelines and organize the data following the main patterns of the BIDS specification.\n>\n> ## Several differences exist between the BIDS and CAPS specifications.\n>\n> - Instead of the BIDS derivatives/ folder, the processed data are stored in the CAPS folder.\n> - CAPS assumes that the session is always present in a BIDS dataset even though there is a single session. In other words, all datasets are considered longitudinal, even when they have only one session.\n> - NIfTI files generated by a Clinica pipeline are always compressed. Compression is recommended by the BIDS specification but not mandatory.\n\n### b2ai-voice\n\n@satra pointed to https://docs.b2ai-voice.org/ where BIDS-inspired organization was also used and looked like\n\n```\n└── sub-<participant_id>\n    ├── ses-<another_session_id>\n    │   ├── beh\n    │   │   ├── sub-<participant_id>_ses-<session_id>_task-<task_name>_run-<index>_metadata.json\n    │   │   └── sub-<participant_id>_ses-<session_id>_task-<task_name>_run-<index>_response.json\n    │   └── voice\n    │       ├── sub-<participant_id>_ses-<session_id>_task-<task_name>_run-<index>_audio.wav\n    │       ├── sub-<participant_id>_ses-<session_id>_task-<task_name>_run-<index>_features.pt\n    │       ├── sub-<participant_id>_ses-<session_id>_task-<task_name>_run-<index>_metadata.json\n    │       └── sub-<participant_id>_ses-<session_id>_task-<task_name>_run-<index>_transcript.txt\n```\n\nmuch relevant to that particular use-case is the \n- https://github.com/bids-standard/bids-specification/issues/1771 \n\n### EBRAINS: [Clinical Connectome](https://www.ebrains.eu/news-and-events/a-new-ebrains-large-scale-brain-scanning-endeavour-is-being-coordinated-in-padua)\n\nNo publicly shared (yet) spec. Shared at BIDS meeting: EBRAINS_WP2_New_proposed_Data-Management-Plan_BIDS-like.docx .\n\nTODOs:\n\n- [ ] represent/quantify divergences from BIDS in form of a table. Dimensions/features\n    - need for extra entities\n    - need for alternative folders hierarchy\n       - need for new modalities\n    - need for other file formats (there MINC BIDS?) \n\n## Mermaid diagram for above\n\n```mermaid\n---\nconfig:\n  layout: dagre\n---\nflowchart LR\n  OpenfMRI --Inspired--> BIDS-project\n  %% & BIDS-stats-models\n \n  subgraph BIDS-project\n\n    BIDS \n    BEP028[\"<a href=https://bids.neuroimaging.io/bep028>BEP028:Prov</a>\"] -.->BIDS\n    BEP032[\"<a href=https://bids.neuroimaging.io/bep032>BEP032:Microphys</a>\"] -.->BIDS\n    PR1972[\"<a href=https://github.com/bids-standard/bids-specification/pull/1972>#1972: DatasetType=project</a>\"] -.->BIDS\n    BIDS-stats-models\n    BIDS2[\"<a href=https://github.com/orgs/bids-standard/projects/10>BIDS 2.0</a>\"]\n    BIDS2 -.make more modular,consistent,flexible.-> BIDS\n  end\n\n  BIDS --allowed for--> supplements\n  BIDS --inspired--> bids-like\n  BIDS --basis for--> bids-schema-based\n  %% bids-canna-be -.could converge.-> BIDS\n\n  subgraph bids-like[\"BIDS-like\n  more at <a href=https://github.com/bids-standard/bids-2-devel/issues/62>bids-2-devel/issues/62</a>\"]\n\n    DANDI(\"<a href=https://github.com/dandi/dandi-cli/issues/1498>DANDI</a>\")\n    DANDI -.->BEP032\n    DANDI -.->BIDS2\n    NeuroBlueprint(\"<a href=https://neuroblueprint.neuroinformatics.dev/specification.html>NeuroBlueprint</a>\")\n    \n    SDS(\"<a href=https://neuroblueprint.neuroinformatics.dev/specification.html>SDS(SPARC)</a>\")\n    TemplateFlow\n    Brain-Development.org-Atlas\n    CAPS(\"<a href=https://aramislab.paris.inria.fr/clinica/docs/public/latest/CAPS/Introduction/>CAPS</a>\")\n    b2ai-voice(\"<a href=https://docs.b2ai-voice.org>b2ai-voice</a>\")\n  end\n\n  subgraph bids-schema-based[Reuse BIDS schema machinery]\n    PsychDS[<a href=http://psychds-docs.readthedocs.io/>PsychDS</a>]\n  end\n\n  subgraph bids-canna-be\n    Nipoppy -.could converge on.->PR1972\n  end\n\n\n  %% TODO: revert arrow back, place \n  %% bids-canna-be --> BIDS\n  subgraph supplements[\"Supplements (BIDS-'valid')\n    rely on adding extra metadata\"\n    ]\n    \n    subgraph ldbids[\"Linked BIDS\"]\n        Neurobagel(\"<a href=https://neurobagel.org>Neurobagel</a>\")\n        NIDM-Terms\n    end\n    converters[\"dcm2niix,heudiconv\"] -.->BEP028\n  end\n\n  style OpenfMRI stroke:#000000,fill:#F2F7D2 \n  %% C3EFE0\n\n  style BIDS stroke:#000000,fill:#BEF6AC\n  style BIDS-stats-models stroke:#000000,fill:#BEF6AC\n\n  style supplements stroke:#000000,fill:#F6ACD8\n  style bids-schema-based stroke:#000000,fill:#F6ACD8\n  style bids-canna-be stroke:#000000,fill:#F6ACD8\n  style bids-like stroke:#000000,fill:#F6ACD8\n```"
