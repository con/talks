- number: 97
  title: Formalization of "entities" flow or new-function-in-life for _mod-
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/97
  author: yarikoptic
  assignees: []
  labels: []
  createdAt: '2026-03-27T13:49:40Z'
  updatedAt: '2026-03-27T13:49:40Z'
  closedAt: null
  body: "Came out of going through \n- https://github.com/bids-standard/bids-specification/pull/2022\n\nand relating to various issues we have already about ambiguity of datatype/modality/suffix trinity (https://github.com/bids-standard/bids-specification/issues/1800, https://github.com/bids-standard/bids-2-devel/issues/72, etc), where I think we are missing an entity, where `_mod-` is kinda closest ATM but I think should be something else in the long run.  This issue is similar in vein to\n\n- #85 \n\nbut rather about folder/filename construction/flow, which could be summarized as  - ATM we need an extra entity to tell what we \"encode\" in `{datatype/}` folder name when we would like to \"mix-in\" those files in other \"{datatype}/\" folders or at some top level `{datatype/}` (like `stimuli/` (@bids-standard/bep044 ) or `phenotype/` (@bids-standard/bep036)\n\nIn the context of https://github.com/bids-standard/bids-specification/pull/2022 I kept thinking about this naming issue and also IMHO it relating very much to @effigies comment about `_photo` and `_asllabeling` raised in\n\n- https://github.com/bids-standard/bids-specification/pull/2367 \n\nI feel that for consistency here need to harmonize filename construction also as relating to \n\n- https://github.com/bids-standard/bids-specification/pull/1809\n\nwhich boils down to having a path\n\n    {entities-defined-folders}[/{datatype-groupping-folder}]/{entities-defining-folders}_{entities-to-tell-apart}_{suffix-defining-datatype}.{extension}\n\nand the point is that here we talk about `stimuli/`.  So, regardless where such files are, aggregated under `stimuli/` or seggregated under individual currently present `{entities-defined-folders}/{datatype-groupping-folder}`, we need an entity which defines that \"datatype\" goal/purpose/[function-in-life](https://www.youtube.com/watch?v=HxJItB9FIqQ).  Hence for aforementioned `_photo` and `_asllabeling` we need some descriptive dedicated entity IMHO to e.g. tell apart stimuli from behavior record etc, and be able to \"re-layout\" to \"aggregate\" that file back under groupping like `stimuli/` where `stim-` is required. Hence here it feels that I should retain `stim-` entity as well.\n\nBut in BIDS we have \"one other\" approach utilized -- it is that `datatype-groupping-folder/` we have in per-sub folders ATM.  That is where having `beh/` seemingly would be sufficient to tell that `_audiovideo.mp4` file in BEP  \nbut another approach we have now is that `{datatype-groupping-folder}/` so in [bep047](https://bids-specification--2231.org.readthedocs.build/en/2231/modality-specific-files/behavioral-experiments.html) it would be really that `beh/` folder which would tell that \n  \n<img width=\"2162\" height=\"54\" alt=\"image\" src=\"https://github.com/user-attachments/assets/baa7d267-4fe1-4d52-93e2-01e9e4a95c24\" />\n \npurpose is recording of behavior and not stimuli.  We do still have some `_stim.{json,tsv}` files to \"index\" into `stimuli/` top level folder.\n\nAlso we have [`_mod-`](https://bids-specification--2231.org.readthedocs.build/en/2231/appendices/entities.html#mod) entity, defined only for MRI, and the \"function-in-life\" of which to absorb the suffix which defined its original function in life when transformation (e.g. brain extraction) happened and suffix changed to e.g. `_defacemask` thus to state that the file is a the mask and its purpose was defacing (kinda mixing too things like _asllabeling does -- that it is a media file for the purpose of capturing parameters from the screen).\n\nBut overall, the underused `_mod-` seems to be the one to tell files apart based on their \"modality\" (closely related to `datatype-groupping-folder/`) whenever there is no specific other entity to tell files apart.  So it feels that here, if I could not come-up with the `<label>` to use for `_stim-` entity in my case, I could have just added `_mod-stim` (and we have `_stim` suffix *already*!) to tell apart \"stimuli\" file under eg. `beh/` folder. Or we could have `_mod-stim` and `_mod-beh` if two otherwise identically named files capturing stimuli and behavior were placed along side with the data file(s) for that session, which relates to\n\n- https://github.com/bids-standard/bids-2-devel/issues/93\n\nIn such cases though, using only `_mod-` to tell apart, and not specific entity like `_stim-`, would then allow me to \"aggregate\" within corresponding `datatype-groupping-folder/`, which I feel could even be the top level one like `stimuli/` (which is the one for `stim` \"suffix\" AKA \"modality\" relating to \"datatype/\"), and REMOVE that entity from the file since it would get \"represented\" in the folder name!  Unless I have many/conflicting ones where I would need to use `"
  comments: []
- number: 96
  title: Consistently use seconds for metadata fields instead of milliseconds
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/96
  author: tsalo
  assignees: []
  labels:
  - metadata
  createdAt: '2026-01-24T17:29:57Z'
  updatedAt: '2026-01-24T18:32:55Z'
  closedAt: null
  body: 'There are currently 45 metadata fields that use seconds or milliseconds. 42 of them use seconds and only 3 use milliseconds. For the sake of consistency, I propose we switch from milliseconds to seconds for these fields (`LabelingPulseDuration`, `LabelingPulseInterval`, and `EditPulse.PulseDuration`) and commit to using seconds for similar fields in the future.


    Stems from https://github.com/bids-standard/bids-specification/pull/2309#issuecomment-3791665965.'
  comments:
  - author: markmikkelsen
    createdAt: '2026-01-24T18:32:55Z'
    body: This sounds like a good idea for `v2.0`.
- number: 95
  title: Allow tabular files for volume-wise metadata
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/95
  author: tsalo
  assignees: []
  labels:
  - enhancement
  - common-principles
  - metadata
  createdAt: '2026-01-23T17:19:44Z'
  updatedAt: '2026-01-24T17:42:21Z'
  closedAt: null
  body: 'Volume-wise metadata fields (e.g., RepetitionTimePreparation, EchoTime) make JSON files less readable, so it might be useful to put that kind of metadata in tabular files. ASL data already have something similar (the `aslcontext.tsv` file, which has one column called "volume_type" that is effectively a volume-wise metadata field).


    I propose we generally allow something like `<suffix>context.tsv` files, and a given imaging file''s metadata should be the union of volume-wise metadata from the context file(s) and other metadata from the JSON file(s).


    A minor issue is that, by convention, column names in TSV files are in `snake_case` and metadata fields are in `UpperCamelCase`. I think we would probably want to use `UpperCamelCase` for the context file column names to make it easier to combine metadata across files.


    Stems from https://github.com/bids-standard/bids-specification/issues/2302#issuecomment-3786957403 and relates to #77.'
  comments:
  - author: tsalo
    createdAt: '2026-01-24T17:39:10Z'
    body: "As an example, this might be what we could have for a multi-delay PCASL scan:\n\n```\nsub-01/\n    perf/\n        sub-01_asl.nii.gz\n        sub-01_asl.json\n        sub-01_aslcontext.tsv\n```\n\nContents of sub-01_asl.json:\n\n```json\n{\n    \"ArterialSpinLabelingType\": \"PCASL\",\n    \"BackgroundSuppression\": true,\n    \"BackgroundSuppressionNumberPulses\": 4,\n    \"EchoTime\": 0.01078,\n    \"FlipAngle\": 120,\n    \"LabelingDuration\": 1.8,\n    \"M0Type\": \"Included\",\n    \"MRAcquisitionType\": \"3D\",\n    \"MagneticFieldStrength\": 3,\n    \"Manufacturer\": \"Siemens\",\n    \"ManufacturersModelName\": \"Prisma\",\n    \"PCASLType\": \"unbalanced\",\n    \"RepetitionTimeExcitation\": 5,\n    \"RepetitionTimePreparation\": 5,\n    \"SliceThickness\": 3,\n    \"TotalAcquiredPairs\": 4\n}\n```\n\nContents of sub-01_aslcontext.tsv:\n\n| VolumeType | PostLabelingDelay |\n| --- | --- |\n| m0scan | n/a |\n| label | 0.8 |\n| control | 0.8 |\n| label | 1.0 |\n| control | 1.0 |\n| label | 1.2 |\n| control | 1.2 |\n| label | 1.4 |\n| control | 1.4 |\n\n"
- number: 94
  title: Formalize "summaries" over BIDS concepts (suffixes, entities, datatypes, ...) on top level
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/94
  author: yarikoptic
  assignees: []
  labels:
  - enhancement
  - 1.0-compatible
  createdAt: '2025-12-04T17:37:53Z'
  updatedAt: '2025-12-19T00:21:32Z'
  closedAt: null
  body: "ATM we can provide summaries for many entities (`participants.tsv`, `sessions.tsv`) etc, which could even appear on top level through inheritance, so users can \n\nBut ATM we rely on users to look into sample `sub-*` folders and potentially session subfolders to discover what modalities datatypes are there in dataset! Also which BIDS entities were used throughout and how frequently (e.g. was it multi-echo dataset?)\n\nI think it would be great to formalize having top level .tsv files which would provide summaries over them + tools (could be in bidsschematools), such as \n\n- `bids+entities.tsv` - list of all entities used with number of distinct values and in how many files used\n   - ATM people need to look at number of lines in `participants.tsv`, but here they could just look through the table    \n   - validator could validate that those would correspond to number of records in `{entity_plural}.tsv` such as `participants.tsv`\n   - note that we have `_mod-` (\"modality\") entity, so that one would be there, and thus no `modalities.tsv` suggested below.\n- `bids+suffixes.tsv` - list of all suffixes used with number of distinct values and in how many files used\n   - that is the one  which would immediately give useful information about available particular data types present\n- `bids+datatypes.tsv` - higher level instrumentation concepts mapping likely 1-to-many to suffixes, such as \"MRI\", \"EEG\", ...\n\nExplanation for choice of naming prefix:\n\n- added `bids+` prefix to avoid confusing them with some `{entity_plural}.tsv` such as `participants.tsv`, `sessions.tsv` etc which could appear there \"naturally\" or via inheritance principle.  \n- used  \"+\" instead of \"-\" since with `bids-` we \"introduce\" some notion of a `bids` entity.\n  -  might have been a suboptimal decision in the scope of https://github.com/bids-standard/bids-specification/issues/2273 where I propose to use `+` as well so it would bring \"meaning\" conflict back\n  \n### Potential extensions, but may be would be a part of their respective BEPs\n\n- in scope of bep036 (pheno; @bids-standard/bep036 ) and similar to PsychDS \"bids-inspired\" standard -- collect/provide summary over tools/variables measured/collected in the dataset!\n\n### Related efforts elsewhere \n\n#### DANDI archive\n\n<details>\n<summary>\nBased on the files in the dandiset, cron job on the server updates metadata record summarizing information about modalities, species, etc across\n</summary> \n\ne.g. visit https://dandiarchive.org/dandiset/001676?pos=1\n\nto see smth like\n\n<img width=\"2862\" height=\"1862\" alt=\"Image\" src=\"https://github.com/user-attachments/assets/5e685aaf-9b3c-43af-9918-d7cd0072e6e5\" />\n\nwhich is rendered version of \"assetsSummary\" within this json record https://api.dandiarchive.org/api/dandisets/001676/versions/draft/\n\nAlso note that those are approaches are coming from OBI — Ontology for Biomedical Investigations; https://www.ebi.ac.uk/ols4/ontologies/obi  -- would be nice to have similar alignment here\n\n\n</details>"
  comments:
  - author: teonbrooks
    createdAt: '2025-12-18T20:12:01Z'
    body: 'after having worked with bids datasets quite a bit recently, I also agree we should have some sort of summary file. in particular, it would be great if we could say list out all the runs for a given task in a tsv. right now, we have to rely on glob or re to access files in patch. If there were a table we could use to look up files, it would make access more seamless.


      i haven''t really thought through exactly how this should be implemented. the barrier comes from the variable folder depth a participant could have (e.g. number of sessions, whether there is a sess level, etc.). now that i''m thinking through the proposal, if the columns correspond to the entities and can restructure the folder structure, then that does make the most sense. it would also need to have a way of handling missing runs/sessions/etc.'
  - author: yarikoptic
    createdAt: '2025-12-19T00:21:10Z'
    body: if we extend with data modality suffix, smth like `subject+session+tasks+runs_bold.tsv` which would be long form index providing potentially annotations for each combination etc. Then `subject+session_bold.tsv` could provide summaries per each subject as `n_sessions, n_runs, n_tasks` summaries, or make it even wider and have column groups per each task (`rest_n_sessions`, `rest_n_runs`, ...) if so desired?
- number: 93
  title: Dissolve (remove) `{datatype}/` level/folder
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/93
  author: yarikoptic
  assignees: []
  labels:
  - 'impact: high'
  - folder-structure
  - consistency
  - auto-migrate
  createdAt: '2025-12-04T15:15:38Z'
  updatedAt: '2025-12-04T18:07:53Z'
  closedAt: null
  body: "**Rationale**:\n- decisions on what modalities should gain their own `{datatype}/`s folders heated up many discussions, e.g.\n  - https://github.com/bids-standard/bids-specification/discussions/2218#discussioncomment-14626199 \n- it remains unclear where some \"shared\" (`_events.*`, `_physio.*` etc) modalities should be placed\n  - well, \"shared\" here is also oxymoronic since usually it just implies co-acquisition and various datatypes could already be acquired simultaneously e.g. phyio, eeg, mri\n- we already mostly have 1-to-1 correspondence of modalities (in suffixes) and datatypes , it is mostly the MRI, which inspired BIDS, where we have different `{datatype}/` folders, with now confusing association (e.g. `func/` could be \"functional\" for EEG and others... )\n- most of the time\n- it should be \"easy\" to auto-migrate\n- ...\n\n**Cons/Potential solutions** \n\n- It will require tools to adjust but should be relatively easy\n- Currently it is easy to assess what data modalities dataset has, e.g. \"eeg etc\"\n  - argument: \"not really\" especially in the case of multiple sessions since we would have different\n  - *solution*: https://github.com/bids-standard/bids-2-devel/issues/94\n     - in scope of bep036 (pheno) and similar to PsychDS \"bids-inspired\" standard -- collect/provide summary over tools/variables measured/collected in the dataset! \n-  ...\n\nThis would provide an alternative solution which would address/fix:\n\n- Closes #28\n- Closes #37\n- Closes #72 \n- Closes #45 I think as it would eliminate notion of \"independence\". IMHO \"independent\" would mean - a different session.\n- Closes #55\n-  ...\n\nRelates to\n- #54 as would make it easier (no non `{entity}-{label}/` folders)\n\nattn @bids-standard/maintainers @bids-standard/steering as the idea came up (unless there is already an issue somewhere) during our meeting today Dec 4, 2025"
  comments: []
- number: 92
  title: Use "=" instead of "-" as in `entity=<label|index>` instead of `entity-<label|index>`
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/92
  author: yarikoptic
  assignees: []
  labels:
  - folder-structure
  - consistency
  - auto-migrate
  createdAt: '2025-11-26T17:35:24Z'
  updatedAt: '2026-02-17T14:14:50Z'
  closedAt: null
  body: "Inspired by looking into duckdb's feature of \"hive partitioning\" (https://duckdb.org/docs/stable/data/partitioning/hive_partitioning) very reminiscent of the BIDS folders structure, see [e.g. duckdb example](https://duckdb.org/docs/stable/data/partitioning/hive_partitioning#hive-partitioning):\n\n```\norders\n├── year=2021\n│    ├── month=1\n│    │   ├── file1.parquet\n│    │   └── file2.parquet\n│    └── month=2\n│        └── file3.parquet\n└── year=2022\n     ├── month=11\n     │   ├── file4.parquet\n     │   └── file5.parquet\n     └── month=12\n         └── file6.parquet\n```\n\nand unfortunately duckdb not yet allowing to use different separator (`-` instead of `=`; and `_` instead of `/` ;) ) so could be applied directly to BIDS datasets:\n\n- https://github.com/duckdb/duckdb/discussions/19820\n\n\npotentially it originates from Arrow:\n\n- https://arrow.apache.org/docs/python/generated/pyarrow.dataset.HivePartitioning.html\n\n@CodyCBakerPhD even shown stronger positive feeling for this as it is indeed a better semantic alignment to \"variable=value\".\n\n## Cons are imho singular:\n- huge breaking change\n\n## Pros:\n- \"=\" is more natural there\n- any tool with hive partitioning would be able to understand BIDS!\n- \"auto-migrate\"able (added new label) - datasets could migrate easily\n- would open `-` for more adequate use/allowance within labels"
  comments:
