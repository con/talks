  createdAt: '2024-05-15T15:18:22Z'
  updatedAt: '2024-05-31T15:50:53Z'
  closedAt: null
  body: "Generalization of the \r\n- #15 \r\n\r\nLooking at column names we do not have consistency.\r\n\r\n<details>\r\n<summary>grep '^[a-z]' src/schema/objects/columns.yaml | grep -v __ </summary> \r\n\r\n```shell\r\nabbreviation:\r\nage:\r\ncardiac:\r\nchannel:\r\ncolor:\r\ncomponent:\r\ndetector_type:\r\nderived_from:\r\ndesc_id:\r\ndescription:\r\ndimension:\r\nduration:\r\nfilename:\r\nhandedness:\r\nhemisphere:\r\nhigh_cutoff:\r\nhplc_recovery_fractions:\r\nimpedance:\r\nindex:\r\nlow_cutoff:\r\nmanufacturer:\r\nmapping:\r\nmaterial:\r\nmetabolite_parent_fraction:\r\nmetabolite_polar_fraction:\r\nnotch:\r\nonset:\r\npathology:\r\nparticipant_id:\r\nplasma_radioactivity:\r\nreference_frame:\r\nrespiratory:\r\nresponse_time:\r\nsample_id:\r\nsample_type:\r\nsampling_frequency:\r\nsession_id:\r\nsex:\r\nshort_channel:\r\nsize:\r\nsoftware_filters:\r\nspecies:\r\nstatus:\r\nstatus_description:\r\nstim_file:\r\nstrain:\r\nstrain_rrid:\r\ntime:\r\ntrial_type:\r\ntrigger:\r\nunits:\r\nvolume_type:\r\nwavelength_nominal:\r\nwavelength_actual:\r\nwavelength_emission_actual:\r\nwhole_blood_radioactivity:\r\nx:\r\ny:\r\nz:\r\ntemplate_x:\r\ntemplate_y:\r\ntemplate_z:\r\n```\r\n</details>\r\n\r\n<details>\r\n<summary>Dirty list: grep '^[a-z]' src/schema/objects/columns.yaml | grep -v __ | grep 's:'</summary> \r\n\r\n```shell\r\nhandedness:\r\nhplc_recovery_fractions:\r\nsoftware_filters:\r\nspecies:\r\nstatus:\r\nunits:\r\n```\r\n</details>\r\n\r\nso in addition to units, and excluding `software_filters` (which is a string for a list but without clear formatting stated) there is also hplc_recovery_fractions \r\n\r\n```yaml\r\nhplc_recovery_fractions:\r\n  name: hplc_recovery_fractions\r\n  display_name: HPLC recovery fractions\r\n  description: |\r\n    HPLC recovery fractions (the fraction of activity that gets loaded onto the HPLC).\r\n  type: number\r\n  unit: arbitrary\r\n```\r\n\r\nwhich is scalar (I thought that they might be a list ;) ), but especially since a scalar -- we should make them into singular as well IMHO and add to common principles (if not there) that should be singular."
