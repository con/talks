- number: 18
  title: Change RepetitionTime definition to the same one as DICOM field 0018,0080
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/18
  author: tsalo
  assignees: []
  labels:
  - metadata
  createdAt: '2020-08-03T13:22:05Z'
  updatedAt: '2020-08-08T19:24:49Z'
  closedAt: null
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\nCurrent definition of RepetitionTime in BIDS is not the same as the one in DICOM which might cause confusion. The new definition would be:\r\n\r\n> The period of time in msec between the beginning of a pulse sequence and the beginning of the succeeding (essentially identical) pulse sequence.\r\n\r\nRepetitionTime would also not be mandatory for _bold files and it’s previous role would be replaced by new mandatory TemporalResolution field or (similar TBD) field defined as:\r\n\r\n> The time in seconds between the beginning of an acquisition of one volume and the beginning of acquisition of the volume following it. Please note that this definition includes time between scans (when no data has been acquired) in case of sparse acquisition schemes. This value needs to be consistent with the ‘pixdim[4]’ field (after accounting for units stored in ‘xyzt_units’ field) in the NIfTI header. This field is mutually exclusive with VolumeTiming.\r\n\r\nRelevant discussion:\r\n\r\nhttps://groups.google.com/d/msg/bids-discussion/MLUqmcD1XSY/_lMkr00yAwAJ\r\n\r\nhttps://groups.google.com/d/msg/bids-discussion/wtolT5qPjy0/k2avH_1mCAAJ\r\n\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original authors**: @mharms\r\n"
  comments:
  - author: tsalo
    createdAt: '2020-08-03T13:22:44Z'
    body: "@Gilles86 wrote:\r\n\r\n> The period of time in msec between the beginning of a pulse sequence and the beginning of the succeeding (essentially identical) pulse sequence.\r\n\r\nNote that for inversion recovery sequences (e.g., MP(2)RAGE), this corresponds to the time between inversion pulses. \r\n\r\nFor GRE sequences (i.e., FLASH), this corresponds to the time between excitations.\r\n\r\nUnfortunately, the much-used MP(2)RAGE sequences consists of inversion pulses interspersed with GRE readout blocks.\r\n\r\nTo calculate quantities like T1 from a set of MP2RAGE images, we need both the time between inversion pulses and the time between excitations in the subsequent GRE blocks. Maybe we should include an additional \"ExcitationRepetitionTime\"-field for that? \r\n\r\nOne alternative would be to deduce this time between excitations using the number of k-space lines, acceleration, and the TotalReadoutTime, but this seems tricky to me..."
  - author: tsalo
    createdAt: '2020-08-03T13:23:20Z'
    body: "@tiborauer wrote:\r\n\r\n>RepetitionTime would also not be mandatory for _bold files and it’s previous role would be replaced by new mandatory TemporalResolution field or (similar TBD) field defined as:\r\n\r\nThere are two different versions of 0018,0080: http://dicomlookup.com/lookup.asp?sw=Tnumber&q=(0018,0080)\r\n1. The period of time in msec between the beginning of a pulse sequence and the beginning of the succeeding (essentially identical) pulse sequence. \r\nRequired except when Scanning Sequence (0018,0020) is EP (EPI) and Sequence Variant (0018,0021) is not SK (segmented K-space).\r\nThis interpretation is not for standard EPI.\r\n\r\n2. The time in ms between two successive excitations of the same volume. Shall be 0 (zero) if there is a single excitation per volume. \r\nRequired if Frame Type (0008,9007) Value 1 of this frame is ORIGINAL. May be present otherwise.\r\nThis is more general, therefore, more fitting for EPI (and other purposes)."
  - author: tsalo
    createdAt: '2020-08-03T13:23:38Z'
    body: "@tiborauer wrote:\r\n\r\n> RepetitionTime would also not be mandatory for _bold files and it’s previous role would be replaced by new mandatory TemporalResolution field or (similar TBD) field defined as:\r\n\r\nTherefore, I propose the second definition and making it mandatory for all (also for BOLD). It should also replace RepetitionTime 'patches' (e.g. RepetitionTimeExcitation for structural) in BIDS 1."
  - author: tiborauer
    createdAt: '2020-08-03T13:33:29Z'
    body: "@tsalo, I think you quote yourself and not me. :)\r\n\r\nOtherwise, I agree."
  - author: tsalo
    createdAt: '2020-08-03T13:37:43Z'
    body: '@tiborauer The quote is yours from the [BIDS 2.0 doc](https://docs.google.com/document/d/1LEgsMiisGDe1Gv-hBp1EcLmoz7AlKj6VYULUgDD3Zdw/edit?ts=5ec29f62#heading=h.u2m4n7lj0m6g), but it''s from July 20, 2018.'
  - author: tiborauer
    createdAt: '2020-08-03T13:42:27Z'
    body: "Oh, I see. I almost forgot that document. It is great to see its resurrection.\r\n\r\nI think I actually wrote everything else but the one in the quote in the two comments. Do not you want me to paste them properly capture provenance? :D\r\n"
  - author: tsalo
    createdAt: '2020-08-03T13:44:32Z'
    body: You wrote the original suggestion? I'll update the "Original Authors" with you instead of Harms if so.
  - author: tiborauer
    createdAt: '2020-08-03T13:47:36Z'
    body: "See my suggestions [here](https://docs.google.com/document/d/1LEgsMiisGDe1Gv-hBp1EcLmoz7AlKj6VYULUgDD3Zdw/edit?disco=AAAACBqkpDA)\r\n"
  - author: tsalo
    createdAt: '2020-08-03T14:46:35Z'
    body: Ah, I see. The way I've written these issues, the quoted parts are quotes from previous comments to retain threads. The non-quoted part is what you wrote. This is just because GitHub issues don't thread the way Google Doc comments do.
  - author: tsalo
    createdAt: '2020-08-08T16:12:59Z'
    body: '@tiborauer do you know if the changes in BEP001 encompass this? I recall there being something about redefining RepetitionTime, but I don''t know if it''s the same definition as from the DICOM standard.'
  - author: tiborauer
    createdAt: '2020-08-08T17:43:00Z'
    body: Partially. As you can see [here](https://bep001.readthedocs.io/en/master/04-modality-specific-files/01-magnetic-resonance-imaging-data.html#required-fields), BEP001 keep the original definition but expands on the one suggested here (i.e. "the period of time in msec between the beginning of a pulse sequence and the beginning of the succeeding (essentially identical) pulse sequence"). However, it also defines two 'patches', as you can see [here](https://bep001.readthedocs.io/en/master/04-modality-specific-files/01-magnetic-resonance-imaging-data.html#the-rec-entity).
  - author: tsalo
    createdAt: '2020-08-08T19:24:49Z'
    body: Thanks! Okay, so it seems like BEP001 provides an intermediate solution, in which case this proposal is still relevant for 2.0.
- number: 17
  title: Allowed characters in labels/keys
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/17
  author: tsalo
  assignees: []
  labels:
  - characters
  createdAt: '2020-08-03T13:20:21Z'
  updatedAt: '2024-05-13T14:40:05Z'
  closedAt: null
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\nhttps://docs.google.com/document/d/1HFUkAEE-pB-angVcYe6pf_-fVf4sCpOHKesUvfb8Grc/edit?disco=AAAAB1zsEbg \r\n\r\nSome labels that are desired to be used consist of concatenated abbreviations, and would be more readable with a separator character (e.g., \"32k-fs-LR\"). This restriction seems excessive.\r\n\r\nOne possibility is to actually allow dashes in values, while keeping them forbidden in keys. This can still be parsed consistently by splitting everything on underscores, and then splitting each of those on the first dash.\r\n\r\nIf this is unpalatable, perhaps another cross-platform-allowed filename character can be added to the set of allowed characters, such as '=' or '+'. These are not as easy to read as a dash, but at least gives people an option for cases that are otherwise difficult to resolve.\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original authors**: Unknown\r\n"
  comments:
  - author: tsalo
    createdAt: '2020-08-03T16:17:26Z'
    body: 'This is related to https://github.com/bids-standard/bids-specification/issues/226 and #7.'
  - author: jbteves
    createdAt: '2020-08-04T22:34:10Z'
    body: I disagree with allowing dashes only "sometimes" and thus giving them multiple possible meanings. It ultimately means more difficulty in writing parsers.
  - author: yarikoptic
    createdAt: '2024-05-13T14:40:03Z'
    body: 'I would like to bring this back to "agenda" and do make `-` and `+` allowed.  We are not to give any semantic, but rather just to allow file names to be more readable.  For implementing support, it should be quite trivial since it doesn''t add any ambiguity to parsers: split on `_` into entities + optionally a suffix, and then split entities on `-` to separate `key` from `value`.  The only possible difficulty is may be for regex based parsing.'
