- number: 80
  title: Custom prefix (X-) for arbitrary metadata in .json files
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/80
  author: TheChymera
  assignees: []
  labels:
  - metadata
  - consistency
  createdAt: '2024-08-13T17:57:02Z'
  updatedAt: '2024-11-13T08:16:59Z'
  closedAt: null
  body: "Name space collisions came up today in the stimulus BEP discussion ( @yarikoptic ). Perhaps a prefix for arbitrary table columns would help with that, i.e. if we introduce a new column name, to make sure that that isn't misinterpreted with respect to preexisting data.\r\n\r\nNot sure if this should be done with entities as well (since we don't support arbitrary entities, even though I think we should)...\r\n\r\nIn any case if it's just for column names we could use underscore as a prefix for arbitrary column names.\r\nIf we want to do the same for entities it would need to be somthing uglier like XYZ or similar."
  comments:
  - author: yarikoptic
    createdAt: '2024-08-13T18:03:34Z'
    body: "I feel like I have proposed to add `X-` prefix to any metadata field (and possibly column in TSV) for any non-formalized by BIDS field. This is based on how email RFC ??? does it -- you can add arbitrary header field but prefixed with X-. So we have tons of them in the email headers now (e.g. `X-Spam-Level`, `x-microsoft-spam`) which allows for safe vendoring.\n\nBut it didn't gain traction at that point. I fail to find ATM, but I think I also ran it   by @rordenlab in the scope of dcm2niix... might find it later unless someone beats me to it.\n\nGood news: since we formalized machine readable schema, it would be quite simple to establish automated migration as part of BIDS 2.0 - 3.0 migration helper.\n\nPros:\n- **future proofing, smoother handling of BIDS versions**: avoids possible collision. May be even name would stay the same but format would change and it would break otherwise perfectly valid BIDS dataset of prior version of BIDS\n- **preventing typos**: an unknown field could be a typo, to be fixed while composing those .json files\n  - validator could then even suggest close hits among those which are known\n- **saving brain cycles**: seeing a field \"Blah\" ATM requires people to search for \"Blah\" in bids-specification to just fail to find and then trying to figure out what it means, googling up to see may be someone describing it etc\n- **facilitating formalizing new metadata entries**: ATM people would just stick them in without bothering filing an issue, or even searching for one -- thus potentially just growing the multiverse of non-formalized, but useful, metadata fields\n  - migration script can also migrate from `x-` form in many (if not most) cases whenever a specific entry gets accepted into official schema"
  - author: yarikoptic
    createdAt: '2024-08-31T12:30:46Z'
    body: Another similar case IIRC it is mime types , see https://en.wikipedia.org/wiki/Media_type#Unregistered_tree . There `x-` I saw used , but I now see that `x.` is "advised one" there. But the point is the same - having a prefix.
  - author: yarikoptic
    createdAt: '2024-09-20T16:31:24Z'
    body: "Added `consistency` label as only with X- prefix there is consistency that metadata field is actually known to BIDS. Without that there is inconsistent mix of metadata fields known and unknown to BIDS so it is already \"flexible\" like that.  We will retain flexibility of being able to add new fields but in a consistent fashion.  If field is perspective for some BEP, could be `X-BEP???` to simplify catching/migrating whenever BEP is accepted, or just carry target name and explicitly ignored etc.\r\n\r\nI see that currently all officially allowed metadata fields have no `-` or `_` in them.\r\nIn general, does schema or tooling allows (as proceeds without complains) for `-` in the metadata field names?  (attn @effigies)"
  - author: neurolabusc
    createdAt: '2024-10-25T11:59:59Z'
    body: "Happy to create a separate pull request, but it might be nice to get initial guidance here. This discussion is timely, as seen by dcm2niix issues [881](https://github.com/rordenlab/dcm2niix/issues/881) and [880](https://github.com/rordenlab/dcm2niix/issues/880). From inception, dcm2niix included many keys not formally defined by BIDS. Before BIDS 1.0, @chrisgorgo suggested unilaterally defining keys for fields that did not exist in BIDS. Over time, many contributors have suggested new keys. However, this has caused some issues, as some BEPS choose different key names (in particular ASL and PET). Now that the BIDS specification has a clear mechanism for defining new keys and a democratically selected steering committee, it seems useful to try to develop a consensus on key names before unilaterally introducing them in one tool. \n\n@effigies [noted](https://github.com/rordenlab/dcm2niix/issues/880) `If anything, it would be good to propose defining all of the current fields dcm2niix emits in BIDS.I would advocate for adopting them more-or-less wholesale.`\n\nI would be interested in getting feedback from visionaries on this topic (@CPernet , @Remi-Gau, @xiangruili, and @satra come to mind). My proposal would be:\n 1. Get consensus existing dcm2niix key names, decide if all can be considered optional.\n 2. Develop a validation dataset that includes DICOM files that exhibit all the proposed keys [similar to dcm_qa](https://github.com/neurolabusc/dcm_qa_stc). This will provide concrete exemplars for other tool builders to support their (optional) adoption of these keys.\n 3. Create a PR for the BIDS specification.\n\n<details>\n<summary>Below (click to expand) is a list of the proposed new keys, all of which dcm2niix already generates:</summary> \n\n### Global Constants\n\nThese fields should be the same for all images acquired on a specific scanner.\n\n| Field                       | Unit | Comments             |\n|-----------------------------|------|----------------------|\n| ConversionSoftware          |      | e.g. `dcm2niix`      |\n| ConversionSoftwareVersion   |      | e.g. `v1.0.20210317` | \n\n\nWe should have a consensus of whether software and software version are two keys or concatenated as one, e.g. dcm2niix creates two keys, while dicm2nii generates one: ` \"ConversionSoftware\": \"dicm2nii.m 20240821\"`.\n\n### Global Series Information\n\nThese fields are present regardless of modality (e.g. MR, CT, PET).\n\n| Field                    | Unit | Comments            |\n|--------------------------|------|---------------------|\n| PatientPosition          |      | DICOM tag 0020,0032 |\n| ProcedureStepDescription |      | DICOM tag 0040,0254 |\n| StudyDescription         |      | DICOM tag 0008,1030 |\n| SeriesDescription        |      | DICOM tag 0008,103E |\n| ProtocolName             |      | DICOM tag 0018,1030 |\n| ImageType                | list | DICOM tag 0008,0008 see [dcm2niix issue 881](https://github.com/rordenlab/dcm2niix/issues/881) |\n| AcquisitionTime          |      | DICOM tag 0008,0032 |\n| AcquisitionNumber        |      | DICOM tag 0020,0012 |\n| ImageComments            |      | DICOM tag 0020,4000 |\n\n### Global Private Information\n\nThese fields contain personally identifiable information. By default dcm2niix will create anonymized files without these fields. The option `-ba n` will retain private information.\n\n| Field                  | Unit | Comments            |\n|------------------------|------|---------------------|\n| SeriesInstanceUID      |      | DICOM tag 0020,000E |\n| StudyInstanceUID       |      | DICOM tag 0020,000D |\n| ReferringPhysicianName |      | DICOM tag 0008,0090 |\n| StudyID                |      | DICOM tag 0020,0010 |\n| PatientName            |      | DICOM tag 0010,0010 |\n| PatientID              |      | DICOM tag 0010,0020 |\n| AccessionNumber        |      | DICOM tag 0008,0050 |\n| PatientBirthDate       |      | DICOM tag 0010,0030 |\n| PatientSex             |      | DICOM tag 0010,0040 |\n| PatientAge             |      | DICOM tag 0010,1010 |\n| PatientSize            |      | DICOM tag 0010,1020 |\n| PatientWeight          | kg   | DICOM tag 0010,1030 |\n| AcquisitionDateTime    |      | DICOM tag 0008,002A |\n\n## Modality Fields\n\nThese fields are specific to modality (e.g. MR, CT, PET).\n\n\n### Modality Computerized Tomography\n\nFields specific to CT scans.\n\n| Field           | Unit | Comments            |\n|-----------------|------|---------------------|\n| ExposureTime    | s    | DICOM tag 0018,1150 |\n| XRayTubeCurrent | mA   | DICOM tag 0018,1151 |\n| XRayExposure    | mAs  | DICOM tag 0018,1152 |\n\n### Modality Magnetic Resonance Imaging\n\nFields specific to MRI scans.\n\n| Field                              | Unit | Comments                                                                                |\n|------------------------------------|------|-----------------------------------------------------------------------------------------|\n| AcquisitionMatrixPE                |      | DICOM tag 0018,9231 (aka PhaseEncodingLines)                                            |\n| DerivedVendorReportedEchoSpacing   | s    |                                                                                         |\n| EchoNumber                         |      | Only multi-echo series                                                                  |\n| EchoTrainLength                    |      | DICOM tag 0018,0091                                                                     |\n| EffectiveEchoSpacing               | s    |                                                                                         |\n| EstimatedEffectiveEchoSpacing      | s    |                                                                                         |\n| EstimatedTotalReadoutTime          | s    |                                                                                         |\n| VariableFlipAngleFlag              | b    | DICOM tag 0018,1315                                                                     |\n| ImageOrientationPatientDICOM       |      | DICOM tag 0020,0037                                                                     |\n| ImagingFrequency                   | MHz  | DICOM tag 0018,0084 or 0018,9098                                                        |\n| InPlanePhaseEncodingDirectionDICOM |      | DICOM tag 0018,1312                                                                     |\n| NumberOfAverages                   |      | DICOM tag 0018,0083                                                                     |\n| PercentPhaseFOV                    |      | DICOM tag 0018,0094                                                                     |\n| PercentSampling                    |      | DICOM tag 0018,0093                                                                     |\n| FrequencyEncodingSteps             |      | DICOM tag 0018,9058                                                        |\n| PhaseEncodingSteps                 |      | DICOM tag 0018,0089 or 0018,9231 aka PhaseEncodingStepsInPlane                          |\n| PhaseEncodingStepsOutOfPlane       |      | DICOM tag 0018,9232                                                        |\n| PixelBandwidth                     | Hz   | DICOM tag 0018,0095                                                                     |\n| RepetitionTimeInversion            | s    |                                                                                         |\n| SAR                                |      | DICOM tag 0018,1316 or 0018,9181 defined by 0018,9179                                   |\n| SliceThickness                     | mm   | [nb](http://dclunie.blogspot.com/2013/10/how-thick-am-i-sad-story-of-lonely-slice.html) |\n| SpacingBetweenSlices               | mm   | [nb](http://dclunie.blogspot.com/2013/10/how-thick-am-i-sad-story-of-lonely-slice.html) |\n\n## Manufacturer Fields\n\n\n### Manufacturer General Electric\n\n| Field                          | Unit | Comments                 |\n|--------------------------------|------|--------------------------|\n| PulseSequenceName              |      | `epi` or `epiRT`         |\n| InternalPulseSequenceName      |      | `EPI` or `EPI2`          |\n| PhaseEncodingPolarityGE        |      | `Unflipped` or `Flipped` |\n| NumberOfPointsPerArm           |      | DICOM tag 0027,1060      |\n| NumberOfArms                   |      | DICOM tag 0027,1061      |\n| NumberOfExcitations            |      | DICOM tag 0027,1062      |\n| ShimSetting[0]                 |      | DICOM tag 0043,1002      |\n| ShimSetting[1]                 |      | DICOM tag 0043,1003      |\n| ShimSetting[2]                 |      | DICOM tag 0043,1004      |\n| PrescanReuseString             |      | DICOM tag 0043,1095      |\n| ASLContrastTechnique           |      | DICOM tag 0043,10A3      |\n| ASLLabelingTechnique           |      | DICOM tag 0043,10A4      |\n| CompressedSensingFactor        |      | DICOM tag 0043,10B7      |\n| DeepLearningFactor             |      | DICOM tag 0043,10CA      |\n\n### Manufacturer Philips\n\n| Field                              | Unit | Comments                         |\n|------------------------------------|------|----------------------------------|\n| TriggerDelayTime                   | s    | DICOM tag 0020,9153 or 0018,1060 |\n| PhilipsRWVSlope                    |      | DICOM tag 0040,9225              |\n| PhilipsRWVIntercept                |      | DICOM tag 0040,9224              |\n| PhilipsRescaleSlope                |      | DICOM tag 0028,1053              |\n| PhilipsRescaleIntercept            |      | DICOM tag 0028,1052              |\n| UsePhilipsFloatNotDisplayScaling   |      | dcm2niix option `-p y` or `-p n` |\n| PartialFourierEnabled              |      | DICOM tag 0018,9081, `YES`       |\n| PhaseEncodingStepsNoPartialFourier |      | DICOM tag 0018,9231              |\n| WaterFatShift                      |      | DICOM tag 2001,1022              |\n| PhilipsScaleSlope                  |      | DICOM tag 2005,100E              |\n\n\n### Manufacturer Siemens Magnetic Resonance Imaging (V*)\n\n| Field                          | Unit                                            | Comments                                                                                                                                                                                                                                                                                                                                                                                               |\n|--------------------------------|-------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n| Interpolation2D                |                                                 | If present, slices interpolated within plane                                                                                                                                                                                                                                                                                                                                                           |\n| Interpolation3D                |                                                 | If present, image interpolated in all spatial dimensions                                                                                                                                                                                                                                                                                                                                               |\n| BaseResolution                 | integer                                         | # of acquisition lines?                                                                                                                                                                                                                                                                                                                                                                                |\n| ShimSetting                    | DAC for 1st order terms, mA for 2nd order terms | The 1st 3 values are the 1st order shims from sGRADSPEC.lOffset{X,Y,Z}. The next 5 are 2nd order shims from sGRADSPEC.alShimCurrent[0-4]. Converting to the first order terms to uT/m may be possible using the \"gradient sensitivities\". Converting the second order terms to uT/m^2 requires information not stored in the DICOM header, but they are fixed for a given shim hardware configuration. |\n| DiffusionScheme                |                                                 | `Monopolar` or `Bipolar`                                                                                                                                                                                                                                                                                                                                                                               |\n| DelayTime                      | s                                               | Pause between EPI volumes, where TR is longer than required by TA (`sparse` imaging)                                                                                                                                                                                                                                                                                                                   |\n| TxRefAmp                       | V                                               |                                                                                                                                                                                                                                                                                                                                                                                                        |\n| PhaseResolution                | f                                               |                                                                                                                                                                                                                                                                                                                                                                                                        |\n| PhaseOversampling              |                                                 |                                                                                                                                                                                                                                                                                                                                                                                                        |\n| CoilString                     |                                                 | May or may not match `ReceiveCoilName`                                                                                                                                                                                                                                                                                                                                                                 |\n| FmriExternalInfo               |                                                 |                                                                                                                                                                                                                                                                                                                                                                                                        |\n| WipMemBlock                    |                                                 |                                                                                                                                                                                                                                                                                                                                                                                                        |\n| AveragesDouble                 |                                                 | CSA `dAveragesDouble`, fractions possible, independent of DICOM `NumberOfAverages` (0018,0083)                                                                                                                                                                                                                                                                                                         |\n| ProtocolName                   |                                                 | Check SeriesDescription - they might be switched around                                                                                                                                                                                                                                                                                                                                                |\n| RefLinesPE                     |                                                 | # of reference lines in the phase encoding direction for acceleration (GRAPPA)                                                                                                                                                                                                                                                                                                                         |\n| ConsistencyInfo                |                                                 | The more complete software version, e.g. VE11C or VE11E instead of just VE11.                                                                                                                                                                                                                                                                                                                          |\n| BandwidthPerPixelPhaseEncode   | Hz                                              | DICOM tag 0019,1028                                                                                                                                                                                                                                                                                                                                                                                    |\n| ImageOrientationText           |                                                 | DICOM tag 0051,100E                                                                                                                                                                                                                                                                                                                                                                                    |\n\n### Manufacturer Siemens Magnetic Resonance Imaging (XA)\n\n| Field                        | Unit | Comments                   |\n|------------------------------|------|----------------------------|\n| BandwidthPerPixelPhaseEncode | Hz   | DICOM tag 0021,1153        |\n| ScanningSequence             |      | DICOM tag 0021,105a        |\n\n\n</details>"
  - author: yarikoptic
    createdAt: '2024-10-25T14:47:05Z'
    body: 'Thank you @neurolabusc ! You are hitting many nails on the head with the desire to formalize all those `dcm2niix` already populates.

      It is indeed worth filing a separate issue or even IMHO better a PR (easier to discuss any particular one in conversation attached to specific line in diff) to propose those even at the level of current BIDS 1.x for most of them.  I have also filed a pair of related issues on `ConversionSoftware*` fields - IMHO they should be made more generic.


      NB I have wrapped the listing of individual keys into `<detail>` construct in your comment to keep discussion on the original issue easier to follow here.'
  - author: mharms
    createdAt: '2024-10-25T18:20:23Z'
    body: 'As I commented here (https://github.com/rordenlab/dcm2niix/issues/880#issuecomment-2435604809), I think it is important that `dcm2niix` stays responsive to user suggestions for additions to its json metadata, without those individuals needing to formally engage with BIDS.


      Also, `dcm2niix` is its own stand-alone software.  I don''t see why new fields added to its json should be forced to have some odd, arbitrary prefix just because those fields don''t happen to be formally defined in the BIDS spec.'
  - author: yarikoptic
    createdAt: '2024-10-25T22:38:20Z'
    body: "It is *just* a matter if `dcm2niix` would like to produce \"BIDS .json sidecar files\" (so understood by BIDS-aware tools etc) or \".json sidecar files\"?  If there is a desire to produce \"BIDS standardized\" sidecar files, sure thing there should be a engagement with the standard.\n\nNot unlike is happening in DICOM itself: manufacturers stick tons of custom metadata in vendor specific sections of DICOMs (I guess everyone of dcm2niix developers know how much fun it is to dig through those), and eventually DICOM standardizes some new metadata properties, and manufacturers (slowly) adopt them to facilitate inter-operation with DICOM receiving hardware/software.  \n\n<details>\n<summary>So here is your response with some minor (dcm2niix -> Siemens and json/BIDS -> DICOM) changes and rewordings. Do you still agree with \"your own\" statement? </summary> \n\n> I think it is important that Siemens stays responsive to user suggestions for additions to its DICOM metadata, without those individuals needing to formally engage with DICOM.\n>\n> Also, Siemens is its own stand-alone manufacturer. I don't see why new fields added to its DICOM should be forced to be placed into some odd, arbitrary section just because those fields don't happen to be formally defined in the DICOM.\n</details>\n"
  - author: mharms
    createdAt: '2024-10-25T22:52:41Z'
    body: 'I don''t see the parallel to Siemens/DICOM.  Siemens can (and does) put whatever they want into their own *vendor specific* DICOM sections.


      A more appropriate analogy to what you are proposing as far as I''m concerned is that Siemens should append some common prefix to all the entries in their vendor specific sections, because they aren''t formally defined DICOM fields.  When you extend the analogy in that fashion, I obviously don''t agree with that.'
  - author: yarikoptic
    createdAt: '2024-10-25T23:11:25Z'
    body: Analogy is exactly that -- here I am proposing to add a "vendor specific" (or arbitrary adhoc) prefix.  It then could as well be `x-dcm2niix` "vendor specific" field (section) which would contain a dictionary of all extra fields `dcm2niix` adds, or just a flattened list of `x-` fields dcm2niix decides to add, while at the top level all fields without `x-` prefix are the ones (and only those) defined in BIDS.
  - author: CPernet
    createdAt: '2024-11-13T08:16:58Z'
    body: "RE: _Get consensus on existing dcm2niix key names, and decide if all can be considered optional._\n  \nAny non-documented field can be introduced at any time. If you browse openneuro, you will see many MRI data already have many of the fields you listed (because people use dcm2niix), and the validator skipped over them. So what you are asking is if we should add new optional fields in the spec. - but this is spec motivated not software related (even if in practice, many, most? conversions rely on your tool)  - because any software specific things can always be added. \n\nI'd personally have Global Constants as recommended.  \nAs for what should be added to the spec, I have no idea why some of the field you propose are even not mandatory tbh (echo for instance).\n\n"
