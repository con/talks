  updatedAt: '2024-04-15T07:03:59Z'
  closedAt: null
  body: "[`_mod`](https://bids-specification.readthedocs.io/en/stable/appendices/entities.html#mod) was introduced and is used primarily to disambiguate different `_defacemask`s.  So, to a degree, it encapsulates the semantic that some, but not all, `_suffix`es correspond to `MRI modalities` (really)  as a summarized in [a comment to #58](https://github.com/bids-standard/bids-2-devel/issues/58#issuecomment-1711860170).\r\n\r\n- #58\r\n\r\nIt is **only** present only when there is a `_defacemask` and only for `anat/`, while in effect most of the time corresponding to those `suffix`es \"implicitly\" where suffix does correspond to \"contrast\" (not modality really).\r\n\r\n<details>\r\n<summary>Samples from openneuro</summary> \r\n\r\n```shell\r\n$> for ds in ds*; do f=$(find $ds -iname *_mod-* | head -n 1); [ -z \"$f\" ] && continue; echo \"$f\"; done    \r\nds000113/sub-01/ses-forrestgump/anat/sub-01_ses-forrestgump_acq-mag_mod-veno_defacemask.nii.gz\r\nds000224/sub-MSC01/ses-struct01/anat/sub-MSC01_ses-struct01_run-01_mod-T1w_defacemask.nii.gz\r\nds000233/sub-rid000001/anat/sub-rid000001_mod-T1w_defacemask.nii.gz\r\nds001297/sub-01/anat/sub-01_acq-filt_mod-T1w_defacemask.nii.gz\r\nds002718/sub-002/anat/sub-002_mod-T1w_defacemask.nii.gz\r\nds003645/sub-002/anat/sub-002_mod-T1w_defacemask.nii.gz\r\nds004192/sub-01/ses-localizer1/anat/sub-01_ses-localizer1_acq-prescannormalized_rec-pydeface_mod-T1w_defacemask.nii.gz\r\nds004712/sub-03286/ses-NOT1ACH001/anat/sub-03286_ses-NOT1ACH001_mod-T1w_defacemask.nii.gz\r\n```\r\n</details>\r\n\r\nAlso there is \r\n\r\n- #55\r\n\r\nwhere the point of having `_mod` is coming up.  And as we are planing to proceed with\r\n\r\n- #54 \r\n\r\nif we get an entity `_mod` which actually corresponds to modality (`mri`, `eeg`, ...) not just mere contrast, it somewhat makes it then explicit and consistent to then \"embrace\" that entity and use it consistently to disambiguate all files, not just `_defacemask`s.\r\n\r\nNote: if to be kept just for the sake of disambiguation of some `_suffix2` (e.g. `_defacemask`) among different `_suffix`es (e.g. `_T1w` and `_T2w`) as it is  now, yet another use is `_events.tsv` files which came up in the context of\r\n\r\n- https://github.com/bids-standard/bids-specification/pull/1440"
