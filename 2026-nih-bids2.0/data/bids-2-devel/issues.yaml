- number: 77
  title: Replace DWI FSL-format bval/bvec files with MRtrix-format tsv file
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/77
  author: tsalo
  assignees: []
  labels:
  - extensions
  - DWI
  createdAt: '2024-05-13T14:31:03Z'
  updatedAt: '2024-05-21T12:34:04Z'
  closedAt: null
  body: "This stems from https://github.com/bids-standard/bids-specification/issues/349, which proposed supporting the MRtrix-format tsv file as an optional alternative to FSL-format bval and bvec files. For BIDS 2.0, I propose a fully backwards-incompatible replacement of the FSL-format files with the MRtrix-format file.\r\n\r\nPinging @mattcieslak, who originally proposed supporting the MRtrix-format file."
  comments:
  - author: poldrack
    createdAt: '2024-05-13T16:11:12Z'
    body: Given the prevalence of bval/bvec files (which I agree are not optimal), I think we would need a very strong justification for making such a breaking change.  (whereas making it an optional format alongside bval/bvec seems like a no-brainer)
  - author: mattcieslak
    createdAt: '2024-05-13T16:15:09Z'
    body: I'm ok with keeping a bval and bvec file alongside a reliable description of the gradients! Even though the bvec files are so common, they're not actually useful on their own. Even the bids standard is ambiguous about this. It describes DIPY bvecs, not FSL
  - author: poldrack
    createdAt: '2024-05-13T16:38:50Z'
    body: can you please define "useful"?  There are certainly some things that one can do with a simple set of bvec/bval files; I'd like to have a better feel for what the threshold for utility is, given that such a change would make the majority of current datasets with DWI incompatible in a way that that is likely impossible to fix without the original DICOMs (at least I think that's true).
  - author: mattcieslak
    createdAt: '2024-05-13T16:46:23Z'
    body: "Sure - if you have a _dwi.nii.gz and a bval and bvec from dcm2niix, then you have some certainty that the image is in LAS+ and the bvecs are indeed aligned to the image axes. You can fit models directly in DIPY or in FSL with these bvals and bvecs and be fairly certain that your gradient directions are correct.\r\n\r\nIf you're operating anywhere outside of those inputs then you have to run some sort of bvec checker to see if the directions are aligned with the image axes (DIPY convention) or the image-axes-if-the-image-were-in-LAS+ (FSL convention). Some examples of these situations are when the images come from animal scans or when the images are created via simulation in FiberFox (and use LPS+ image axes and bvecs in the DIPY convention). \r\n\r\nSo in a nutshell, the bvecs are good to go as long as your corresponding image is in LAS+ orientation. If not then you need to run dwigradcheck, or DSI Studio's bvec checker or some equivalent tool to permute the bvecs and flip their signs until you're able to produce some coherent tractography. "
  - author: poldrack
    createdAt: '2024-05-13T16:53:56Z'
    body: "Thanks! I will be interested to hear from others, but I don't find that to be a compelling enough rationale to make a breaking change that renders existing compatible bval/bvec files incompatible with the next version of the standard.  \r\n\r\nThere is also a more general point to be discussed here (probably in a different issue): How should the community balance aspirations for better methodology versus breaking compatibility with existing datasets?  Is there a middle ground, or should BIDS 2.0 (or maybe 3.0) be envisioned without regard to backwards compatibility? Perhaps this discussion has already been had elsewhere, in which case please pardon the noise!"
  - author: mattcieslak
    createdAt: '2024-05-13T16:55:50Z'
    body: 'It may just boil down to the community''s tolerance for vestigial files '
  - author: yarikoptic
    createdAt: '2024-05-13T17:28:02Z'
    body: "> How should the community balance aspirations for better methodology versus breaking compatibility with existing datasets?\r\n\r\nI think for this particular aspect, \"datasets compatibility\" (as opposed to tools compatibility), having a migration tool would largely address this concern.  That is why in WiP\r\n\r\n- https://github.com/bids-standard/bids-specification/pull/1775\r\n\r\nI started with having such one in mind and coded it up for `participants` -> `subjects` as an example: https://github.com/bids-standard/bids-specification/pull/1775/files#diff-b81290f4f0476f7197f66bf34cab9f750df9401d7aaa05caf78732e542c97181R43\r\n\r\n> Is there a middle ground, or should BIDS 2.0 (or maybe 3.0) be envisioned without regard to backwards compatibility?\r\n\r\nBIDS 2.0 \"by definition\" could be breaking backwards compatibility but IMHO it shouldn't be a \"wild game\" - any breakage (for dataset or tool compatibility) should be warranted.\r\n\r\nAs for this particular issue I lack DWI expertise, so will leave decision making to others involved. But for now I added it to \"BIDS 2.0\" project as a viable candidate we decide on either to tackle for 2.0, close, or postpone to 3.0. "
  - author: tsalo
    createdAt: '2024-05-15T17:57:39Z'
    body: 'What about deprecating the FSL format files in BIDS 1 first? Would that make dropping support for them in BIDS 2 more palatable?


      Or deprecate through 2 and remove in 3 even, if 2 will happen soon.'
  - author: yarikoptic
    createdAt: '2024-05-15T18:05:16Z'
    body: "In principle we could indeed start RECOMMENDing the replacement format in BIDS 1.0, thus in effect \"deprecating\" in the left over of 1.x, and add migration for BIDS 2.0 completely removing FSL format.\r\nAs we do not have specific timeline for 2.0, I would not dare to recommend waiting for 3.0 if we want to see some \"movement\" on this."
  - author: Lestropie
    createdAt: '2024-05-21T02:24:36Z'
    body: "There are still outstanding issues with various DWI softwares not appropriately handling `bvec/bval` files. I am trying to improve definition of that format in https://github.com/bids-standard/bids-specification/pull/1811. Also, as part of BEP016 and some *MRtrix3* work, I'm hoping to produce a software tool that verifies appropriate software handling of gradient tables and other data relevant to orientation dependence (ie. beyond the scope of `dwigradcheck`); I'll try to remember to report progress back here.\r\n\r\nGiven the ubiquity of `dcm2niix` in this ecosystem, I think that a change like this would be ill received were there not to be a corresponding change to `dcm2niix` giving it the ability to produce gradient table data in that format (which can then be trivially renamed to become BIDS compliant). @neurolabusc is this a change that you'd be willing to implement upstream?"
  - author: neurolabusc
    createdAt: '2024-05-21T12:34:03Z'
    body: "@Lestropie first of all, I think you did a masterful job with [your extended description of the bvec format](https://github.com/bids-standard/bids-specification/pull/1811), as this finally describes the unintuitive nature of this format. I would be happy to try to integrate software you develop. dcm2niix is written in vanilla C, with minimal dependencies so that would be my preferred language.\r\n"
- number: 76
  title: Separation of metadata describing data vs. intended processing
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/76
  author: Lestropie
  assignees: []
  labels:
  - metadata
  createdAt: '2024-05-06T02:23:23Z'
  updatedAt: '2024-05-13T14:32:08Z'
  closedAt: null
  body: "Expansion of the logic in #53 to cover more than the Issue title.\r\n\r\nThere are likely many situations where one wishes to be able to provide instruction on how the person responsible for collecting the data intends for those data to be processed. While many Apps may provide some degree of control over how processing is performed at the CLI, some more nuanced details may become too complex to be manipulating at the CLI; further, it is quite common for data to have been collected with the intention of being utilized in some way during processing.\r\n\r\nTherefore, what I'd be interested in as a hard transition from BIDS 1.x is **a standalone JSON file whose exclusive purpose is encoding the intended relationships between input data, processing steps, and output data**. What I want to do in this Issue is invite insight from contexts outside of my own experience where similar logic may be applicable, to gauge the scope of what such a format may need to be able to cover.\r\n\r\n-   In #53 I've already discussed how this could be used for B0 offset field maps in MRI. It would involve metadata changes in the case of spin-echo EPIs, and suffix changes in the case of dual echo gradient echoes.\r\n\r\n-   Input data files in a BIDS Raw dataset do not always have exclusively either a one-to-one or many-to-one mapping to output data files in a BIDS Derivatives dataset.\r\n    Take for example a complex DWI acquisition, where there's two different acquisitions for two different purposes---let's call them X and Y---but each is additionally acquired with two different phase encoding directions---say AP and PA. Ideally there should be some way of encoding that the input images of run X with phase encoding AP and PA are somehow combined to produce one output series for run X, and the input images of run Y with phase encoding AP and PA are combined to produce one output series for run Y; but data across the two runs are *not* to be combined. Maybe a sufficiently clever tool can either infer what it thinks is best to do, or provide CLI options to modify its behaviour. But the most robust and extensible solution would be to provide to the tool a file (potentially as content within the input dataset) that encodes this mapping, potentially as well as any additional information about processing steps that should be applied along the way.\r\n\r\nIt's possible that some of this will be assessed as creeping outside of the scope of BIDS; or maybe into BEPs relating to applications / processing. But the examples above I do think relate to the raw dataset in terms of *intentions of the person responsible for acquiring and providing the data*. So discussing the concept may need to be bisected into:\r\n\r\n-   What would be the possible scope of such an approach if it were constrained exclusively to what would be appropriately defined as part of the BIDS Raw dataset; that is, what is reasonable for the person providing the raw data to be defining as their intended usage / interpretation of those data.\r\n\r\n-   What would it look like to define a more generic and powerful interface that would be accepted as input by BIDS Apps and more actively modified by users of BIDS Apps, to define image processing operations and mappings between input and output data in a manner defined by the specification rather than the esoteric CLIs of individual Apps.\r\n    And indeed whether there's a sufficiently broad scope of use cases to warrant this degree of complexity."
  comments:
  - author: yarikoptic
    createdAt: '2024-05-07T13:34:08Z'
    body: attn @effigies and @ericearl on this one if you have a chance to review/provide feedback.
  - author: ericearl
    createdAt: '2024-05-07T13:41:07Z'
    body: '@yarikoptic I''m off work this week, but I''ll try to come back and take a look next week.'
- number: 75
  title: Suffixes mandatory for data but optional for metadata?
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/75
  author: Lestropie
  assignees: []
  labels:
  - metadata
  - suffixes
  createdAt: '2024-05-03T03:19:28Z'
  updatedAt: '2024-05-13T14:32:31Z'
  closedAt: null
  body: "Relates to multiple existing issues; mostly https://github.com/bids-standard/bids-specification/pull/1003, #65, #58.\r\n\r\nImagine an MRI BIDS dataset, which contains a T1w image and a single fMRI free run.\r\nNeglecting the Inheritance Principle altogether, it might look something like:\r\n```\r\nsub-01/\r\n    anat/\r\n        sub-01_T1w.nii.gz\r\n        sub-01_T1w.json\r\n    func/\r\n        sub-01_task-rest_bold.nii.gz\r\n        sub-01_task-rest_bold.json\r\n```\r\n\r\nThere are *many* metadata fields that will be identical between these two images; things like scanner site, field strength. It would be nice to be able to use the Inheritance Principle to define this information just once in a file `sub-01.json`; ie.:\r\n\r\n```\r\nsub-01/\r\n    anat/\r\n        sub-01_T1w.nii.gz\r\n        sub-01_T1w.json\r\n    func/\r\n        sub-01_task-rest_bold.nii.gz\r\n        sub-01_task-rest_bold.json\r\nsub-01.json\r\n```\r\n\r\nThis however would not be currently permitted, as suffices are mandatory.\r\nConversely, having a data file without any suffix is hard to make sense of, as one would expect some mandatory indication of what kind of imaging contrast is present in data.\r\n\r\nSo the idea I'm toying with at the moment, is to make it *mandatory for data files to have a suffix, but optional for metadata*. This would allow singular definition of metadata fields that are common across image data of different contrasts."
  comments: []
