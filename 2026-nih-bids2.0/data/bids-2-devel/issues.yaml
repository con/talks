  - author: yarikoptic
    createdAt: '2025-11-27T01:38:07Z'
    body: "ha -- indeed quite *different* in terms of visual comprehension by an elderly human being! ;-) \n\n<details>\n<summary>here are both - I think \"-\" is much better in reducing visual clutter, in particular in the filenames: we then pretty much follow a way of dashes in the middle (-) vs bottom (_), but may be it is our vision systems biased by now? ;) </summary> \n\n```shell\n(git)smaug:/mnt/btrfs/datasets/datalad/crawl/openneuro/ds000114[master]git\n$> find | grep -v '\\.git' | head -n 30\n.\n./.datalad\n./.datalad/config\n./dwi.bval\n./dwi.bvec\n./participants.tsv\n./sub-01\n./sub-01/ses-retest\n./sub-01/ses-retest/anat\n./sub-01/ses-retest/anat/sub-01_ses-retest_T1w.nii.gz\n./sub-01/ses-retest/dwi\n./sub-01/ses-retest/dwi/sub-01_ses-retest_dwi.nii.gz\n./sub-01/ses-retest/func\n./sub-01/ses-retest/func/sub-01_ses-retest_task-covertverbgeneration_bold.nii.gz\n./sub-01/ses-retest/func/sub-01_ses-retest_task-fingerfootlips_bold.nii.gz\n./sub-01/ses-retest/func/sub-01_ses-retest_task-linebisection_bold.nii.gz\n./sub-01/ses-retest/func/sub-01_ses-retest_task-linebisection_events.tsv\n./sub-01/ses-retest/func/sub-01_ses-retest_task-overtverbgeneration_bold.nii.gz\n./sub-01/ses-retest/func/sub-01_ses-retest_task-overtwordrepetition_bold.nii.gz\n./sub-01/ses-test\n./sub-01/ses-test/anat\n./sub-01/ses-test/anat/sub-01_ses-test_T1w.nii.gz\n./sub-01/ses-test/dwi\n./sub-01/ses-test/dwi/sub-01_ses-test_dwi.nii.gz\n./sub-01/ses-test/func\n./sub-01/ses-test/func/sub-01_ses-test_task-covertverbgeneration_bold.nii.gz\n./sub-01/ses-test/func/sub-01_ses-test_task-fingerfootlips_bold.nii.gz\n./sub-01/ses-test/func/sub-01_ses-test_task-linebisection_bold.nii.gz\n./sub-01/ses-test/func/sub-01_ses-test_task-linebisection_events.tsv\n./sub-01/ses-test/func/sub-01_ses-test_task-overtverbgeneration_bold.nii.gz\n1 10112.....................................:Wed 26 Nov 2025 08:32:51 PM EST:.\n(git)smaug:/mnt/btrfs/datasets/datalad/crawl/openneuro/ds000114[master]git\n$> find | grep -v '\\.git' | head -n 30 | sed -e 's,-,=,g'\n.\n./.datalad\n./.datalad/config\n./dwi.bval\n./dwi.bvec\n./participants.tsv\n./sub=01\n./sub=01/ses=retest\n./sub=01/ses=retest/anat\n./sub=01/ses=retest/anat/sub=01_ses=retest_T1w.nii.gz\n./sub=01/ses=retest/dwi\n./sub=01/ses=retest/dwi/sub=01_ses=retest_dwi.nii.gz\n./sub=01/ses=retest/func\n./sub=01/ses=retest/func/sub=01_ses=retest_task=covertverbgeneration_bold.nii.gz\n./sub=01/ses=retest/func/sub=01_ses=retest_task=fingerfootlips_bold.nii.gz\n./sub=01/ses=retest/func/sub=01_ses=retest_task=linebisection_bold.nii.gz\n./sub=01/ses=retest/func/sub=01_ses=retest_task=linebisection_events.tsv\n./sub=01/ses=retest/func/sub=01_ses=retest_task=overtverbgeneration_bold.nii.gz\n./sub=01/ses=retest/func/sub=01_ses=retest_task=overtwordrepetition_bold.nii.gz\n./sub=01/ses=test\n./sub=01/ses=test/anat\n./sub=01/ses=test/anat/sub=01_ses=test_T1w.nii.gz\n./sub=01/ses=test/dwi\n./sub=01/ses=test/dwi/sub=01_ses=test_dwi.nii.gz\n./sub=01/ses=test/func\n./sub=01/ses=test/func/sub=01_ses=test_task=covertverbgeneration_bold.nii.gz\n./sub=01/ses=test/func/sub=01_ses=test_task=fingerfootlips_bold.nii.gz\n./sub=01/ses=test/func/sub=01_ses=test_task=linebisection_bold.nii.gz\n./sub=01/ses=test/func/sub=01_ses=test_task=linebisection_events.tsv\n./sub=01/ses=test/func/sub=01_ses=test_task=overtverbgeneration_bold.nii.gz\n\n```\n</details>\n"
