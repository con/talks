- number: 14
  title: Homogenize "Subject" Nomenclature
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/14
  author: tsalo
  assignees: []
  labels:
  - common-principles
  - entities
  - consistency
  createdAt: '2020-08-03T13:17:47Z'
  updatedAt: '2024-04-17T19:44:10Z'
  closedAt: null
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\nWe are currently using the terms “participant” and “subject” interchangeably. I propose we make the names homogeneous. In order to afford better extendability with preclinical research, the term “subject” would be significantly more apt.\r\nGitHub Issue: https://github.com/bids-standard/bids-specification/issues/384\r\n\r\nThis change would include renaming the `participants.tsv` file to `subjects.tsv`, and the `participant_id` column in said file to `subject`.\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original authors**: @TheChymera\r\n"
  comments:
  - author: TheChymera
    createdAt: '2020-08-03T18:44:16Z'
    body: '@tsalo thank you for bringing this up. While the urgency from my side (and that of other preclinical researchers using SAMRI) has decreased following our begrudging adoption of this element of the standard, I would again recommend this as a worthwhile change.'
  - author: HenkMutsaerts
    createdAt: '2023-08-17T13:02:28Z'
    body: "I agree with this point, just brought this up with @Remi-Gau who pointed me to this issue (thanks!).\r\nThough note that some prefer `participant` over `subject` as the latter can be derogatory. I understand that `participant` is tricky with preclinical research, perhaps `sample` would be most neutral (and generalizable) but `subject` would be OK with me at least."
  - author: yarikoptic
    createdAt: '2024-01-26T19:50:31Z'
    body: 'In the light of the BEP032 (attn @bids-standard/bep032 and here #38) for animal ephys `subject` would also be more appropriate.  So I think it is a valid target for the "immediate" BIDS 2.0  with easy "auto upgrade" path.'
  - author: SylvainTakerkart
    createdAt: '2024-01-31T14:22:52Z'
    body: "> I agree with this point, just brought this up with @Remi-Gau who pointed me to this issue (thanks!). Though note that some prefer `participant` over `subject` as the latter can be derogatory. I understand that `participant` is tricky with preclinical research, perhaps `sample` would be most neutral (and generalizable) but `subject` would be OK with me at least.\r\n\r\njust for info, \"sample\" is already used in BIDS (for pre-clinical research, i.e to specify that several \"samples\", e.g tissue slices, can be extracted from the same \"subject\" (animal)..."
  - author: yarikoptic
    createdAt: '2024-01-31T20:02:38Z'
    body: "FTR, another definitely non-participant'y and even overall inanimate use-case came up yesterday in \r\n- https://github.com/NeurodataWithoutBorders/nwbinspector/pull/431\r\n\r\nso there \"subject\" IMHO still works as (inanimate) \"subject of study\"."
