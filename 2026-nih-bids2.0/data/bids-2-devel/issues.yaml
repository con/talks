- number: 46
  title: Replace ce entity with one that applies to MRI and PET data equally well
  state: CLOSED
  url: https://github.com/bids-standard/bids-2-devel/issues/46
  author: tsalo
  assignees: []
  labels:
  - entities
  createdAt: '2021-01-26T17:30:47Z'
  updatedAt: '2021-02-10T19:58:24Z'
  closedAt: '2021-02-10T19:58:23Z'
  body: "Currently, MRI uses `ce` (contrast enhancing agent) to indicate exogenous chemicals used to enhance contrasts, while the PET BEP, which uses tracers, plans to use the `acq` entity because `ce` doesn't reflect common terminology for PET users.\r\n\r\nI propose that we define a new entity, perhaps called `tracer`, that would work for both technologies and would replace `ce`. \r\n\r\nThe addition of a `tracer` entity was proposed by @mnoergaard in https://github.com/bids-standard/bids-specification/pull/633#discussion_r563794146. In the hopes of not cluttering up the specification with a new entity in BIDS 1.X, I think it would be best to replace the existing `ce` in 2.0."
  comments:
  - author: effigies
    createdAt: '2021-01-26T18:25:44Z'
    body: If "tracer" works for both contexts, I would support moving to that. Difficult to shorten to 2-3 characters (`trc`, maybe?), but perhaps also unlikely to be concatenated with so many other entities that a 6 character entity would lead to unreadable filenames.
  - author: melanieganz
    createdAt: '2021-02-01T19:32:07Z'
    body: 'So from the PET perspective tracer would be good and shortening it to `trc` would be fine, but not great in terms of readability. But are the MR people OK to call a contrast-enhancing agent a tracer? That seems slightly misleading to me.  E.g. here they call it moelcular tracers or contrast agents (https://www.bruker.com/content/bruker/int/en/applications/academia-life-science/imaging/in-vivo-imaging/molecular-tracers-and-contrast-agents.html) '
  - author: tsalo
    createdAt: '2021-02-01T19:40:12Z'
    body: "It _would_ be good to get input from MR folks who use contrast-enhancing agents. I don't know anyone who does though.\r\n\r\nEDIT: I've posted to the bids-discussion Google Group (see [here](https://groups.google.com/g/bids-discussion/c/B6YRVd6ulig))."
  - author: nicholst
    createdAt: '2021-02-07T11:46:06Z'
    body: "This is going to be really hard because, just linquistically, the two core terms are really different. \r\n\r\nFor MRI injections \"contrast agent\" is ubiquetous in MRI and implicit with the passive nature of the injection.  In PET, the injection is the very source of the signal... a better analogy is: What is the BIDS language for the chemical species imaged (i.e. the origin of the MRI signal)? \r\n\r\n* [H-1] - Protons, the default\r\n* [He-3] - Hyperpolarized 3He MRI\r\n* [C-13] - Hyperpolarized carbon-13 MRI\r\n* [F-19] - Fluorine MRI\r\n* [Na-23] - Sodium MRI\r\n* [P-31] - Phosphorus MRI\r\n\r\n(please, someone who knows more about MRI edit the names I've assigned if I've mangled it.)\r\n\r\nIn short, I don't think we should try to harmonise this.  Contrast agent `ce` is something that modifies the MRI signal, and BIDS 2.0 for PET should create a new label, e.g. `trc`, for the origin of the PET signal.  And we should probably have yet a new keyword for chemical species of the MRI sequence.\r\n"
  - author: melanieganz
    createdAt: '2021-02-07T21:14:27Z'
    body: Since we haven't finished the actual PET BEP review, we can still change the use of `acq` to `trc`. Would this then be ok for people that we make this change now?
  - author: nicholst
    createdAt: '2021-02-08T08:59:37Z'
    body: I think moving to `trc` is a good call... there isn't a perfect `acq` analogy, but if we were back in the days of retractable septa, you could imagine `acq` being used to tag 2D vs 3D acquistions.   As another example, what if you took a single list mode dataset and played it out into sets of 5 min frames, and then did it again with, say, 7 min frames... wouldn't that be a good use for `acq`?
  - author: mnoergaard
    createdAt: '2021-02-08T09:11:38Z'
    body: "I would argue that this latter case would imply a new reconstruction, as the acquisition of the data has not changed, but the reconstruction into frames has. Therefore, the data would need a new ´rec´ name (recon), such as ´rec-acdynXX´ (https://bids-specification.readthedocs.io/en/bep-009/04-modality-specific-files/09-positron-emission-tomography.html). \r\n\r\nBut I agree that ´acq´ could be used for 2D vs. 3D, even though there are only a few sites out there that still use 2D acquisitions. "
  - author: tsalo
    createdAt: '2021-02-10T19:58:23Z'
    body: Thanks to everyone for responding. Apologies for the round trip on this one! I will close this and follow up in the PET BEP.
- number: 49
  title: Drop "ChannelCount" fields in ephys data
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/49
  author: arnodelorme
  assignees: []
  labels:
  - 'impact: low'
  createdAt: '2020-10-20T18:29:24Z'
  updatedAt: '2021-05-20T10:01:09Z'
  closedAt: null
  body: "Some channel types have counts in the .eeg JSON files and others do not. Newly declared channel types GSR, RESP, and TEMP do not have counts\r\n\r\nGSRChannelCount\r\nRESPChannelCount\r\nTEMPChannelCount\r\n\r\nWhile EOG, EMG, ECG do. Worse, when the fields above are defined, the BIDS validator fails. This is made even worse by the fact that EOGChannelCount, EMGChannelCount, and ECGChannelCount are mandatory fields. The error from the validator is not informative when trying to add these fields (failed because of badly formated .eeg file). I have tried to look at the JS code but it is too convoluted. I beg whoever is able to change this code to return meaningful errors.\r\n\r\nOverall, **I would remove this redundant information of channel count** (except for EEG and non-EEG channel counts). One can simply look at the channel file to see what type of channels are there. This is a source of potential error and inconsistency. Big choice obviously."
  comments:
  - author: sappelhoff
    createdAt: '2020-10-20T19:33:10Z'
    body: "> This is made even worse by the fact that EOGChannelCount, EMGChannelCount, and ECGChannelCount are mandatory fields\r\n\r\nwhat makes you think that these are mandatory? to my knowledge and this [JSON schema](https://github.com/bids-standard/bids-validator/blob/6c6e2ea640c152aaec913166ef7072a2e4b416ec/bids-validator/validators/json/schemas/eeg.json#L37-L42), they aren't :thinking: \r\n\r\n> The error from the validator is not informative when trying to add these fields (failed because of badly formated .eeg file).\r\n\r\nthe error you get there is because you want to add fields to the `*eeg.json` file that are not defined in the specification. To me this makes sense, but others have said that it's problematic, see: https://github.com/bids-standard/bids-validator/issues/1044 and https://github.com/bids-standard/bids-specification/issues/637\r\n\r\n> I have tried to look at the JS code but it is too convoluted.\r\n\r\nThe JSON files are getting evaluated using https://json-schema.org/ --> and the schemas for the validator are all located [here](https://github.com/bids-standard/bids-validator/tree/master/bids-validator/validators/json/schemas). I agree that it's very difficult to find and improvements of the documentation are really needed.\r\n\r\n> Overall, I would remove this redundant information of channel count (except for EEG and non-EEG channel counts). One can simply look at the channel file to see what type of channels are there. \r\n\r\nI tend to agree with you. However, given that the channel counts are only \"RECOMMENDED\" it'd be fair enough for us (BIDS) to *not* add some new fields like `GSRChannelCount`, `RESPChannelCount`, etc. to the specification and just leave the state as it is. In BIDS 2.0 we could then (potentially, up to discussion) completely remove all `ChannelCount` fields, but not before that - because it'd be a backwards incompatible change.\r\n\r\ncc @bids-standard/raw-electrophys-eeg \r\n\r\n"
  - author: arnodelorme
    createdAt: '2020-10-20T20:26:04Z'
    body: "> what makes you think that these are mandatory? to my knowledge and this [JSON schema](https://github.com/bids-standard/bids-validator/blob/6c6e2ea640c152aaec913166ef7072a2e4b416ec/bids-validator/validators/json/schemas/eeg.json#L37-L42), they aren't \U0001F914\r\n\r\nYou are right. https://github.com/bids-standard/bids-specification/blob/master/src/04-modality-specific-files/03-electroencephalography.md\r\nSorry about that. They used to be mandatory I think. \r\n\r\n> The JSON files are getting evaluated using https://json-schema.org/ --> and the schemas for the validator are all located [here](https://github.com/bids-standard/bids-validator/tree/master/bids-validator/validators/json/schemas). I agree that it's very difficult to find and improvements of the documentation are really needed.\r\n\r\nIt would be great for the validator to indicate which part of the file create problem.\r\n\r\n> \r\n> > Overall, I would remove this redundant information of channel count (except for EEG and non-EEG channel counts). One can simply look at the channel file to see what type of channels are there.\r\n> \r\n> I tend to agree with you. However, given that the channel counts are only \"RECOMMENDED\" it'd be fair enough for us (BIDS) to _not_ add some new fields like `GSRChannelCount`, `RESPChannelCount`, etc. to the specification and just leave the state as it is. In BIDS 2.0 we could then (potentially, up to discussion) completely remove all `ChannelCount` fields, but not before that - because it'd be a backward-incompatible change.\r\n\r\nYes, you would want to preserve backward compatibility of course.\r\n"
- number: 45
  title: Treat associated modalities as independent
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/45
  author: tsalo
  assignees: []
  labels:
  - folder-structure
  createdAt: '2020-09-07T15:22:00Z'
  updatedAt: '2025-12-04T15:15:52Z'
  closedAt: null
  body: "I am not completely set on this, but I wanted to float the idea to stir up some discussion. Basically, my idea is to move \"associated data\", like events and physio, to the `beh` data type/folder in all cases- not just when there's no corresponding imaging data.\r\n\r\nI see two benefits:\r\n1. A simplification of the rules. You don't need to know that events only go in `beh` if they don't have an associated functional scan- you just organize them the same way regardless.\r\n2. Implicit support of multimodal acquisitions. If you acquired both fMRI and EEG at the same time, you don't need to worry about where to place these associated data files.\r\n\r\nThe main cost is in interpretability. The filenames would either have to match up in terms of entities or there would need to be some metadata field with a unique identifier (perhaps in `_scans.tsv`? see https://github.com/bids-standard/bids-specification/issues/529)."
  comments:
  - author: robertoostenveld
    createdAt: '2020-09-09T07:12:31Z'
    body: "The challenges I see with this are that at this moment\r\n1.  the link between recordings is now implemented by matching file names (up to the suffix)\r\n2. the temporal synchronization is now implemented by prioritizing one of the recordings (the func, meg, eeg) over the other (events, physio)\r\n\r\nFor 1 it would be needed to implement an explicit link between recordings (e.g. func and events) that are to be analyzed in combination. You could consider the current `IntendedFor` (linking MEG or EEG coordsys and anat/T1w) a step in that direction.\r\n\r\nFor 2 it would be needed to make the relative timing of the two recordings explicit. Right now I am personally using and recommending to others  the `acq_time` in the `_scans.tsv` file for that, like [here](http://www.fieldtriptoolbox.org/example/bids_pom/#final-_scanstsv-file). \r\n\r\nHowever, regardless of the motivation behind this proposal, both item 1 and 2 are now _already_ a problem for using BIDS to organize data in some cases. E.g. when you do combined fMRI and EEG and events. Or when you do a hyperscanning experiment, measuring EEG from multiple participants at the same time (as in <https://www.cell.com/current-biology/fulltext/S0960-9822(17)30411-6>).  Hence I think that these need to be addressed more systematically anyway.  \r\n"
  - author: tsalo
    createdAt: '2020-09-09T21:09:28Z'
    body: "> 1. the link between recordings is now implemented by matching file names (up to the suffix)\r\n\r\nIt's not a major problem, but this rule doesn't apply to entities that I would describe as \"within-acquisition\" (e.g., `echo` and `recording`). For example, events files associated with multi-echo fMRI scans should _not_ include the `echo` entity. I have an issue open in the main repo about making that distinction concrete (https://github.com/bids-standard/bids-specification/issues/530). The same would logically apply for the proposed entities `part` and `coil`/`ch`.\r\n\r\n> For 1 it would be needed to implement an explicit link between recordings (e.g. func and events) that are to be analyzed in combination. You could consider the current `IntendedFor` (linking MEG or EEG coordsys and anat/T1w) a step in that direction.\r\n\r\nI agree, something like `AcquiredWith` would be a pretty good alternative to a unique identifier in the metadata.\r\n\r\n> 2. the temporal synchronization is now implemented by prioritizing one of the recordings (the func, meg, eeg) over the other (events, physio)\r\n\r\nYes, this prioritization is what I'd like move away from- particularly for multimodal acquisitions.\r\n\r\n> For 2 it would be needed to make the relative timing of the two recordings explicit. Right now I am personally using and recommending to others the `acq_time` in the `_scans.tsv` file for that, like here.\r\n\r\nI hadn't considered the possibility of overlapping, but asynchronous, acquisitions (e.g., if EEG started before fMRI during a simultaneous EEG/fMRI study). What about a new metadata field called \"StartTime\", like the one already implemented for physio data? This would explicitly define the start time that events files should refer to, with the default being the start of the first data point (which is currently what the specification enforces)."
  - author: robertoostenveld
    createdAt: '2020-09-10T09:04:42Z'
    body: ' Regarding overlapping, but asynchronous, acquisitions; could you have a look at the http://bids.neuroimaging.io/bep009 PET proposal? That deals with PET (the scanner) and blood (which I guess is drawn from the arm). I believe that contrary to `events.tsv` (which now by definition must be time-aligned) they already added something to indicate how the blood timeseries is time-shifted  from the PET timeseries. '
  - author: yarikoptic
    createdAt: '2025-12-04T15:15:51Z'
    body: 'Would complete removal of `{datatype}/` folder "address" this issue:

      - https://github.com/bids-standard/bids-2-devel/issues/93'
- number: 44
  title: Move task information from data jsons to events jsons
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/44
  author: tsalo
  assignees: []
  labels:
  - 'impact: medium'
  - metadata
  createdAt: '2020-08-20T18:02:42Z'
  updatedAt: '2020-08-20T18:02:42Z'
  closedAt: null
  body: "The following metadata fields describe tasks, and are required by the specification to be placed in the _data_ file's associated metadata file instead of the events file's json:\r\n\r\n- TaskName\r\n- Instructions\r\n- TaskDescription\r\n- CogAtlasID\r\n- CogPOID\r\n\r\nI think that it would be preferable to have these fields in the `_events.json` file instead, starting at BIDS 2.0.\r\n\r\nThis stems from https://github.com/bids-standard/bids-specification/pull/573#issuecomment-675936309."
  comments: []
- number: 43
  title: 'Restructuring organization for participant level grouping '
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/43
  author: satra
  assignees: []
  labels:
  - 'impact: high'
  - folder-structure
  createdAt: '2020-08-17T14:44:08Z'
  updatedAt: '2024-05-18T19:48:01Z'
  closedAt: null
  body: "In BIDS thus far the notion of source data and derived data is a little contrived/vague. For example a multi-echo T1-weighted recon comes out of the scanner from a MEMPRAGE sequence is considered source data, while the FA image that comes out is not considered source data.\r\n\r\nAs scanners and other instruments get more advanced and start generating what we traditionally call derivatives (think GPU based processing on the scanner), this will lead to questions of where data goes. \r\n\r\nTo simplify consideration, the possibility I would like the BIDS community to consider is to separate data not by source vs derivatives, but by participant vs ~aggregate~ non-individual. As examples:\r\n\r\nParticipant\r\n1. source dicoms\r\n2. freesurfer recon\r\n3. fmriprep output\r\n4. meg windows around individual stimuli\r\n5. average ERP response\r\n...\r\n\r\n~Aggregate~ Non-individual\r\n1. Templates\r\n2. group statistical maps\r\n3. (partial) correlations\r\n...\r\n\r\nThis makes it, in my opinion, simpler to consider with regard to both metadata and with respect to provenance.\r\n\r\nWould love to hear thoughts on this potential reframing.\r\n"
  comments:
  - author: tsalo
    createdAt: '2020-08-17T15:08:48Z'
    body: Since this proposal is for 2.0, would this issue perhaps be a better fit for [bids-standard/bids-2-devel](https://github.com/bids-standard/bids-2-devel)? BTW, I know that there are a couple of issues there that also propose massive restructuring (e.g., https://github.com/bids-standard/bids-2-devel/issues/28, https://github.com/bids-standard/bids-2-devel/issues/37).
  - author: satra
    createdAt: '2020-08-17T15:11:23Z'
    body: i don't have the authorization to transfer, but i think it would be a good place for this to go.
  - author: poldrack
    createdAt: '2020-08-17T15:19:55Z'
    body: "to me the distinction between participant and aggregate seems equally\ncontrived. for example, we aggregate across individual images to analyze a\ntimeseries, aggregate across runs or sessions within participant, etc.  I\nagree that raw vs. derived is also a bit contrived, but seems to fit better\nwith the usual researcher's workflow. perhaps better to think of it as they\ndo in Psych-DS, where there are \"source data\" i.e. data that came directly\nfrom the measurement instrument, and then various levels of derivation from\nthat, some of which are \"primary\" (e.g. nifti images derived from dicoms)\nand others are derived (e.g. fmriprep outputs).  it seems necessary that\nsome of these concepts will necessarily be contrived, since they are meant\nto reflect as well as possible the usual scientist's workflow. the bigger\nchallenge is that as BIDS expands, there is a broader set of scientists\nwith a broader range of workflows, so the \"usual\" scientist becomes a\ncontrived notion as well.\n\n\nOn Mon, Aug 17, 2020 at 8:13 AM Satrajit Ghosh <notifications@github.com>\nwrote:\n\n> In BIDS thus far the notion of source data and derived data is a little\n> contrived/vague. For example a multi-echo T1-weighted recon comes out of\n> the scanner from a MEMPRAGE sequence is considered source data, while the\n> FA image that comes out is not considered source data.\n>\n> As scanners and other instruments get more advanced and start generating\n> what we traditionally call derivatives (think GPU based processing on the\n> scanner), this will lead to questions of where data goes.\n>\n> To simplify consideration, the possibility I would like the BIDS community\n> to consider is to separate data not by source vs derivatives, but by\n> participant vs aggregate. As examples:\n>\n> Participant\n>\n>    1. source dicoms\n>    2. freesurfer recon\n>    3. fmriprep output\n>    4. meg windows around individual stimuli\n>    5. average ERP response\n>    ...\n>\n> Aggregate\n>\n>    1. Templates\n>    2. group statistical maps\n>    3. (partial) correlations\n>    ...\n>\n> This makes it, in my opinion, simpler to consider with regard to both\n> metadata and with respect to provenance.\n>\n> Would love to hear thoughts on this potential reframing.\n>\n> —\n> You are receiving this because you are subscribed to this thread.\n> Reply to this email directly, view it on GitHub\n> <https://github.com/bids-standard/bids-2-devel/issues/43>, or unsubscribe\n> <https://github.com/notifications/unsubscribe-auth/AAGUVEC3CS7ITDKTAV4A4MDSBFCIXANCNFSM4QBX7S6Q>\n> .\n>\n\n\n-- \nRussell A. Poldrack\nAlbert Ray Lang Professor of Psychology\nBuilding 420\nStanford University\nStanford, CA 94305\n\npoldrack@stanford.edu\nhttp://www.poldracklab.org/\n"
  - author: satra
    createdAt: '2020-08-17T15:25:20Z'
    body: "@poldrack - this phrase is exactly the reason i wrote this.\r\n\r\n>  \"source data\" i.e. data that came directly from the measurement instrument\r\n\r\nwe don't treat these things consistently (see the MEMPRAGE and FA example above). and with new tools developing that do significant processing in the scanner itself (e.g., label regions and compute volumes), we would have to as part of the source processing make determinations as to where things would go.\r\n\r\n> for example, we aggregate across individual images to analyze a\r\ntimeseries, aggregate across runs or sessions within participant, etc.\r\n\r\nbut these are still individual-specific. perhaps `aggregate` is not the right term i meant to use. individual vs non-individual is what i wanted to convey."
  - author: tsalo
    createdAt: '2020-08-17T15:33:20Z'
    body: I believe that BEP001 does propose symlinking scanner-computed "derivatives" (like FA maps) from the "raw" dataset to the derivatives folder. This isn't a complete solution, but it does explicitly support derivatives coming directly from the scanner.
  - author: tyarkoni
    createdAt: '2020-08-17T16:16:17Z'
    body: "I agree with @poldrack that any organization we try to impose is going to be intuitive for some applications and problematic for others. I don't feel I have a good sense of which of these two schemes would be preferable, and I'd suggest that we stack these kinds of proposals and then at some point do a UX survey/study asking people what they (think they) prefer.\r\n\r\nThat said, as a practical matter, I think we should try to maintain backwards compatibility with BIDS 1.0 wherever possible, unless we have a really good reason not to. So, e.g., if 80% of users say that @satra's proposal would make their life considerably easier, then sure, let's break the BIDS 1.0 structure. But if, say, 55% prefer @satra's proposal and 45% prefer the existing scheme, I'd argue that that doesn't really justify having to introduce major changes to the entire tooling ecosystem, break people's habits, etc."
  - author: satra
    createdAt: '2020-08-17T16:44:04Z'
    body: "@tsalo - i think using symlinks is not a good option moving forward as storage providers move more towards object stores (so won't work on s3 for example). \r\n\r\n@tyarkoni - in general i have always seen bids as a view, and a darn useful organized view, on a more complex underlying information flow model. so yes, there is no perfect view, just a pragmatic one that addresses a large set of use cases. i really like the idea of doing some A/B testing, but in general before we even implement something like this, i would like a discussion of considerations as to how many folks would find the view useful. \r\n\r\nso here are some use cases where the participant-centered view can be useful.\r\n\r\n- aggregation of individuals across datasets\r\n- sharing/removing individual participants \r\n- decisions about where to find information about an individual\r\n- longitudinal applications within an individual\r\n- privacy protection (everything in a subject folder is subject to privacy considerations)\r\n- provenance (most things are derived from other things within a participant object)\r\n\r\nps. i haven't yet commented on the hierarchy principle issue, but will  do so sometime soon. it's a complex issue and relates to this proposal as well."
  - author: yarikoptic
    createdAt: '2020-08-26T15:45:00Z'
    body: "Sorry -- my reply came out long, but I think the issue is touching on many of largely orthogonal issues and should be broken into separate ones. So I added some sectioning\r\n\r\n### raw-vs-derived -- everything is derived!\r\n\r\n> In BIDS thus far the notion of source data and derived data is a little contrived/vague.\r\n\r\nI can only repeat an idiom I think BIDS should just accept and promote: **any BIDS data(set) is derived data(set)**. Accepting it would IMHO resolve aforementioned contradiction.\r\nIt is exemplified by many already existing provisions in BIDS mentioned above and a simple fact that BIDS provisions for `sourcedata/` -- in my view anything which has \"source (data)\" it came from is \"derived (data)\".\r\nI think such idiom is not in conflict with a notion that BIDS 1.x dataset to contain \"raw\" data (as close to the origin of the data, just merely harmonized to conform BIDS).  Taking it further, common derivatives dataset is just an enhancement on top of BIDS 1.x \"raw\" - it is a possible overlay on top of it (i.e. can be original \"raw\" + processed files where necessary).\r\nI think a possible way forward is to provision in `dataset_description.json` a field listing the \"tiers\" (or \"features\" or ... ?) of the dataset: \"raw\", \"common-derivatives\" (or simply \"processed\"), and just provide guidance on when to augment \"raw\" BIDS with derived data (annonimization, close-to-raw preprocessing etc), and when to produce \"separate\" derivatives (big pipelines output).\r\n\r\n### participant-vs-aggregate -- orthogonal issue, can be BIDS 1.x compatible\r\n\r\n>  ... to consider is to separate data not by source vs derivatives, but by participant vs aggregate non-individual.\r\n\r\nI think it is largely an orthogonal aspect to raw-vs-derived (again -- everything in BIDS is derived IMHO ;)).  Even though hardware ATM does not produce \"aggregates\", I do not see why it hypothetically couldn't and my wild prediction would be that at some point it might produce population templates per study etc.  So I would have added it as an additional \"feature\" explicitly (again annotated for in `dataset_description.json` with e.g. `levels\": [\"subject\", \"subject/session\", \"session\", \"study\"]` - ATM just implicit \"subject\" and \"subject/session\" levels) or implicitly (just by fact being present under standardized location e.g. `agg-<label>/` folders accompanied with `aggregates.json` describing aggregates or `ses-` for aggregates for sessions across subjects; `sub-*/` without `ses-/` subfolder for aggregates across sessions within subject with all \"derivatives\" annotation).  BIDS then would standardize layout/naming in those folders to follow overall BIDS naming approach (which would largely be \"drop `sub-` and/or `ses-` prefix depending on the group level\" + introduce missing entities to standardize composition annotation). And most likely it could be worked out in \"backward compatible\" way with BIDS 1.x thus even introduced prior BIDS-2.\r\n\r\n### Composition -- yet for BIDS to standardize a bit more\r\n\r\nAnother aspect which I think is discussed above without giving it an explicit name is \"composition\": we have not reached an ultimate agreement and thus have not provided a definite guidance on how BIDS datasets are composed together. Yes -- it was improved significantly with common derivatives adding a 2nd \"alternative\" composition in [common-principles](https://bids-specification.readthedocs.io/en/stable/02-common-principles.html#source-vs-raw-vs-derived-data). But IMHO `my_dataset` there should be promoted (or at least described to typically correspond to a \"study level\") to the explicit scope of a \"study\", which makes sense since there could be multiple ways to combine/process etc \"raw collected data\" for *any* study.  IMHO largely due to this absent \"study\" level standardization (just an \"alternative\" now,), \"raw\" BIDS originally provisioned having `derivatives/` only as a subfolder *within* raw BIDS. BIDS itself has `sourcedata/` and it \"scales\" to the derivatives as well: any derivative dataset can have `sourcedata/` pointing to (or many -- see below on `SourceDatasets`) source (possibly BIDS) datasets, thus allowing them to be \"also\" instantiated (installed/uninstalled in DataLad land) under corresponding `sourcedata/` within `rawdata/` and `derivatives/`.\r\n\r\nNote that a \"study\" even emerged naturally while preparing [fmriprep Nature protocols paper]( https://www.biorxiv.org/content/10.1101/694364v3.full), where there was `$STUDY/{ds000003/,derivatives/}` thus not sticking all derivatives **within** BIDS dataset.  One approach to general (non-BIDS specific really) composition is [YODA](https://github.com/myyoda) principles (see e.g. reused YODA figure in [ReproNim/containers](https://github.com/ReproNim/containers#repronimcontainers---containerized-environments-for-reproducible-neuroimaging)).\r\n\r\n### Linking+Provenance -- platform specific features should be avoided in BIDS but \"acknowledged\"\r\n\r\nDecision on how to \"compose\" would affect \"provenance\" and thus possibility/fragility to any type of \"linking\" across datasets/modules. E.g. under YODA principles, all necessary components for dataset generation should be reachable \"under\" that dataset boundary/directory.  So you could make a cut at `$STUDY` level and have everything to produce that study.  You could take a `derivative/*` dataset and have everything to produce that derivative (by it having source BIDS datasets \"referenced\" and \"instantiatable\" under e.g. `sourcedata/`). IMHO BIDS is almost there (see above on composition and `SourceDatasets`) but it should embrace and promote such idiom more (instead of having it merely an alternative).\r\n\r\nAforementioned composition talks about \"dataset(s)\" level. Discussions on \"symlinking\" (e.g. [relevant non-completed discussion in BEP001](https://github.com/bids-standard/bep001/issues/82)) probably could be addressed by \r\n\r\n1. allowing derived data be placed alongside with \"raw\" (see above on \"overlay\"):\r\n  - either that a file is a regular file or a symlink (where file system allows) on a particular dataset instance should not matter to BIDS!\r\n  - tools reading BIDS datasets must not dereference and follow symlinks (that is something to annotate for in BIDS, ref: [never finished PR](https://github.com/bids-standard/bids-specification/pull/227))\r\n  - if distribution/archival platform and receiving file system allows for symlinks -- they could be used/preserved, if not -- de-referenced (either by distribution or by the receiving tool, needs investigation). \r\n  - the main point is that symlinks, if chosen to be used for \"internal\" to a dataset deployment structuring, should not cross boundaries of the dataset (\"module\" in YODA terms) in its distribution (tarball, git repo, etc).\r\n2. provenance annotation on how any particular file was produced (generic provenance, applicable also to >90% of \"raw\" files)\r\n3. referencing \"subdatasets\". common-derivatives already introduced [`SourceDatasets`](https://bids-specification.readthedocs.io/en/stable/03-modality-agnostic-files.html#derived-dataset-and-pipeline-description) but it should be polished a bit more: IMHO it should not be just a list but an association for a folder (or subfolder(s) under `sourcedata/`).\r\n\r\nMany of aforementioned aspects do not even need to wait for 2.0 IMHO, i.e. could be introduced in backward compatible way."
  - author: robertoostenveld
    createdAt: '2020-08-27T07:04:29Z'
    body: "+1 for \"everything is derived\"!\r\n\r\nThe others are more subtle to simply give a positive or negative vote. "
  - author: poldrack
    createdAt: '2020-08-27T15:36:09Z'
    body: "on the one hand I agree that technically everything is derived. on the\nother hand, most researchers in the field a comfortable with the idea of\n\"raw\" data - i.e. the data as they are delivered by the measurement\ndevice.  We need to balance technical accuracy in the terminology with\nusability - I think this issue definitely requires more discussion with\nusers in addition to developers.\n\nOn Thu, Aug 27, 2020 at 12:04 AM Robert Oostenveld <notifications@github.com>\nwrote:\n\n> +1 for \"everything is derived\"!\n>\n> The others are more subtle to simply give a positive or negative vote.\n>\n> —\n> You are receiving this because you were mentioned.\n> Reply to this email directly, view it on GitHub\n> <https://github.com/bids-standard/bids-2-devel/issues/43#issuecomment-681652339>,\n> or unsubscribe\n> <https://github.com/notifications/unsubscribe-auth/AAGUVEFBTLIWBMWC47FGWILSCYAQXANCNFSM4QBX7S6Q>\n> .\n>\n\n\n-- \nRussell A. Poldrack\nAlbert Ray Lang Professor of Psychology\nBuilding 420\nStanford University\nStanford, CA 94305\n\npoldrack@stanford.edu\nhttp://www.poldracklab.org/\n"
  - author: yarikoptic
    createdAt: '2024-04-17T20:21:01Z'
    body: "@satra \r\nGiven that we formalized operational definition of \"derivative\" to be a \"BIDS dataset derived from other BIDS dataset(s)\", could/should we consider this issue overall addressed?  Note that we also have specific issues which IMHO relate such as\r\n\r\n- #54 \r\n- #59\r\n\r\nand others slated for BIDS 2.0 in https://github.com/orgs/bids-standard/projects/10 .\r\n\r\nIf not resolved/sufficiently covered by other issues -- what specific changes would you propose?"
  - author: satra
    createdAt: '2024-05-18T19:48:01Z'
    body: '@yarikoptic - i think the intent of this issue was primarily asking if some aspects of organization are participant/session/cohort/group specific. some of it would indeed benefit from simplify having the provenance, but others would need some notion of separating grouping of derivatives, e.g. something like a group average connectome would be different from individual connectomes. i think you note all of these in your response above, but i''m not sure they are mapped to specific other issues.'
- number: 41
  title: Software Ecosystem Plan
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/41
  author: jbteves
  assignees: []
  labels: []
  createdAt: '2020-08-05T13:39:57Z'
  updatedAt: '2023-08-07T16:16:52Z'
  closedAt: null
  body: "I would like to see as part of the v2.0 standard, a concrete plan of action for creating a robust software ecosystem around BIDS. I believe that standards should come with as complete as possible tooling to support that standard. While it's true that many apps have been developed to be BIDS-compatible, I think that the current approach is not communally focused and instead requires going back and forth between major packages and asking them to implement changes for BIDS, rather than implementing complete solutions. I would also propose that a full-fledged 2.0 would minimally consist of the following software solutions (some of which already exist):\r\n1. A web-based validator tool. \r\n2. A command-line-based validator tool. \r\n3. A conversion tool which guides the user through the creation of a full BIDS-compliant dataset, or trivially adds to an existing one. (Note: dcm2niix and heudiconv exist to facilitate this, but still require that the *user* follow the specification and validate. I propose that the *program* follow the specification and validate; this is a reason for requiring (2)).\r\n4. A tool which queries metadata via the command line to enhance scriptability.\r\n\r\nIf there exists some plan already and I've missed it, please feel free to close this issue."
  comments:
  - author: tyarkoni
    createdAt: '2020-08-05T14:37:50Z'
    body: Can you elaborate on what you think a concrete plan of action of this sort would look like? BIDS doesn't have a dedicated, long-term funding source; the initiative is entirely reliant on the community for contributions. So conditioning the release of 2.0 on having the kinds of tools you describe—which I suspect everyone agrees would be great to have—seems like a recipe for never releasing 2.0. (For reference, there isn't even have a fully-compliant web-based validator for 1.0 at the moment, and it's not because people don't think this is important.)
  - author: jbteves
    createdAt: '2020-08-05T15:19:33Z'
    body: "In that case, part of the concrete plan of action would include securing funding. Are there existing efforts to secure the funding? If so, how might one contribute?\r\n\r\nA concrete plan of action would include specifications for what these programs would do, contact points for who is responsible for overseeing the projects, and agreements for funding their development rather than ad-hoc volunteering.\r\n\r\nThis goes more into governance, but one barrier to adoption at my institution is the lack of existing software and long-term funding for BIDS. So I would view this is a key issue."
  - author: tyarkoni
    createdAt: '2020-08-05T15:41:55Z'
    body: "> In that case, part of the concrete plan of action would include securing funding. Are there existing efforts to secure the funding? If so, how might one contribute?\r\n\r\nThere have been, and continue to be, plenty of efforts to secure funding. But most of them, as you might expect, are focused on expanding whatever part of the ecosystem is most salient to the proposing researcher's needs. If you (or someone at your institution) want to write a grant proposal to fund the tools you describe, you're welcome to, and I'm sure the community would be happy to contribute, provide letters of support, etc (I certainly would!). But we are operating on the academic model here; nothing is going to happen unless someone takes the initiative, because everyone is already overcommitted and has other things on their plate. (And of course, when people do get funding, there's no guarantee that they'll share your assessment of what ought to be prioritized.)\r\n\r\n> A concrete plan of action would include specifications for what these programs would do\r\n\r\nFeel free to draft specifications to this effect; I'm sure people would be happy to consider them for inclusion in a 2.0 draft.\r\n\r\n> contact points for who is responsible for overseeing the projects, and agreements for funding their development rather than ad-hoc volunteering.\r\n\r\nSee above: this is all contingent on someone volunteering their time to lead such projects, or securing the funding for them.\r\n\r\n> This goes more into governance, but one barrier to adoption at my institution is the lack of existing software and long-term funding for BIDS. So I would view this is a key issue.\r\n\r\nUnderstandable, but that's the reality of it. I don't think folks in the BIDS community are naive to the fact that if there were better tooling and long-term support, people would be more likely to adopt the standard. But as a community-driven effort, there is no way to wave a magic wand and obtain a bunch of FTEs to do the work. I think the success of BIDS so far is a testament to many PIs and institutions' recognition that BIDS isn't a turnkey commercial product, and does require some investment of time and/or energy at the moment. There's no question that there are limitations, and that some people/institutions might not buy in because of them."
  - author: mateuszpawlik
    createdAt: '2023-08-07T13:48:00Z'
    body: I'd like to chip in to point 3. with [BIDScoin](https://bidscoin.readthedocs.io/en/stable/) which uses BIDS schema for DICOM to BIDS conversion. I'm not the software developer. I like many features of BIDScoin but you can judge yourself.
  - author: yarikoptic
    createdAt: '2023-08-07T16:16:52Z'
    body: "Indeed BIDS schema and https://bidsschematools.readthedocs.io help along the way here.\r\nFinalizing current JavaScript-written validator to become fully schema-driven is already pretty much pre-requisite for instigation \"schema-level\" work towards \"BIDS 2.0\".\r\n\r\nAs for 3 and 4 (conversion tool, metadata query library/tool).  I do not think there would ever be \"the standard\" conversion tool, especially as an increasing number of modalities being supported by BIDS.  Thus it is critical to have validation/validator a separate tool.  Now, having BIDS specified through schema opens indeed for better possibilities for metadata querying tools but again I do not see \"the one and only\" to be made available.\r\n\r\nOverall, I think we would need to limit the \"software ecosystem plan\" to\r\n- schema library (currently only Python): providing high level abstractions to load/manipulate schema elements\r\n- validator(s): ATM JavaScript one is canonical and there is only basic validation implemented within bids schema tools in Python.  It should be possible to implement fully fledged Python implementation of validator (@effigies said that he even had implemented some Python based parser for the validation specifications in the schema) but I am not totally certain it must be the requirement for BIDS 2.0 release.\r\n"
- number: 40
  title: Enforce TE ordering for multi-echo fMRI data
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/40
  author: tsalo
  assignees: []
  labels:
  - 'impact: low'
  - metadata
  createdAt: '2020-08-03T14:50:31Z'
  updatedAt: '2020-08-04T22:01:55Z'
  closedAt: null
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\nCurrently, individual echos in a multi-echo fMRI sequence can occur in an unspecified order, with the “shortest echo” i.e., the echo with the shortest TE, listed as either the first or last echo in the sequence.\r\n\r\nThis proposal would standardize echo naming such that `*_echo-1*` is always the shortest echo and all following echos are indexed in sequential order. This would enable parsing multi-echo fMRI data from the file names, without relying on associated metadata. It would also standardize echo ordering across datasets, preventing the confusion of co-existing “little-endian” and “big-endian” echo naming schemes.\r\n\r\nRelevant discussion: https://groups.google.com/forum/#!topic/bids-discussion/Utv29uL0Bdc\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original authors**: @emdupre\r\n"
  comments:
  - author: tsalo
    createdAt: '2020-08-03T14:54:59Z'
    body: I think that this could be extended to all naturally ordered indexable metadata-based entities, including the ones proposed by BEP-001 (e.g., `fa`).
  - author: jbteves
    createdAt: '2020-08-04T22:01:54Z'
    body: Agree; additionally, standardization of echo ordering would make it easy to enumerate echoes by name and combine data quickly, reduce developer and/or analyst burden.
- number: 39
  title: Move and rename IntendedFor field from fieldmap to functional image
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/39
  author: tsalo
  assignees: []
  labels:
  - 'impact: medium'
  - metadata
  createdAt: '2020-08-03T14:49:54Z'
  updatedAt: '2022-05-17T17:21:25Z'
  closedAt: null
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\nUnder the current BIDS Specification, the field defining which fieldmaps are associated with each epi image are defined in the fieldmap. Accessing this information requires some kind of backwards logic and searching through all fieldmap metadata to find which ones correspond to a given file, my solution to this is moving the field to the epi image metadata in a new field like AssociatedFieldmaps or AssociatedDistortionmaps, meaning the information as to which fieldmap is associated with each image is easily accessible by calling that epi images metadata.\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original authors**: @akimbler\r\n"
  comments:
  - author: jbteves
    createdAt: '2020-08-04T22:05:25Z'
    body: "I would like to agree in particular with using the field name\r\n```\r\nAssociatedDistortionMap\r\n```"
  - author: tsalo
    createdAt: '2022-05-17T17:21:24Z'
    body: Given that https://github.com/bids-standard/bids-specification/pull/622 was merged into the specification, I think this proposal could be amended to "Remove IntendedFor field in favor of B0FieldIdentifier and B0FieldSource".
- number: 38
  title: Extended BIDS for animals
  state: CLOSED
  url: https://github.com/bids-standard/bids-2-devel/issues/38
  author: tsalo
  assignees: []
  labels:
  - entities
  createdAt: '2020-08-03T14:15:16Z'
  updatedAt: '2024-04-24T19:51:16Z'
  closedAt: '2024-04-24T14:58:22Z'
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\nCould we have sub- changed to the species e.g. in http://datashare.is.ed.ac.uk/handle/10283/2122 we used rat instead of sub (rat- mice- cat- dog- there is more and more stuff out there now)\r\n\r\nwhen using mutant we could either have it in the participant description or right away in the name, e.g. rat-SD-Bdnftm1sage_seq-SE_task_flashing-light_bold.nii.gz\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original authors**: Unknown\r\n"
  comments:
  - author: tsalo
    createdAt: '2020-08-03T14:15:42Z'
    body: "@TheChymera wrote:\r\n\r\n> Could we have sub- changed to the species e.g. in http://datashare.is.ed.ac.uk/handle/10283/2122 we used rat instead of sub (rat- mice- cat- dog- there is more and more stuff out there now)\r\n\r\nI would advise against this. I work with animals myself, and each animal is a subject. Sub is perfectly fine.\r\n"
  - author: tsalo
    createdAt: '2020-08-03T14:16:00Z'
    body: "@CPernet wrote:\r\n\r\n> I would advise against this. I work with animals myself, and each animal is a subject. Sub is perfectly fine.\r\n\r\nyes and no, sub is perfectly fine indeed but then in a large database it makes things easy to download / analyze based on the name"
  - author: tsalo
    createdAt: '2020-08-03T14:16:43Z'
    body: "@jcolomb wrote: \r\n\r\n> yes and no, sub is perfectly fine indeed but then in a large database it makes things easy to download / analyze based on the name\r\n\r\nI would also say this information should not end in the folder name, it will make development of tool species specific... a specific type of metadata would do the trick (and be back-compatible (?) )\r\n"
  - author: tsalo
    createdAt: '2020-08-03T14:17:09Z'
    body: "@TheChymera wrote:\r\n\r\n> when using mutant we could either have it in the participant description or right away in the name, e.g. rat-SD-Bdnftm1sage_seq-SE_task_flashing-light_bold.nii.gz\r\n\r\nThe difference between mutants and genotypes is merely nominal. Increasingly, double and triple transgenes are used in mouse studies. Soon enough multiple genotypes will be tracked in species without inbred strains (incl humans). This addition simply doesn't scale. Not least of all, Bdnf isn't a very descriptive mutant name. Is it a knockout? Point mutation? Variant? and then, is that homozygous? hetero? Ideally we should be weary of BIDS tracking too much info, lest it becomes encumbered. If necessary, I would propose tracking such info in a per-subject JSON.\r\n"
  - author: tsalo
    createdAt: '2020-08-03T14:17:25Z'
    body: "@CPernet wrote:\r\n\r\n> The difference between mutants and genotypes is merely nominal. Increasingly, double and triple transgenes are used in mouse studies. Soon enough multiple genotypes will be tracked in species without inbred strains (incl humans). This addition simply doesn't scale. Not least of all, Bdnf isn't a very descriptive mutant name. Is it a knockout? Point mutation? Variant? and then, is that homozygous? hetero? Ideally we should be weary of BIDS tracking too much info, lest it becomes encumbered. If necessary, I would propose tracking such info in a per-subject JSON.\r\n\r\nyes agree we can move it in the JSON - do you have references / standard on how to ref animals ; I know there is some work done on using DOI to identify them ; might be worth having this as well if possible\r\n"
  - author: TheChymera
    createdAt: '2020-08-03T19:54:28Z'
    body: "> yes agree we can move it in the JSON - do you have references / standard on how to ref animals ; I know there is some work done on using DOI to identify them ; might be worth having this as well if possible\r\n\r\nThis is very much an open question, we would need input from somebody who is more thoroughly active in the cutting-edge of genetics. Genome sequencing is not ubiquitous enough for us to be able to link the genome via a DOI. In animals for which we use inbred strains, a possible solution would be to have a string field for the strain, and a list of strings field for the tested genetic variants, e.g.\r\n\r\n```\r\nstrain: 'C57BL/6'\r\ngene_variants: ['DAT-IRES-Cre','ePet-Cre']\r\n```\r\n\r\nThis is of course, just a dummy example; in truth gene variants have highly complex naming schemes (see these links for the above two: https://www.jax.org/strain/006660 , https://www.jax.org/strain/012712 ), with plenty of superscript levels. We would first need to find out what the best standard for unambiguous identification of gene variants and insertion sites is, and just use that. Ideally this would also be a standard which doesn't use superscript — while I do assume we all use unicode by now, there's lots to be said for legibility and ease of manipulation in plain text. "
  - author: jcolomb
    createdAt: '2020-08-03T20:36:44Z'
    body: "Please, have a look at reagents.io .\r\n\r\nIn brief: for reagents, the best PID are called RRID, but while some tried to use it for animal strains, specialists are calling against it, but would better see a system using the PID of the databases (species specific database for now, but see the encode project: https://www.encodeproject.org)\r\n\r\nfor rodents, there are MGI numbers. I do not know if one can get a MGI number for a strain before publication or if only published strains/genetic alteration get one. For example, for the first example above ( https://www.jax.org/strain/006660), the correct PID would be http://www.informatics.jax.org/allele/genoview/MGI:3689567.\r\n(the first link goes to the specific strain available at jax, the second could link to several mice providers.)\r\n\r\nIt is quite complexe to find and few researchers would get it right..."
  - author: SylvainTakerkart
    createdAt: '2020-10-06T09:50:37Z'
    body: "Hi all, thanks @jcolomb to mention the neuroscience-data-structure project\r\n\r\nWe have indeed launched a dedicated focus group (which will soon appear as a Special Interest Group of the INCF) to try to standardize the structuring of data and metadata recorded in animal models, with any modalities (from electrophysiology to calcium imaging, via MRI)... Several ongoing initiatives are trying to address this question, and we'd like to see how to accommodate them to reach a wide adoption by the community. One of the questions that we aim at addressing is of course \"would it make sense to do this within BIDS, or are there enough specifics with animal data that forces us to go outside of BIDS\", and we of course would like to address this question with as much feedback as possible from the community...\r\n\r\nAnyhow, if you are interested in this endeavor, do not hesitate to get in touch with me and/or to participate in the discussions that we started in the Issues of this project: https://github.com/INCF/neuroscience-data-structure\r\n\r\nCheers,\r\n\r\nSylvain"
  - author: SylvainTakerkart
    createdAt: '2020-10-06T10:58:11Z'
    body: "> @TheChymera wrote:\r\n> \r\n> > Could we have sub- changed to the species e.g. in http://datashare.is.ed.ac.uk/handle/10283/2122 we used rat instead of sub (rat- mice- cat- dog- there is more and more stuff out there now)\r\n> \r\n> I would advise against this. I work with animals myself, and each animal is a subject. Sub is perfectly fine.\r\n\r\nin parallel with the wider neuroscience-data-structure project, we've tried to come up with some internal rules within our 150-people institute (see our current state of affairs here: https://int-nit.github.io/AnDOChecker/ ; it's not BIDS-compatible, but not too far... comments welcome!!! ;) )... we chose to stick with sub-XXX, and we're pushing towards XXX being some kind of GUID; for animals, our GUID remains human-readable, and we we have one letter dedicated to specifying the species of the animal in our GUID...\r\n\r\n"
  - author: yarikoptic
    createdAt: '2024-04-24T14:58:22Z'
    body: As to me this proposal goes against common principle of BIDS of having `entity-{value}` composition in the filenames etc, but taking `value` of a potential entity (`species`) and making it into an "entity". Also demand seems to be simply not there, so I would simply close this one. If someone wants to resurrect -- please chime in, or do so.
  - author: TheChymera
    createdAt: '2024-04-24T16:15:13Z'
    body: Not resurrecting, just updating, since the original `rat-{value}` proposal was a quote from me. I have long since moved to `sub-{value}`. This is no longer a current proposal on my part.
