- number: 33
  title: 'Make key/value pair: _run-XX suffix mandatory'
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/33
  author: tsalo
  assignees: []
  labels:
  - 'impact: low'
  - entities
  createdAt: '2020-08-03T13:57:07Z'
  updatedAt: '2024-03-19T18:55:49Z'
  closedAt: null
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\nCurrently the key/value pair:   _run-01, _run-02 suffix can be optionally omitted.\r\n\r\nIt would be good we me make this mandatory it would be better for long-term data collection and ease adding to data sets at a later point.   For instance, you might start a study thinking you will only have 1 run and choose to omit the run suffix.  Later on, your study design could change you will have multiple runs.  In this situation you would have to go back and rename all of you files to include the suffix.  Moreover, if this dataset has already been imported into a database (i.e   LORIS),  it will be ever harder to manage this.\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original authors**: Unknown\r\n"
  comments:
  - author: tsalo
    createdAt: '2020-08-03T13:57:24Z'
    body: "Robert Welsh wrote:\r\n\r\n+1"
  - author: yarikoptic
    createdAt: '2024-03-19T18:55:47Z'
    body: I do not see a reason for  `_run` to become a special mandatory entity! We do not even have session mandatory. The overall rule I think (besides mandatory ATM `sub`) is to add entity whenever it is the best disambiguation from another file/data collection.  As soon as there are multiple files of the same thing acquired multiple times -- add `_run`. If it is e.g. two different functional runs of different tasks, add `_task-` (IIRC it might be mandatory ATM for `func` but you get the point ;)).
