    createdAt: '2024-04-24T16:33:11Z'
    body: 'Ok , for now it would be


      **Decided by @yarikoptic with possible input from the community, based on difference between 👎 - 👍 or lack of enthusiasm/activity from others**.


      Reopen if you would propose to refine and how'
- number: 55
  title: Change modality directories to entity format
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/55
  author: Lestropie
  assignees: []
  labels:
  - folder-structure
  createdAt: '2023-06-29T01:09:40Z'
  updatedAt: '2024-04-24T12:28:53Z'
  closedAt: null
  body: "Related to the recent #54.\r\nRelates to many issues I've encountered with BEP016 https://github.com/bids-standard/bids-bep016; maybe best reference is https://github.com/bids-standard/bids-bep016/issues/32.\r\nThe rejected https://github.com/bids-standard/bids-specification/pull/1280 is also somewhat relevant.\r\n\r\nEmbedded in the current BIDS structure is a very specific hierarchy of directory structure, with very specific use *or non-use* of one (*sometimes exclusively*) \"entity\" key-value pairs. We might summarise as something like this:\r\n\r\n|                                                  | Type      | Entity key-value |\r\n|--------------------------------------------------|-----------|------------------|\r\n| `sub-<label>/                                  ` | Directory | ONE              |\r\n| `    ses-<label>/                              ` | Directory | ONE              |\r\n| `        modality/                             ` | Directory | NO               |\r\n| `            sub-<label>_ses-<label>_suffix.ext` | File      | MANY             |\r\n\r\nWhat I've encountered in BEP016 (and I fully expect to arise in other derivatives) is that there are circumstances in which the derivatives specific to some modality aren't just an unstructured set of data / sidecar file pairs; there can be further hierarchical structure.\r\n\r\nIn contemplating the various potential structural solutions to that, which I've probably written *too* much about and discouraged engagement by doing so, one factor that shows itself as an annoyance quite frequently is the modality level. Unlike subject and session, it doesn't possess the key-value formatting. So for instance, the https://github.com/bids-standard/bids-specification/pull/1280 solution would look like:\r\n\r\n|                                                                    | Type      | Entity key-value |\r\n|--------------------------------------------------------------------|-----------|------------------|\r\n| `sub-<label>/                                                    ` | Directory | ONE              |\r\n| `    ses-<label>/                                                ` | Directory | ONE              |\r\n| `        modality/                                               ` | Directory | ***NO***         |\r\n| `            model-<label>/                                      ` | Directory | ***ONE***        |\r\n| `                sub-<label>_ses-<label>_model-<label>_suffix.ext` | File      | MANY             |\r\n\r\n, which is inconsistent in terms of entity key-value formatting across directories.\r\n\r\nFor complete flexibility of sub-directory structure as per #54, which would go a long way to solving the BEP016 issues, it would make far more sense if sub-directories separating data corresponding to different brain imaging modalities were to follow the entity key-value naming standard."
  comments:
  - author: yarikoptic
    createdAt: '2023-10-08T00:47:45Z'
    body: "I think it relates also to \r\n- https://github.com/bids-standard/bids-specification/issues/584\r\n\"confusion\" which was resolved by \r\n- https://github.com/bids-standard/bids-specification/pull/592\r\nwhich clarified that the directory `modality/` is actually the `datatype/` . But also I think it is interestingly relates to\r\n- https://github.com/INCF/neuroscience-data-structure/issues/18\r\nsince currently `datatype`s we use are not \"modality agnostic\" as e.g. `func` is specifically \"fMRI\" or to say \"fMRI+whateverelse-during-fMRI-scan\". "
  - author: yarikoptic
    createdAt: '2024-02-07T01:48:20Z'
    body: "FTR to clarify the \"terminology\", in the schema those folders are not \"modalities\" which are a higher level concept, e.g. as `mri` but \"datatypes\": see https://github.com/bids-standard/bids-specification/blob/master/src/schema/rules/modalities.yaml . For any modality other than `mri` there is one-to-one correspondence ATM between \"modality\" and \"datatype\". I guess it was devised so to address the historical aspect that initially BIDS was solely for MRI modality.\r\n\r\nBut the point of confusion that we also have [modality entity (`_mod-`)](https://bids-specification.readthedocs.io/en/stable/glossary.html#modality-common_principles) and a common principle which are not that \"high level modality\", uff:\r\n![image](https://github.com/bids-standard/bids-2-devel/assets/39889/0ca8f734-2cde-4d0e-88a5-aef7538830f8)\r\n\r\nSo the actual \"thing\" this issue is concerned is really some `datatype`  for which we do not have an entity devised yet.\r\n\r\nSo for the bids v2 we might want to clarify this a little messy situation indeed. "
  - author: yarikoptic
    createdAt: '2024-03-19T14:02:41Z'
    body: 'Just a note: an interesting aspect/PoV @effigies brought up in a road-trip discussion is that this `modality` (AKA `datatype`) directory for many (everything non-MRI? e.g. `eeg`, `meg`) corresponds to the `_suffix` of the files, hence somewhat/partially consistent as it is not an entity thus does not have `entity-` prefix in the folder name.  Sure thing it doesn''t *work* for MRI where we have a list of dedicated subfolders (`func`, `anat` etc) which do not correspond to suffixes, although in some cases could easily do (e.g. would be ok to have `bold/` IMHO).'
- number: 54
  title: Make it possible to specify folders layout to be other than sub-{label}/[ses-{label}/]
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/54
  author: yarikoptic
  assignees: []
  labels:
  - 'impact: high'
  - folder-structure
  - modularity
  createdAt: '2023-05-31T13:35:43Z'
  updatedAt: '2024-09-20T22:55:22Z'
  closedAt: null
  body: "**Origin:** Originally summarized/presented in https://github.com/bids-standard/bids-specification/issues/751#issuecomment-820800800 (not duplicating here for now) while discussing a possible \"stimuli BEP\" and where it boiled down to having some `stim-{label}/` folders structure either at top level or under `stimuli/`, which is currently no defining any structure to use there.\r\n**Current state:** many usecases collected (see e.g. below), design being formalized in\r\n- https://github.com/bids-standard/bids-specification/pull/1809\r\n\r\nOther relevant issues in this bids-2-devel or elsewhere I found which would be partially or fully addressed with such enhancement\r\n- https://github.com/bids-standard/bids-2-devel/issues/11 : add `/site-<site_label>` level in favor of encoding it within `/ses-{label}`\r\n- https://github.com/dandi/dandi-cli/issues/1302 - in DANDI we support a lightweight \"BIDS-inspired\" layout (while [BEP032](https://bids.neuroimaging.io/bep032) is still being worked on) which has no `/ses-{label}` subfolder since makes little sense since lots of sessions and 1 file per session with possibly already a long file name due to long `sub` and `ses` labels.\r\n- https://bids.neuroimaging.io/bep038 - Atlases BEP... IMHO could have `atlas-<label>/` top level structure for the entity `atlas`\r\n  - gives a use case inspiring the description to allow for such \"leading prefix `atlases/`\" description as well.  So we might have smth like `{'.': [\"subject\", \"[session]\", \"`datatype`\"], 'atlases': [\"atlas\"]}` to describe that on top level we separate at `subject` level and under `atlases/` -- at \"atlas\", but for a dataset which is purely an \"atlas\" dataset, it could be `{'.': [\"atlas\"]}` \r\n- https://bids.neuroimaging.io/bep035 - MEGA (Modular extensions for individual participant data mega-analyses) BEP.  Proposes `study-` entity at the top level and `studies.tsv` to summarize.\r\n- would provide a solution for #59\r\n\r\n   <details> \r\n   <summary>example (prototype since we have not boiled down syntax)</summary>\r\n\r\n   top level `dataset_description.json` could have \"default\" one\r\n    \r\n    ```json\r\n    \"DatasetLayout\": { \".\" : [{ \"entity\": \"subject\", \"folder\": true }, { \"entity\": \"session\", \"folder\": true }] }\r\n    ```\r\n    \r\n    whenever nested BIDS dataset at `sub-XXX/ses-YYY/` level have\r\n    \r\n    ```json\r\n    \"DatasetLayout\": { \".\" : [{ \"entity\": \"subject\", \"folder\": false }, { \"entity\": \"session\", \"folder\": false }] }\r\n    ```\r\n    \r\n    thus signaling that `sub-XXX_ses-YYY_` should still be within the target filename as a prefix but no leading directories should be there.\r\n    \r\n    </details> \r\n\r\n- in the scope of stimuli BEP (XXX, [google doc](https://docs.google.com/document/d/1DoQghbJlQksCHEFs0boT816p3ejX2Hd9l-OWDTXFtV8/edit)), to accommodate large stimuli databases, such as https://cocodataset.org/ with 330K images, it would require some groupping. But we would need to figure out how to group in general -- would require more entities than just `stim-`\r\n- some heavy datasets might want even more entities to be used. E.g. in https://dandiarchive.org/dandiset/000026, there are thousands files for about 50 different `_sample-`s under [sub-I38/ses-SPIM/micr](https://dandiarchive.org/dandiset/000026/draft/files?location=sub-I38%2Fses-SPIM%2Fmicr) so it would have been logical to add `sample-<label>/` level and `samples.tsv` to describe them, make it smth like\r\n```json\r\n    \"DatasetLayout\": { \".\" : [{ \"entity\": \"subject\"}, { \"entity\": \"session\" }, { \"entity\": \"sample\" }] }\r\n```"
  comments:
  - author: yarikoptic
    createdAt: '2024-01-26T15:14:12Z'
    body: "In like of discussion on [Atlases BEP](https://github.com/bids-standard/bids-specification/issues/1281#issuecomment-1911641822) I think we should provide some overall formalization behind BIDS files/structure, which could sound like\r\n\r\noverall organizational principle which could describe \"how BIDS file hierararchy is built\", we might be able at some point to state something like \r\n\r\n- a folder `entities/` (a plural version of the `entity`) to make that entity the leading entity to distinguish groups of files\r\n- subsequent subfolders `ent-<label>/` (`ent` as an abbreviated version of `entity`) could be provisioned to further group data for the same `ent-<label>/`.\r\n- file `entities.tsv` with a corresponding `entities.json` to describe columns in the `.tsv` is recommended to be provided\r\n  - note: we might or not want to harmonize `participants.tsv` -> `subjects.tsv` for unification and despite suboptimal connotation. \r\n- another entity, e.g. `entity2`, could be chosen for the next level of groupping under the first level `entity`.  In such case the leaf filenames would acquire `ent-<label>_ent2-<label>_` prefixes.\r\n\r\nSuch principle already lays down well for our `sub-/ses-` hierarchy and having `participants.tsv` for `sub-` and `sessions.tsv` for `_ses-`,  for `_desc` we have `descriptions.tsv`, so overall \"backward compatible\" (but see #55 which breaks it on two aspects: no ent- prefix and no _ent- portion in the filename prefix)."
  - author: arnodelorme
    createdAt: '2024-04-17T16:39:52Z'
    body: "Is there an example of a use case where this would be relevant? @yarikoptic  BIDS 2.0 is meant to be more user-friendly. Complexifying an already complex scheme will not make BIDS 2.0 more user-friendly. \r\n\r\nAlso, about the logic with prefixes, entities, simmetries between all entities, etc. While it makes a lot of sense to computer scientists, it is completely lost on the common mortal. "
  - author: yarikoptic
    createdAt: '2024-04-17T20:21:58Z'
    body: "Examples are linked in the original description.  Added one more for #59 . \r\nAny lack of \"symmetry\" actually hurts mortals (e.g. classical \"why is it `sub-`, but then `participants.tsv`?\" although it is a separate issue #14 but most representative of consistency/symmetry here)."
  - author: mateuszpawlik
    createdAt: '2024-06-26T13:10:49Z'
    body: "I second @arnodelorme here. I'm dealing with BIDS datasets for several years now while building a repository. I can't understand the motivations and implementations of this issue. Do you expect people and tools to understand a flexible layout like the one explained here? In my opinion, this adds an unnecessary level of indirection. Suddenly, all the tools we're using will have to interpret some directory layout specification. And once flexibility is allowed, you can expect everyone to use it, possibly leading to a different layout for each dataset.\r\n\r\nIt's complicated enough to deal with optional sessions while implementing a tool. We decided internally, and users didn't object, to make sessions mandatory just not to deal with handling that.\r\n\r\nThe strength of BIDS is its specificity, fixed directory structure, and file naming convention. I wouldn't go away from that."
  - author: yarikoptic
    createdAt: '2024-09-20T17:28:12Z'
    body: "@arnodelorme and @mateuszpawlik thank you very much for chiming in!  I would be happy to explain more on my motivation beyond use cases I keep populating in the original description. But may be we could discuss them \"interactively\"?  Are you planing to attend upcoming INCF in Austin, TX or SfN in Chicago, IL?  If not -- we could zoom.\r\n\r\nQuick summary answer to @mateuszpawlik : one of the original motivations is that BIDS already covers more than just 'neuroimaging' data (e.g. microscopy) and even more modalities would become supported as time goes. Not all of them have `subject` as the level of differentiation most appropriate at the highest level. Could be as large as a \"study\" or as little as a \"slice\" (see OP for references). Talking about people, when you come to a new BIDS dataset and see that on first level you have `sample-1/` , `sample-2/` and so on, you would immediately understand (without even looking anywhere) that it is about different `samples` (it is a standard BIDS entity).  And I do acknowledge that for tools it would indeed require some development to support the specification, instead of hardcoding fixed assumption of the hierarchy.  But I also hope that common libraries like schemabidstools and `pybids` could assist in making such transitions easier, while empowering those tools to support a much wider range of cases."
  - author: tgbugs
    createdAt: '2024-09-20T17:43:52Z'
    body: One example use case is that if bids 2 were to include the ability to specify layout and metadata location/binding rules at a meta level, then it would be possible to express those rules for other standards (e.g. SDS). This would allow formats that diverged from bids 1 due to its limitations to reconverge on bids 2.
  - author: yarikoptic
    createdAt: '2024-09-20T19:29:37Z'
    body: 'Thank you @tgbugs for the feedback/support.  Please :+1: this issue ;) Do you think you could compile a list of possible steps to converge SDS to BIDS, e.g. [like I did for DANDI](https://github.com/dandi/dandi-cli/issues/1498) ?'
  - author: tgbugs
    createdAt: '2024-09-20T22:55:22Z'
    body: I will take shot at a list of possible steps though will likely only get to it after Neuroinformatics and SfN.
- number: 53
  title: Change handling of field mapping information
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/53
  author: Lestropie
  assignees: []
  labels: []
  createdAt: '2022-08-08T05:56:00Z'
  updatedAt: '2024-05-22T18:47:40Z'
  closedAt: null
  body: "Relates to #39 here, bids-standard/bids-specification#622 in BIDS 1.0, maybe others also. Had hoped to discuss at OHBM22 but didn't get the chance.\r\n\r\nI *really* dislike having information regarding how an inhomogeneity field should be estimated (\"`B0FieldSource`\") and the images to which that estimate should be applied (\"`IntendedFor`\") encoded alongside image data sidecar information. The contents of those sidecars provide information about the image data themselves, how they were acquired, acquisition parameters, etc., whereas these fields relate specifically to *how those data should be processed*. We are currently bastardising the sidecar information that is specific to one image data file with content that relates to other image data files and the desired utilisation of such.\r\n\r\nI would vastly prefer a solution where information relating to how a dataset should be processed is independent of the raw data themselves. The image sidecar JSONs that come out of eg. `dcm2niix` should remain untouched. Instead there should be a separate JSON file that is specifically intended to provide information about the *intended utilisation* of specific images.\r\n\r\nIn the specific context of B0 inhomogeneity field map estimates, one may theoretically have any number of field map estimates, which may come from different sources. Eg. If acquiring reversed phase encoding spin-echoes, and a subject moves a lot during the session, you may want to derive multiple field maps throughout the session, and for each fMRI run use only the most temporally proximal estimate. So that might look like (focusing more on concept than field names):\r\n\r\n```\r\n$ cat processing.json\r\n{\r\n    \"B0FieldMaps\": [\r\n        \"early\": {\r\n            \"Sources\": [\r\n                \"fmap/sub-###_dir-ap_run-1_epi.nii.gz\",\r\n                \"fmap/sub-###_dir-pa_run-1_epi.nii.gz\"\r\n            ],\r\n            \"Sinks\": [\r\n                \"func/sub-###_task-nback_bold.nii.gz\"\r\n                \"func/sub-###_task-olr_bold.nii.gz\"\r\n            ]\r\n        },\r\n        \"late\": {\r\n            \"Sources\": [\r\n                \"fmap/sub-###_dir-ap_run-2_epi.nii.gz\",\r\n                \"fmap/sub-###_dir-ap_run-3_epi.nii.gz\",\r\n                \"fmap/sub-###_dir-pa_run-2_epi.nii.gz\"\r\n                \"fmap/sub-###_dir-pa_run-3_epi.nii.gz\"\r\n            ],\r\n            \"Sinks\": [\r\n                \"func/sub-###_task-rest_bold.nii.gz\"\r\n            ]\r\n        }\r\n    ]\r\n}\r\n```\r\n\r\nTheoretically, this concept of defining a text file that prescribes the intended image processing and inter-dependencies between data may not necessarily be constrained to just B0 inhomogeneity field mapping; hence the `\"B0FieldMaps\"` list at the root level. Curious to know if anyone with a wider breadth of experience can come up with more examples of such.\r\n\r\n-----\r\n\r\nTL;DR: Separate processing instructions from raw data."
  comments:
  - author: Lestropie
    createdAt: '2023-11-14T10:23:37Z'
    body: "I will add to this thread a thought relating to https://github.com/bids-standard/bids-specification/issues/1655.\r\n\r\nUnlike the OP, which focuses on metadata, this comment relates to the data files themselves.\r\n\r\nConsider storage of image data from a dual-echo gradient echo experiment for field map estimation. The issue linked above relates specifically to case 1, which is a phase difference & magnitude image, but here I will talk in reference to [\"Case 2: Two phase maps and two magnitude images\"](https://bids-specification.readthedocs.io/en/v1.8.0/04-modality-specific-files/01-magnetic-resonance-imaging-data.html#case-2-two-phase-maps-and-two-magnitude-images), just because it is the more extreme case. \r\n\r\nHere's what the current specification shows:\r\n\r\n> ```\r\n> sub-<label>/\r\n>     [ses-<label>/]\r\n>         fmap/\r\n>             sub-<label>[_ses-<label>][_acq-<label>][_run-<index>]_magnitude1.json\r\n>             sub-<label>[_ses-<label>][_acq-<label>][_run-<index>]_magnitude1.nii[.gz]\r\n>             sub-<label>[_ses-<label>][_acq-<label>][_run-<index>]_magnitude2.json\r\n>             sub-<label>[_ses-<label>][_acq-<label>][_run-<index>]_magnitude2.nii[.gz]\r\n>             sub-<label>[_ses-<label>][_acq-<label>][_run-<index>]_phase1.json\r\n>             sub-<label>[_ses-<label>][_acq-<label>][_run-<index>]_phase1.nii[.gz]\r\n>             sub-<label>[_ses-<label>][_acq-<label>][_run-<index>]_phase2.json\r\n>             sub-<label>[_ses-<label>][_acq-<label>][_run-<index>]_phase2.nii[.gz]\r\n> ```\r\n\r\nNow allow me to demonstrate an equivalent alternative (simplified for readability):\r\n\r\n> ```\r\n> sub-<label>/\r\n>     [ses-<label>/]\r\n>         fmap/\r\n>             sub-<label>[_ses-<label>]_echo-1_part-mag_T2starw.json\r\n>             sub-<label>[_ses-<label>]_echo-1_part-mag_T2starw.nii[.gz]\r\n>             sub-<label>[_ses-<label>]_echo-1_part-phase_T2starw.json\r\n>             sub-<label>[_ses-<label>]_echo-1_part-phase_T2starw.nii[.gz]\r\n>             sub-<label>[_ses-<label>]_echo-2_part-mag_T2starw.json\r\n>             sub-<label>[_ses-<label>]_echo-2_part-mag_T2starw.nii[.gz]\r\n>             sub-<label>[_ses-<label>]_echo-2_part-phase_T2starw.json\r\n>             sub-<label>[_ses-<label>]_echo-2_part-phase_T2starw.nii[.gz]\r\n> ```\r\n\r\nHere I'm showing the data as still residing in the `fmap/` modality directory, though this could hypothetically be up for debate also.\r\n\r\nThis example shows how information that everywhere else in the specification is encoded as *entities*---echo number and complex component---have instead been forced into *suffices* in this case. As stated in the TLDR in the OP, I believe this has happened because the *intent* of how the data should be *used* has been jammed into locations that otherwise describe what the data *are*, leading to incongruency in the specification. IMO, a BIDS App should be able to read from a file that indicates the intentions for processing, see that a field map source involves the use of complex data from a dual-echo gradient echo acquisition, and know whether it's capable of satisfying that intent.\r\n\r\nIt's a little trickier for field map case 1, where the scanner may have withheld the individual echo phases and instead emitted a phase difference map. And indeed as discussed in https://github.com/bids-standard/bids-specification/issues/1655 the nature of \"the\" magnitude image may be more convoluted. Whether that would be encoded by retaining the `_phasediff` suffix, as `_part-phasediff`, or as `_part-phase` with requisite sidecar metadata to indicate that it's a pre-calculated phase difference rather than absolute phase, would be an open discussion.\r\n\r\nNot necessarily wed to the idea. And it may be me once again driving too far down purist avenue. But food for thought regardless."
  - author: yarikoptic
    createdAt: '2024-05-22T18:47:38Z'
    body: "Re establishing relationships, I freshly filed about one of the oldest use-cases without explicit relationship metadata:\r\n- https://github.com/bids-standard/bids-specification/issues/1825 "
- number: 51
  title: '"IntendedFor" field in electrophysiology sidecars should bear a different name'
  state: CLOSED
  url: https://github.com/bids-standard/bids-2-devel/issues/51
  author: hoechenberger
  assignees: []
  labels: []
  createdAt: '2021-09-30T11:16:25Z'
  updatedAt: '2021-12-18T07:36:48Z'
  closedAt: '2021-12-18T07:36:48Z'
  body: "Hello,\r\n\r\nthe JSON sidecar file of electrophysiological recordings has the optional parameter `IntendedFor`. Its value is \"intended\" (no pun … intended! \U0001F648) to point to structural images, e.g. MRI or CT scans. However, the parameter name is as ambiguous as can be, and IMHO sparks incorrect associations, at least for me: if my electrophysiological recording is \"intended for\" a certain structural scan, then this implies that the \"main\" bit of the data is in the structural scan, not in the electrophysiological data. I don't think this sort of hierarchical implication makes much sense here.\r\n\r\nConsidering that MEG data comes with the optional field `AssociatedEmptyRoom`, I was wondering if `IntendedFor` couldn't be renamed to something like, `AssociatedAnatomy` or `AssociatedAnatomicalScan` (or the plural forms thereof)?"
  comments:
  - author: sappelhoff
    createdAt: '2021-10-01T08:16:20Z'
    body: "Hi Richard, I see where your concerns are coming from. I think this is another case where `IntendedFor` was an [existing field for MRI data](https://bids-specification.readthedocs.io/en/stable/04-modality-specific-files/01-magnetic-resonance-imaging-data.html#using-intendedfor-metadata) that has then been adopted first by MEG, and subsequently by EEG and iEEG (and now more and more modalities) to mean something slightly different.\r\n\r\nThere are most likely names that ore clearly express the intent of this metadata, but I feel like this is a BIDS 2.0 discussion, so unless I get heavy objections, I'll transfer this issue to https://github.com/bids-standard/bids-2-devel in a few days/weeks (also depending on how much traffic this issue will experience here; I'll keep it here if lots of people are interested).\r\n\r\nOne more note: The `IntendedFor` field is part of the `*_coordsystem.json` file, so one could argue that \"electrode/sensor locations are \"intended to be used\" (IntendedFor) together with an anatomical scan. So while the naming situation could be better, it's not a catastrophe IMHO. :)"
  - author: hoechenberger
    createdAt: '2021-10-01T08:59:20Z'
    body: 'Thanks for the explanation, @sappelhoff! I agree with everything you said. '
- number: 50
  title: Enhancing / harmonizing dataset description
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/50
  author: satra
  assignees: []
  labels:
  - 'impact: low'
  createdAt: '2021-08-05T12:36:00Z'
  updatedAt: '2024-04-10T06:57:20Z'
  closedAt: null
  body: "opening this issue to discuss if we can harmonize the dataset_description schema with the dandiset schema, which amongst several things, allows for all kinds of linked resources and better descriptors of contributors. it would still be bids 2.0. \r\n\r\nexample: https://api.dandiarchive.org/api/dandisets/000055/versions/draft/\r\n\r\nthese are all entered through a metadata editor ui, so people who don't know json can fill in things.\r\n\r\nalso see https://api.dandiarchive.org/api/dandisets/000008/versions/draft/ which has instances (see the relatedResource section) of the dataset being extended by data in two other archives.\r\n\r\nthe schema is also not just json compliant (and has a json schema attached) but also jsonld.\r\n\r\nschemas are released here: https://github.com/dandi/schema/tree/master/releases"
  comments:
  - author: sappelhoff
    createdAt: '2021-08-05T19:17:25Z'
    body: '@satra may I move this to https://github.com/bids-standard/bids-2-devel or did you want to have it here for better visibility?'
  - author: satra
    createdAt: '2021-08-05T19:52:28Z'
    body: "@sappelhoff - this would be bids 2 and we can definitely discuss there.  the main reason i posted this was related to @CPernet 's issue on the genetic dataset descriptors.\r\n\r\nis there an active plan / timeline for bids 2?"
  - author: sappelhoff
    createdAt: '2021-08-05T20:33:37Z'
