- number: 91
  title: 'On redundancy as validation: entities vs. metadata'
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/91
  author: Lestropie
  assignees: []
  labels: []
  createdAt: '2025-07-08T04:00:35Z'
  updatedAt: '2025-07-08T04:00:35Z'
  closedAt: null
  body: 'Relates to https://github.com/bids-standard/bids-specification/issues/2155.


    I''ve had something resembling an insight on the topic of removal vs. empowerment of the Inheritance Principle (too many issues to link), having done the deep dive linked above, and thought I''d share in case others find it enlightening.


    In data files, the "subject" and "session" entities have *redundancy*: they are reproduced in both parent directory and file name.

    For manual curation of datasets this provides some degree of *error detection*.

    The relationship between permissible suffixes and modality directory is more complex but serves a similar purpose (#55 would be a more direct recapitulation).

    #63 (and maybe others?) would want to repeat this same kind of redundancy structure.


    Now contrast this against key-value metadata. With attempts to empower the Inheritance Principle, one of the aims is to elucidate the myriad complex relationships between data, by identifying metadata that is shared across many data files and defining it just once; the location of that shared metadata file in terms of parent directory / entities (/ suffix), and the metadata that is common / distinct between files, communicates the nature of the relationship.


    This process is therefore **explicitly removing redundancy**.


    Thus far the argument for removal of the Inheritance Principle has largely been on the basis of avoiding unnecessary complexity. I don''t think I''ve heard from anyone the argument that forcing all metadata for a given data file to be defined explicitly as associated with that one data file provides an intrinsic error detection mechanism.


    If the IP is to be present in any form, it should be explicit in the documentation that involving the IP in manual data curation is dangerous, and if possible, it would be better to instead rely on automated tools to identify and remove metadata redundancy (eg. https://github.com/Lestropie/IP-freely/issues/2).


    These complex relationships between data based on mutual vs. distinct metadata are present in BIDS datasets, regardless of whether the IP is utilised in their storage. It''s only a distinction of whether those relationships are made more prominent in the filesystem structure through exploitation of the IP, or only visible through either *a priori* definition of a set of entities / suffixes to wildcard or a deep interrogation of the full metadata relational graph.


    That insight has nudged me away somewhat from the IP advocacy side...

    '
  comments: []
- number: 90
  title: On "entity-linked file collections"
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/90
  author: Lestropie
  assignees: []
  labels: []
  createdAt: '2025-07-08T03:42:56Z'
  updatedAt: '2025-07-08T03:42:56Z'
  closedAt: null
  body: "Relates to https://github.com/bids-standard/bids-specification/issues/2155.\n\n-----\n\nThe BIDS Specification has the concept of \"entity-linked file collections\". These are files that:\n\n> ... are related to each other based on a repetitive acquisition of sequential data by changing acquisition parameters one (or multiple) at a time or by being inherent components of the same data.\n\nIt is suggested that entities \"`echo`\", \"`flip`\", \"`inv`\", \"`mt`\" and \"`part`\" may be the distinguishing factors between files that are a part of a collection. It is also defined that all files must possess the same suffix to be considered a part of an ELFC.\n\nThe way I have tended to think of an ELFC is that it is a group of files that \"bear a much stronger \nrelationship to one another than to the rest of the dataset\", but for which it is not possible to encode all such data into a single data file given the limitations of the data file format. \n\nI have multiple criticisms of the way in which this concept is currently defined:\n\n-   These kinds of relationships can *intersect*, covering multiple distinct entities or potentially even files with different suffixes. The first example proving the point is complex multi-echo data (see \"`ipmultielfcv2`\" in https://github.com/bids-standard/bids-examples/pull/504): it is difficult to simultaneously claim that the two complex parts of one echo are an ELFC, and that the data across echoes are also an ELFC.\n\n-   It explicitly *excludes* data files with *different suffixes* from being part of an ELFC. Such data can however be highly prevalent, particularly when it comes to scanner-generated derivatives. Consider eg. the various files produced by MP2RAGE, DWI derivatives (https://github.com/bids-standard/bids-examples/pull/452), any kind of relaxometry where the scanner generates parameter estimates. The inability to explicitly establish these as \"collections\" may arise from the stipulation that key-value metadata files must contain a suffix, whereas if this was not the case (https://github.com/bids-standard/bids-2-devel/issues/75) then the mutual information / acquisition source of such data could be more explicit.\n\n    Indeed prior discussion on suffixes RE \"model fit parameters\" vs. \"model-derived parameters\" (too lazy to link) were about establishing a strong ELFC among the former separate from the latter. In reality, MFP are more strongly linked to one another than they are to MDP, but they are not entirely unlinked to MDP. \n\n-   It sets a *false dichotomy* between \"these are an ELFC\" versus \"these are not\". To me, this is a continuous spectrum: different data files may have stronger or weaker relationships with one another, depending on whether they come from the same subject / session / modality / sequence execution.\n\n    Whether or not any particular relationship between such data should be consequential for processing will depend on the particular processing to take place.\n\nThere is an alternative way to conceptualise these kinds of relationships. These relationships, and other comparable relationships between data files, will typically share a lot of metadata, with only subtle differences (eg. having units for the phase part, or different echo times for multi-echo data). The extent of such shared metadata can become highly visible with utilisation of the Inheritance Principle (technically it's present in the dataset without IP exploitation, it's just less obvious). A metadata file that expresses a large volume of mutual metadata between two or more data files therefore encodes these relationships in both *strength* (data files for which almost all of the metadata is shared form a \"strong\" ELFC) and which *entities* the relationship is defined across.\n\n-----\n\nHaving made an attempt to get my stream of consciousness onto screen, the question remains of what might be done for BIDS 2.0. \n\nWhat I'm spitballing here is:\n\n**A metadata file inherited by multiple data files *defines* an Entity-Linked File Collection.**\n\nThis can't be achieved in BIDS 1.x because the Inheritance Principle is under-powered.\n\nWhether that thought actually progresses BIDS 2.0 in any way, regarding the Inheritance Principle or otherwise, I've no idea.\n\nThoughts welcome."
  comments: []
- number: 89
  title: Address "semantic conflict" for GeneratedBy
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/89
  author: yarikoptic
  assignees: []
  labels: []
  createdAt: '2024-10-28T13:58:56Z'
  updatedAt: '2024-11-13T16:52:17Z'
  closedAt: null
  body: "We already have `GeneratedBy` field in BIDS: see e.g. https://bids-specification.readthedocs.io/en/stable/glossary.html#generatedby-metadata .  It is a simplified / lightweight version of a more complete `GeneratedBy` which is being proposed as part of the [BEP028](https://bids.neuroimaging.io/bep028). For an example of it look at \"Alternative representation for file-level provenance JSON-LD\" section.\n\nIn\n- https://github.com/bids-standard/bids-specification/issues/1970#issuecomment-2441624947\n\n@satra (attn @cmaumet) points to \"semantic conflict\" between ad-hoc GeneratedBy in BIDS and formalized in BEP028 PROV record.  Ideally there should be no such conflicts.  I see two potential ways to address\n\n- **rename BIDS's `GeneratedBy`** into e.g. `BIDSGeneratedBy` (suggest better alternatives) and leave it as a simplified \n  - worth explicitly listing/stating what would be missing to seamlessly convert to proper PROV GeneratedBy   and potentially extend schema to include those fields\n- **harmonize `GeneratedBy` to  the PROV version**.\n  - question is either it is not too detailed/cumbersome and simplified version has merit to exist"
  comments:
  - author: satra
    createdAt: '2024-10-28T14:54:13Z'
    body: 'adding an older discussion in relation to this: https://github.com/bids-standard/bids-specification/pull/440#issuecomment-607227668


      in prov there is a property (`wasAttributedTo`) that connects entities to agents. it''s not `generatedBy`, which connects entities to activities. hence the mismatch in semantics. '
  - author: yarikoptic
    createdAt: '2024-11-13T16:52:15Z'
    body: "I think we are \"ok\" in that sense of the semantic: there is \"Description\" field reserved which would/could describe the activity, as I have just done in my adjustment to the \n- https://github.com/bids-standard/bids-specification/issues/1970#issuecomment-2438757531\n\nexample.  And that \"Description\" aligns well in semantic of BIDS having now those  `_desc` entities and `descriptions.tsv` - https://bids-specification.readthedocs.io/en/stable/derivatives/common-data-types.html#descriptionstsv , as description of activity lead to the derivative.  So, altogether `GeneratedBy` ATM links to the composite of the agent + activity in a single flattened record."
