- number: 72
  title: 'Make "datatype" identical to "modality": in other words use `_suffix` of the "data modality" as a `datatype/` folder'
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/72
  author: yarikoptic
  assignees: []
  labels:
  - folder-structure
  createdAt: '2024-04-24T13:06:16Z'
  updatedAt: '2024-04-24T14:52:24Z'
  closedAt: null
  body: "An idea was discussed with @effigies on a recent road trip. ATM it is already somewhat the case for all modalities & data types besides primarily MRI which was born first and acquired all those `anat`, `func`, `dwi`, etc to group files of \"similar\" modalities into one common datatype.  For new modalities which were added later \r\n\r\n<details>\r\n<summary>Here is a full list of suffixes across all files</summary> \r\n\r\n```shell\r\n❯ for r in rules/files/*/*.yaml; do echo $r; yq -r '.[].suffixes' $r | sort | uniq | grep -v -e '\\[' -e ']' -e '^null'; done\r\nrules/files/common/core.yaml\r\nrules/files/common/tables.yaml\r\n  \"scans\"\r\n  \"sessions\"\r\nrules/files/deriv/imaging.yaml\r\n  \"dseg\"\r\n  \"mask\"\r\n  \"probseg\"\r\nrules/files/deriv/preprocessed_data.yaml\r\nrules/files/deriv/tables.yaml\r\n  \"descriptions\"\r\nrules/files/raw/anat.yaml\r\n  \"angio\",\r\n  \"Chimap\",\r\n  \"defacemask\"\r\n  \"FLAIR\",\r\n  \"FLASH\",\r\n  \"inplaneT1\",\r\n  \"inplaneT2\",\r\n  \"IRT1\"\r\n  \"M0map\"\r\n  \"MEGRE\"\r\n  \"MESE\",\r\n  \"MP2RAGE\"\r\n  \"MPM\",\r\n  \"MTR\"\r\n  \"MTRmap\",\r\n  \"MTS\"\r\n  \"MTsat\",\r\n  \"MTVmap\",\r\n  \"MWFmap\",\r\n  \"PD\"\r\n  \"PDmap\",\r\n  \"PDT2\",\r\n  \"PDw\",\r\n  \"R1map\",\r\n  \"R2map\",\r\n  \"R2starmap\",\r\n  \"S0map\",\r\n  \"T1map\",\r\n  \"T1rho\",\r\n  \"T1w\",\r\n  \"T2map\",\r\n  \"T2star\",\r\n  \"T2starmap\",\r\n  \"T2starw\",\r\n  \"T2w\",\r\n  \"UNIT1\",\r\n  \"VFA\"\r\nrules/files/raw/beh.yaml\r\n  \"beh\"\r\nrules/files/raw/channels.yaml\r\n  \"channels\"\r\n  \"coordsystem\"\r\n  \"electrodes\"\r\n  \"optodes\"\r\nrules/files/raw/dwi.yaml\r\n  \"dwi\"\r\n  \"sbref\"\r\nrules/files/raw/eeg.yaml\r\n  \"eeg\"\r\nrules/files/raw/fmap.yaml\r\n  \"epi\",\r\n  \"fieldmap\"\r\n  \"m0scan\"\r\n  \"magnitude\",\r\n  \"magnitude1\",\r\n  \"magnitude2\",\r\n  \"phase1\",\r\n  \"phase2\",\r\n  \"phasediff\",\r\n  \"RB1COR\"\r\n  \"RB1map\"\r\n  \"TB1AFI\",\r\n  \"TB1DAM\"\r\n  \"TB1EPI\"\r\n  \"TB1map\",\r\n  \"TB1RFM\",\r\n  \"TB1SRGE\"\r\n  \"TB1TFL\",\r\nrules/files/raw/func.yaml\r\n  \"bold\",\r\n  \"cbv\",\r\n  \"phase\"\r\n  \"sbref\"\r\nrules/files/raw/ieeg.yaml\r\n  \"ieeg\"\r\nrules/files/raw/meg.yaml\r\n  \"headshape\"\r\n  \"markers\"\r\n  \"meg\"\r\nrules/files/raw/micr.yaml\r\n  \"2PE\",\r\n  \"BF\",\r\n  \"CARS\",\r\n  \"CONF\",\r\n  \"DF\",\r\n  \"DIC\",\r\n  \"FLUO\",\r\n  \"hipCT\"\r\n  \"MPE\",\r\n  \"NLO\",\r\n  \"OCT\",\r\n  \"PC\",\r\n  \"PLI\",\r\n  \"SEM\",\r\n  \"SPIM\",\r\n  \"SR\",\r\n  \"TEM\",\r\n  \"uCT\",\r\nrules/files/raw/motion.yaml\r\n  \"motion\"\r\nrules/files/raw/nirs.yaml\r\n  \"nirs\"\r\nrules/files/raw/perf.yaml\r\n  \"asl\",\r\n  \"aslcontext\"\r\n  \"asllabeling\"\r\n  \"m0scan\"\r\nrules/files/raw/pet.yaml\r\n  \"blood\"\r\n  \"pet\"\r\nrules/files/raw/photo.yaml\r\n  \"photo\"\r\nrules/files/raw/task.yaml\r\n  \"events\"\r\n  \"physio\",\r\n  \"stim\"\r\n```\r\n</details>\r\n\r\nAs you can see from above, `anat`, `fmap` and `micr` are the datatypes which are heavy on different suffixes. Some \"dataypes\" are not really independent datatypes and list suffixes reused in others, e.g. `channels` lists those used in `nirs`, `ieeg` etc. which is declared in their records:\r\n\r\n```yaml\r\nchannels:\r\n  suffixes:\r\n    - channels\r\n  extensions:\r\n    - .json\r\n    - .tsv\r\n  datatypes:\r\n    - eeg\r\n    - ieeg\r\n    - nirs\r\n...\r\n```\r\n\r\nSo the \"raw\" idea was to use \"data modality\" suffix as the folder to group if there is a desire to group files of similar kind, instead of \"datatype\" and thus in part dissolve \"datatype\" as a concept.\r\n\r\nWhere disambiguation is necessary, e.g. separate `_events` corresponding to different parallel acquisitions in a multimodal experiment (although probably could be a single `_events`) -- could be using `_mod` to disambiguate (thus relates to #70).\r\n\r\nI see this as an alternative to\r\n- https://github.com/bids-standard/bids-2-devel/issues/55\r\n\r\naffecting\r\n- https://github.com/bids-standard/bids-2-devel/issues/54  as we would need to provision to have a  `\"suffix\"` not only `\"entity\"`s to be potentially used as a `directory`\r\n\r\nand somewhat of an implementation of or relates to\r\n- https://github.com/bids-standard/bids-2-devel/issues/28\r\n- https://github.com/bids-standard/bids-2-devel/issues/45\r\n\r\nComplexity: figuring out associated other suffixes/modalities, although I guess not anyhow different from current situation."
  comments:
  - author: effigies
    createdAt: '2024-04-24T14:03:45Z'
    body: "In this case it might also be worth formalizing a latent concept in BIDS of \"data file\", \"metadata file\" and \"associated file\". Examples:\r\n\r\n```\r\ndataset/\r\n  sub-01/\r\n    anat/\r\n      sub-01_T1w.nii  # data file\r\n    func/\r\n      sub-01_task-nback_bold.nii  # data file\r\n      sub-01_task-nback_bold.json  # metadata file\r\n    dwi/\r\n      sub-01_dwi.nii  # data file\r\n      sub-01_dwi.bval  # associated file\r\n      sub-01_dwi.bvec  # associated file\r\n    eeg/\r\n      sub-01_coordsystem.json  # associated file\r\n      sub-01_channels.tsv  # associated file\r\n      sub-01_electrodes.tsv  # associated file\r\n      sub-01_task-nback_eeg.fif  # data file\r\n      sub-01_task-nback_eeg.json  # metadata file\r\n  T1w.json  # metadata file\r\n  task-nback_events.tsv  # associated file\r\n  task-nback_events.json  # metadata file\r\n```\r\n\r\nFor data files, suffix and datatype would match. For associated and metadata files, they belong alongside (or above) the data files they are associated to."
  - author: yarikoptic
    createdAt: '2024-04-24T14:52:07Z'
    body: FWIW, I initiated `BIDS 3.0` status column in our [BIDS 2.0](https://github.com/orgs/bids-standard/projects/10/views/1) project where I think we could move some of the issues we decide to not address in BIDS 2.0 to keep it more tightly scoped.  I think this one, along with anything relating to `datatype` and `suffix` might be a good candidate for that.
- number: 71
  title: 'Uniformize .tsv and .tsv.gz: both to have header + both have "Columns" dictionary (!not list) in sidecar .json  '
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/71
  author: yarikoptic
  assignees: []
  labels: []
  createdAt: '2024-04-17T03:41:11Z'
  updatedAt: '2026-05-13T17:12:08Z'
  closedAt: null
  body: "This issue is collating two aspects but I think it is warranted. If would be desired - we could split into two.\n\n## BIDS 1.x situation\n\nATM, `.tsv.gz` are a  not just a compressed `.tsv` like e.g. it happens with `.nii.gz` and `.nii` -- they are *special** as they are not to carry the header as `.tsv`  files do.\n\nThe \"specialty\" extends into side-car .json files\n\n-  for `.tsv`s we carry `.json` file where each entry is a structured record describing that column [BIDS 1: tabular-files](https://bids-specification.readthedocs.io/en/latest/common-principles.html#tabular-files) .\n    - In addition such .json files for some `.tsv` files **also carry metadata fields alongside with columns descriptors**, as in the case with \n       - [`_beh.json`](https://bids-specification.readthedocs.io/en/latest/modality-specific-files/behavioral-experiments.html#sidecar-json-_behjson) - `TaskName`\n       - [`phenotype/*.json` (opaque ATM)](https://bids-specification.readthedocs.io/en/stable/modality-agnostic-files/phenotypic-and-assessment-data.html) -- [MeasurementToolMetadata](https://bids-specification.readthedocs.io/en/stable/glossary.html#objects.metadata.MeasurementToolMetadata) and [Derivative](https://bids-specification.readthedocs.io/en/stable/glossary.html#objects.metadata.Derivative)\n       - ... more ... ?\n       thus possibly leading to collisions ([snake_case](https://en.wikipedia.org/wiki/Snake_case) is just a recommendation for column names, and overall making schema for such .json files a concoction of two aspects). \n    - `_motion.tsv` are an **exclusion** to the rule (see more [below](https://github.com/bids-standard/bids-2-devel/issues/71#issuecomment-2386099185)) - they are headless, `_channels.{tsv,json}` describe columns, and then `_motion.json` contains extra metadata.\n- for `.tsv.gz` we carry `.json` file with a dedicated `Columns` field with a list of header fields **and** in addition again optionally descriptors per each column (same possible collision) [BIDS 1: compressed-tabular-files](https://bids-specification.readthedocs.io/en/latest/common-principles.html#compressed-tabular-files) \n\nIf I got it right (@effigies can correct) the header was excluded from `.tsv.gz` as \"not readily readable\". May be some folks remember also further details?  IMHO argument is weak since it is just a matter of adequate abstraction of \"file opener\" like e.g. is done in Python.  But even if we place that aspect aside I think we would benefit from a more harmonious approach, which only might require 1 extra check for validator:\n\n## BIDS 2 proposal\n\n1. both the `.tsv` and `.tsv.gz` should carry a header. `.gz` would only signal compression.\n2. both `.tsv.gz` and `.tsv` should be supported interchangeably across uses\n    - it would be for a user to choose most appropriate form based on use-case  \n    - it will be RECOMMENDED to use .tsv form for the cases where immediate user readability is desired (`subjects.tsv`, `sessions.tsv` etc) unless prohibitive in size (e.g. `subjects.tsv` for 10000 subjects with 100 columns or smth like that)\n4. `.json` for either case of `.tsv` or `.tsv.gz` MAY describe columns within `Columns` field of the `.json` which would be a dict containing records conforming current set of fields we reserve for [.tsv files .json's](https://bids-specification.readthedocs.io/en/latest/common-principles.html#tabular-files) but also adding 1 OPTIONAL field (but may be RECOMMENDED for .tsv.gz) - `Index` which would provide ordering information. `bids-validator` could easily ensure corresponding to the order in `.tsv` or `.tsv.gz`.\n   - I didn't look into JSON specification/libraries either we can also simply \"enforce\" that order should correspond to `Index`, ie. if dicts are ordered like now in Python. \n\n**Cons**\n\n- \"Breaking change\" as tools would need to adjust from `Columns` field. But it might actually be even simplification in some cases (e.g. those `_beh.json`) where now they should \"subselect\" what to choose for descriptors and what for metadata.\n- Tools which can't read header directly from `.tsv.gz` through file abstraction would need to \"build\" index based on `Index` field .  But it is really not a rocket science\n\n**Pros**\n\n- uniform handling of `.tsv` and `.tsv.gz` so if someone obtains a long `.tsv` and decides to compress it -- it would be just a matter of exactly that -- compression, without changing content (removing header). Would allow for simpler/generic code/handling.\n- making it possible for .json to be sidecar for metadata and description of `Columns` without any ambiguity (jsonschema or linkml model would be much easier to construct) and possibility of collision."
  comments:
  - author: arnodelorme
    createdAt: '2024-04-17T19:24:12Z'
    body: I would vote for uniformity between .tsv and .tsv.gz
  - author: effigies
    createdAt: '2024-04-17T19:49:14Z'
    body: "`.tsv.gz` was a pragmatically useful choice for working with existing non-BIDS tools (e.g., [FSL's PNM](https://fsl.fmrib.ox.ac.uk/fsl/fslwiki/PNM/UserGuide)) that expected separately-entered column identification and accepted compressed data. One possibility to compromise here would be something like:\r\n\r\n| Extension | Headers | Compression | Examples |\r\n|--|--|--|--|\r\n| `.tsv` | First line | None | `events.tsv` |\r\n| `.tsv.gz` | First line | `gzip` | New |\r\n| `.bare.tsv` | Sidecar | None | `motion.tsv` -> `motion.bare.tsv.gz` |\r\n| `.bare.tsv.gz` | Sidecar | `gzip` | `physio.tsv.gz` -> `physio.bare.tsv.gz` |\r\n| `.parquet` | In-file | Optional | New |\r\n\r\nWe could state that any of these is acceptable (perhaps with a preference in some use cases), assume people will use one that matches the typical use case for their dataset, and make a simple tool available to convert among them."
  - author: tsalo
    createdAt: '2024-08-08T17:12:28Z'
    body: "Just want to note that `.bare.tsv` and `.bare.tsv.gz` would conflict with [BEP017](https://docs.google.com/document/d/1ugBdUF6dhElXdj3u9vw0iWjE6f_Bibsro3ah7sRV0GA/edit)'s `.sparse.tsv` and `.dense.tsv`. I mean, I guess we could have `.bare.dense.tsv`... but \U0001F62C\r\n\r\nEDIT: Based on maintainers discussion with Peer- maybe just assume `.dense.tsv` means \"bare\"."
  - author: yarikoptic
    createdAt: '2024-08-09T20:53:12Z'
    body: "FWIW, although being .tsv does not mandate having a header generally (outside of the BIDS), I feel there was somewhat of overfitting to the tool that .tsv.gz was made to be the one without header while .tsv had to have a header.  I second @effigies suggestion above, besides I think addition of `.parquet` should be discussed separately since not directly related to the \"flavors of .tsv\" discussed here.\r\n\r\nre `.sparse` -- commented on that PR.  IMHO that BEP is already not entirely kosher with .tsv being used without header (if I got it right).  Also it seems that it is only .bare which could be .sparse, so may be it is actually quite consistent and nice to extend @effigies table to\r\n\r\n| Extension | Headers | Compression | Examples |\r\n|--|--|--|--|\r\n| `.tsv` | First line | None | `events.tsv` |\r\n| `.tsv.gz` | First line | `gzip` | New |\r\n| `.bare.tsv` | Sidecar | None | `motion.tsv` -> `motion.bare.tsv.gz` |\r\n| `.bare.tsv.gz` | Sidecar | `gzip` | `physio.tsv.gz` -> `physio.bare.tsv.gz` |\r\n| `.sparse.tsv` | Sidecar | None | New (for BEP017: `_relmat.sparse.tsv`) |\r\n| `.sparse.tsv.gz` | Sidecar | `gzip` | New (for BEP017: `_relmat.sparse.tsv.gz`) |\r\n"
  - author: yarikoptic
    createdAt: '2024-10-01T14:17:05Z'
    body: "During BEP044 call I was made aware that situation is more \"intricate\" in case of [motion](https://bids-specification.readthedocs.io/en/stable/modality-specific-files/motion.html) files (an example is [ds004460](http://github.com/OpenNeuroDatasets/ds004460)). There \r\n- `_motion.tsv` is headersless\r\n- columns are described **not in** `_motion.json` but rather in `_channels.tsv` (and `_channels.json` to describe the `_channels.tsv`)\r\n- `_motion.json` contains common metadata for `_motion.tsv` file."
