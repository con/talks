  - author: satra
    createdAt: '2024-02-13T16:44:42Z'
    body: "that's good. although, i'm not quite sure that use-case is too distant. practically speaking, we run into that issue with ukbiobank and any of the large datasets where we need to process a few subjects with bids-apps. we have had to create sub-bids to satisfy bids and hence tools like fmriprep. one could say that bids should not care about that. however, a self-contained single subject/session subset would be a relevant use-case in bids i believe.\r\n\r\nps. the challenge has been that bids has the different levels of consolidation of information: grouped (participants, sessions, etc) inheritance (via jsons), and single (the files). this necessitates a connected structure that relies on those pieces of information. the advantage of bids is efficiency (for the grouped files; although longitudinal data is inefficient) and deduplication (for the inheritance), and readability (single path+filename).\r\n\r\nthese different use cases may be good to consider in bids 2."
  - author: effigies
    createdAt: '2024-02-13T16:46:23Z'
    body: "Will also add Templateflow: https://www.templateflow.org/usage/archive/#acceptable-data-types\r\n\r\n* https://brain-development.org/brain-atlases/atlases-from-the-dhcp-project/cortical-surface-template/ describes itself as \"using BIDS conventions\", and proceeds to define custom entities and metadata."
  - author: niksirbi
    createdAt: '2024-02-13T17:31:31Z'
    body: Our [NeuroBlueprint specification](https://neuroblueprint.neuroinformatics.dev/specification.html) is definitely in the BIDS-inspired category.  Together with @JoeZiminski we are working on putting together a list of divergences from BIDS and the rationale behind them.
  - author: yarikoptic
    createdAt: '2024-02-17T00:04:04Z'
    body: "> however, a self-contained single subject/session subset would be a relevant use-case in bids i believe.\r\n> ...\r\n> these different use cases may be good to consider in bids 2.\r\n\r\n@satra see\r\n\r\n- https://github.com/bids-standard/bids-2-devel/issues/59 which was born out of the #60 I have mentioned, and\r\n- https://github.com/bids-standard/bids-2-devel/issues/54\r\n\r\nMay be we should add/promote upvoting via :+1: on the issues, so \"go wild\" ;)"
  - author: bleonar5
    createdAt: '2024-02-26T16:23:22Z'
    body: "I can share some context on Psych-DS if it's helpful, but I'm unsure how to comment on DANDI. Our data standard is pretty explicitly modeled on BIDS and our validator tool is a essentially a very pared-down fork of BIDS' recent deno implementation. \r\n\r\nDefinitely our reasoning for diverging instead of using BIDS directly or creating some sort of module within it has to do with complexity. A big part of the ethos of our project is simplicity, since we're trying to bring researchers with a lack of experience with explicit data standards into the fold of producing FAIR datasets. We designed our standard to be the minimal set of conventions for producing consistently-structured, machine-readable datasets with linked metadata, and we avoided the impulse to include additional advanced/options conventions or conventions governing the internal content of datafiles, because we figured that even the presence of this additional material in our documentation could scare off our target audience. \r\n\r\nOn a technical level, I noticed that the BIDS deno-based validator only applied rules to files that actually appeared within datasets, with no functionality to produce errors/issues in cases where certain elements were absent, and since this notion of presence/absence was important in our schema, that was one initial additional impetus for diverging with our own tool. Additionally, with Psych-DS 1.0 at least, we only wanted to validate simple tabular CSV data, and a lot of the structure of the BIDS validator had to do with applying different rules and conventions depending on datatype.\r\n\r\nWe followed BIDS' lead when it came to our usage of linkML for creating a structured model of our schema, and I definitely used BIDS' examples explicitly when developing our stack of tools, which was extremely helpful.\r\n\r\nThese are just a few random thoughts and pieces of context. Feel free to ask me anything specific and I can answer in detail. Also, I should mention that @mekline is on maternity leave until sometime this June/July and @ianchandlercampbell is our interim director for the project."
  - author: yarikoptic
    createdAt: '2024-02-26T20:17:35Z'
    body: "That is very valuable insights @bleonar5 , thank for sharing!\r\nGiven that you seems to use BIDS schema, my short overarching summary would be to: **Re-use BIDS schema formalization to derive a customized subset of the BIDS standard to simplify domain specific use and adoption**. If I am totally off -- please correct me ;)\r\n\r\n> I noticed that the BIDS deno-based validator only applied rules to files that actually appeared within datasets, with no functionality to produce errors/issues in cases where certain elements were absent, and since this notion of presence/absence was important in our schema, that was one initial additional impetus for diverging with our own tool.\r\n\r\nCould you elaborate here (or even as a dedicated issue against bids-validator, which is if not pertinent - could be closed) more on this since I am not fully grasping, since as to me bids-validator must error whenever any REQUIRED component (metadata or file) is missing.\r\n\r\n> Additionally, with Psych-DS 1.0 at least, we only wanted to validate simple tabular CSV data, and a lot of the structure of the BIDS validator had to do with applying different rules and conventions depending on datatype.\r\n\r\nalso sounds very intriguing and like something what could be generally applicable to BIDS. Could you elaborate more?\r\n\r\n> We followed BIDS' lead when it came to our usage of linkML for creating a structured model of our schema\r\n\r\ndo you have a link to linkML models handy?"
  - author: TheChymera
    createdAt: '2024-02-27T13:30:24Z'
    body: "@bleonar5 some of the links on the PsychDS README are broken, could you share a `tree` view of a dataset?\r\n\r\n> reasoning for diverging [...] has to do with complexity. A big part of the ethos of our project is simplicity,\r\n\r\nI think that's also part of the ethos of BIDS, perhaps we could look into simplifying BIDS for 2.* as well. What are some of the key complexity concerns which made BIDS 1.* less attractive?"
  - author: bleonar5
    createdAt: '2024-03-01T20:19:43Z'
    body: "@yarikoptic My first response was a bit cursory and based on my memory of our initial rationales for diverging, I'll try to dig in a bit deeper here. I think your summary of our rationale was correct: we wanted to provide similar structures and standards to those that BIDS provides, for researchers that deal with behavioral data rather than complex physiological data. @satra informed us about the BIDS' team's development of a structured schema model in linkML, and this satisfied one of our core desiderata for the project, which was to have an externalized, structured schema that we could reference across validator tools in multiple frameworks (node, R, python). So, we used the combination of pruned-down versions of BIDS' in-development Deno validator and linkML schema as (very helpful) jumping off points for our own development, with proper citations and acknowledgements, of course. \r\n\r\n@mekline has had a much longer history with the development of Psych-DS as an independent entity, and could possibly speak to our rationales for divergence much better, and she may be able to share more detailed thoughts on her return. One crucial element that I'm remembering now is a technical difference between the structure of most physio data and the behavioral data that we're interested in. Physiological data is so rich and often tied to multiple measurements over time, that it seems to be a standard assumption (and I think this is reflected in the BIDS spec) that datafiles will be organized around individual subjects/sessions. In a lot of behavioral datasets, this is not the case, as the whole set of responses for a given subject may be representable in a single row, and one datafile may represent the data gathered from an entire experiment. BIDS is complex and my knowledge of/experience with it only extends to the research I did prior to beginning development of the Psych-DS validator, but it seemed to us that following some kind of subject-oriented system of data organization would be necessary for compliance with BIDS, and this was a major rationale for divergence. (@TheChymera, I think this paragraph is the most relevant answer to your second question)\r\n\r\nAs for the matter of presence/absence of files/directories that I mentioned previously, I think this is actually just an issue with the [deno-based validator](https://github.com/bids-standard/bids-validator/tree/master/bids-validator/src) rather than the older, [public-facing validator](https://bids-standard.github.io/bids-validator/). And the deno validator is still in development, so it may just be that I mistook a bug/unfinished component for an actual aspect of the BIDS spec. Basically, if you provide an otherwise-valid BIDS dataset that is missing an element (such as the dataset_description.json file) to the web validator, it produces an error as expected (DATASET_DESCRIPTION_JSON_MISSING). If you do the same with the deno validator, it outputs a VALID_DATASET result and does not report the absence of the required file. This is because the validator crawls the filetree of the dataset, finds whatever files/directories are present, and runs a series of checks on them based on the rules in the linkML schema. But if a core file is missing, the crawler never encounters the file in question, so the relevant rules that would assert the necessity of the file's presence are never applied. I could certainly create an issue for this if it's helpful, but I was unsure if it's appropriate given the fact that the validator has not been publicly released, and this feature may be scheduled for later in the development plan.\r\n\r\nHere is a [link](https://github.com/psych-ds/psych-DS/tree/develop/schema_model/versions/1.1.0) to our linkML schema model as it currently stands (in development). At the moment it is not really intended to be used with the standard linkML validator library, and is more being used as just a structured, machine-readable implementation of our schema."
  - author: bleonar5
    createdAt: '2024-03-01T20:23:10Z'
    body: "@TheChymera Here is a minimal Psych-DS file structure, from the [Psych-DS spec document](https://docs.google.com/document/d/1u8o5jnWk0Iqp_J06PTu5NjBfVsdoPbBhstht6W0fFp0/edit), whose contents we are in the process of integrating into a more holistic readthedocs site for the project/schema/validator\r\n\r\n<img width=\"351\" alt=\"Screenshot 2024-03-01 at 3 23 35 PM\" src=\"https://github.com/bids-standard/bids-2-devel/assets/8931559/ee23a334-b53d-4dfd-be11-90b26c7133cd\">\r\n\r\nThank you for the heads up about the dead links, I will do a once-over on our read me and take care of those ASAP"
  - author: yarikoptic
    createdAt: '2024-03-01T20:43:44Z'
    body: "Thank you @bleonar5 !!\r\n\r\n> In a lot of behavioral datasets, this is not the case, as the whole set of responses for a given subject may be representable in a single row, and one datafile may represent the data gathered from an entire experiment.\r\n\r\nsimilar aspect relevant to phenotype data, per our discussion with @surchs. If I would recall correctly we arrived (or I forced ? ;) ) to the conclusion that there could be a \"nominal data representation\": per sub/ses representation (even if a single row) + derived composition somewhere else -- after all the notion of the \"derivative\" dataset is steadily becoming less of an ugly duck in BIDS world.  But also it might relate to the discussion of \r\n- #36 \r\nwhere similarly a decision could be made to aggregate metadata at the higher levels since it is the most useful and sensible representation.  And needless to say that it does relate to\r\n- #54 \r\nas if there is no `sub-` folder -- data per subject should reside somewhere/somehow ;)\r\n\r\nSorry if this feels \"too jumpy\", but I think there is a common pattern emerging here across different aspects ;)\r\n\r\n> I could certainly create an issue for this if it's helpful\r\n\r\nplease do, or let me know if I should do -- since it does sound like a true bug since validator must error out if any of the `required` files in [files/common/core.yaml](https://github.com/bids-standard/bids-specification/blob/master/src/schema/rules/files/common/core.yaml) is missing. "
  - author: niksirbi
    createdAt: '2024-06-21T15:42:15Z'
    body: "Hey @yarikoptic \r\n\r\nSorry for the delay in replying, we (me and @JoeZiminski) were aiming to write a full post on this, intended for our [website](https://neuroblueprint.neuroinformatics.dev/) but things have been busier than expected. Please find below a summary of the logic behind NeuroBlueprint, where it diverges with BIDS, in what ways BIDS is not fulfilling our requirements, and how this could remedied with with BIDS 2.0.\r\n\r\nFor context, we recently wrote two blog posts motivating [NeuroBluerint](https://neuroinformatics.dev/blog/neuroblueprint.html) and the related data-management tool [datashuttle](https://neuroinformatics.dev/blog/datashuttle.html). \r\n\r\n### NeuroBlueprint motivation\r\nThe main motivation for NeuroBlueprint is to provide a version of folder standardisation with a very low barrier for entry, mostly focused on the data acquisition stage of a project. We found BIDS, while necessarily detailed with the aim of full standardisation and reproducibility, can be too detailed for researchers very busy in the early stages of a project. For our purposes, we at this stage just want to know where researchers' data are in a predictable way, for ingestion into analysis pipelines.\r\n\r\nA more minor consideration was that BIDS is somewhat biased towards techniques used in human subjects (MRI, EEG, MEG), while NeuroBlueprint is more geared towards systems neuroscience (animal subjects), similar to NWB. While BIDS is slowly moving towards accommodating such data (most notably with BEP032 for animal ephys), the \"human legacy\" still informs much of its design and terminology.\r\n\r\nThe founding idea of NeuroBlueprint is that **some standardisation is preferable to no standardisation**. Our initial goal was to present systems neuroscientists with a small subset of BIDS requirements (those that are easy to adhere to at the data acquisition stage), which would make it easier for researchers to transition to \"full BIDS\" (or NWB) later, at the stage of paper publication and data sharing. However, while iterating on the NeuroBlueprint spec we realised that we had to break with BIDS in some areas, even within the subset we mandate.\r\n\r\n### Divergences from BIDS\r\n\r\nUnlike BIDS, we currently make no requirements on metadata, file names, file format, etc. Essentially the only things we do require at present are a BIDS-style [folder hierarchy and naming](https://neuroblueprint.neuroinformatics.dev/specification.html#project-folder-structure), specifically:\r\n* We adopt the BIDS distinction between `rawdata` vs `derivatives` at the top level (though there's no `sourcedata`).\r\n* We mandate the hierarchical organisation of `rawdata` into `subject > session > datatype` sub-folders (though unlike BIDS,  the `session` level can't be skipped).\r\n* The naming of subject- and session-level folders follows the BIDS convention of key-value pairs separated by underscores, but unlike BIDS we don't define a strict set of entities for users to choose from. Instead, me only mandate that the first entity is `sub-<index>` for subject- and `ses-<index>` for session-level folders (to at least ensure that these folders can be uniquely identified).\r\n* The biggest break with BIDS comes at the level of data types and modalities (see section below).\r\n* We suggest, but do not require, that [files are named](https://neuroblueprint.neuroinformatics.dev/specification.html#file-naming-conventions) following BIDS-like key-value pair conventions, but that's not a strict requirement at present. Similarly, we recommend, but do not require, that [tabular metadata](https://neuroblueprint.neuroinformatics.dev/specification.html#metadata-conventions) are saved in BIDS-style TSV files.\r\n\r\n**Datatypes and modalities**\r\nWe have ended up 'actively' diverging from BIDS in this area. For researchers creating file / folder names manually, the BIDS 'modality' concept, in which different modalities are distinguished by suffix, was not very convenient. For example, if collecting two types of microscopy data stored in a `micr` folder, the researcher would need to make sure to never forget to add the correct suffix to a filename, lest they get their data types confused. This convention seems like an optimisation better suited for the data-publication stage of a project (which we aim to write converters for in future) whereas in the acquisition stage it is easier to separate things into distinct folders.\r\n\r\nMoreover, the existing BIDS datatypes do not map well onto the methods typically used in systems neuroscience labs. For example, BIDS reserves `anat` for structural MRI data and `func` for fMRI, neither of which are frequently acquired in our field. Another example is that BIDS employs `micr` for microscopy data, but the spec seems to be designed primarily for structural microscopy and doesn't adequately cover *in vivo* functional imaging techniques ('optical physiology', e.g. calcium imaging), which are abundant in animal neuroscience. Though we could possibly \"coerce\" such data to fit within `micr`, we are not sure that's necessarily desirable, as structural and functional imaging data are likely to be pre-processed and analysed in completely different ways (analogous to MRI's `anat` and `func`).\r\n\r\nAs such, we have taken liberties with datatype names, and at present we only mandate 4 datatypes (`behav`, `ephys`, `funcimg`, `anat`). We use the `anat` datatype for any kind of anatomical (structural) imaging, and `funcimg` for any kind of functional imaging. We are planning to extend these, but will almost certainly require everything be separated into different `datatype`-level folders instead of relying on modality-specific suffixes. There's an ongoing discussion on this topic [here](https://github.com/neuroinformatics-unit/NeuroBlueprint/issues/57) and we'd love to hear your thoughts.\r\n\r\nAlthough this seems like a major divergence, we thought it would be relatively easy to reconcile once a project is complete, with appropriate converters. It would essentially involve moving/renaming datatypes and adding appropriate modality suffixes as needed.\r\n\r\n### Wish list for BIDS 2.0\r\nAs is apparent from above, what we'd love to see in BIDS 2.0 is a re-thinking of the datatype/modality concept, or at least some room for flexibility in defining/naming datatypes.\r\n\r\nThe **absolute dream** would be to have BIDS 2.0 consist of a set of specific and atomic rules, the same way that linters like `ruff` do. In this way, it would be very easy for others like us to adopt a specific subset of rules, by specifying which to include/exclude etc. We could even have \"rulesets\", i.e. pre-specified sets of rules that are useful in specific scenarios (e.g. \"data acquisition\", \"uploading to OpenNeuro/DANDI\", etc.). I'm aware that this is too much to ask for, technically challenging, and likely out-of-scope for BIDS, but one can dream.\r\n\r\n### Conclusion\r\nWe absolutely love what BIDS has done for the neuroimaging community and we are on board with extending its benefits to other research communities. NeuroBlueprint is still young and many of its points are still amenable to change, as long as we stick to our main design consideration, which is to keep the spec minimal and easy to adopt.  Let's keep the conversation going!"
  - author: tgbugs
    createdAt: '2024-09-12T20:57:35Z'
    body: "As a placeholder for deeper discussion here are some links that provide a partial overview of SDS. I have a poster on this an Neuroinformatics so can update with that here as well when it is ready.\r\n\r\n[How SDS models ontological participants](https://github.com/SciCrunch/sparc-curation/blob/master/docs/participants.org) that was inspired by the discussion in https://github.com/bids-standard/bids-specification/issues/779.\r\n\r\n[Changelog for the latest version of SDS](https://github.com/SciCrunch/sparc-curation/blob/master/docs/sds-3-changelog.org) and the actual [release](https://github.com/SciCrunch/sparc-curation/releases/tag/dataset-template-3.0.0).\r\n\r\nThe most important change in this context would be our move to accommodate data management processes where most or all file metadata is stored in a manifest file of some kind, that might look like mapping file names, object ids, checksums, s3 object paths, etc. to metadata records in a separate system in addition to the traditional folder naming conventions. I think this touches on \r\n\r\nThe manifest changes also relate to how BIDS-like standards can enforce data modality file type requirements (e.g. that mri should have nifti files, ephys should have nwb, microscopy ome-tiff, etc. while allowing png files elsewhere in the dataset) without necessarily having to have folders for each modality which can result in a nxm-fold increase in directories for n subjects and m modalities.\r\n\r\nWith retard to interoperability between standards, there is [discussion](https://github.com/SciCrunch/sparc-curation/blob/master/docs/sds-3-changelog.org#file-system-structure-changes) in the changelog about one way to make file system conventions (data set standards) nestable using a file called `.dss`. For example if you have a data collected across modalities that already have standards such as MRI with BIDS, ephys with DANDI, peripheral physiology with SDS, etc. it is possible to combine them all without conflict in a single hierarchy."
- number: 61
  title: Eliminate aslcontext file in favor of metadata field
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/61
  author: tsalo
  assignees: []
  labels:
  - metadata
  - suffixes
  - ASL
  createdAt: '2024-01-31T17:13:33Z'
  updatedAt: '2024-02-01T15:03:35Z'
  closedAt: null
  body: The aslcontext TSV file may only contain one column (`volume_type`), with one row for each volume in the associated ASL file(s). There are other volume-wise fields in the metadata already (e.g., `PostLabelingDelay`, in some circumstances), so we could just create a `VolumeType` metadata instead of having a separate file for this information. It would also make it easier for tools to keep track of one associated file (the JSON), rather than two (the JSON and the aslcontext file).
  comments:
  - author: yarikoptic
    createdAt: '2024-02-01T14:44:14Z'
    body: "Devil's advocate here:\r\n\r\nAs .tsvs in BIDS have flexible schema -- only few mandatory, some suggested and then anything someone wants for the fields -- I wondered if may be the idea was to be able to add such auxiliary columns?  insofar though I have not found such example among openneuro datasets.\r\n\r\nanother aspect is that it seems to be a label per volume in .nii.gz. Placing it into .json would work but make it a little wild for a long nii.gz.  E.g. `./ds003151/sub-174/ses-hormonepresent/perf/sub-174_ses-hormonepresent_aslcontext.tsv` has 89 rows, `./ds000240/sub-19/perf/sub-19_aslcontext.tsv` 110. And altogether we tend to keep temporal information like that in sidecar .tsv's."
  - author: tsalo
    createdAt: '2024-02-01T15:03:34Z'
    body: "The other volume-wise information (e.g., RepetitionTimePreparation) can also be a single value that applies to the whole file, so it makes sense that it's in the JSON.\r\n\r\n>And altogether we tend to keep temporal information like that in sidecar .tsv's.\r\n\r\nThat's true, but the aslcontext is so limited (unlike, e.g., events files) that I don't think keeping that info in its own file buys us much.\r\nMore than anything, though, I personally would rather reduce the number of associated files that software needs to track."
- number: 60
  title: 'Use-case: AIND schema'
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/60
  author: yarikoptic
  assignees: []
  labels: []
  createdAt: '2023-10-25T15:53:37Z'
  updatedAt: '2023-10-25T15:53:37Z'
  closedAt: null
  body: "Distilled in discussion with @dyf. They \r\n\r\n- defined clear schema for various aspects of the experiment in pydantic models: https://github.com/AllenNeuralDynamics/aind-data-schema which is used across all experiments done at https://github.com/AllenNeuralDynamics/ \r\n- data is first grouped not at a level of a study, but at a level of the recording session\r\n  - in case of multimodal sessions separation is done also at that level across datatypes (or modalities) \r\n- it is done so to facilitate QA/data analytics -- makes it easier to share, not to wait for entire dataset to be collected, etc and potentially include in different studies which might be interested in different subportions of the dataset\r\n- heavily relies and benefits on hierarchical metadata structure within .json files\r\n\r\nThe ideas we touched upon:\r\n- AIND might want to adopt BIDS principle in naming to use `<entity>-<value>[_<entity>-<value>][_<datatype>]` instead of \"hidden semantic\" for naming folders and files, as the initial step\r\n\r\n- flexible hierarchy (#54) to allow e.g. for present/absent modality subfolder, or session subfolder\r\n-  https://github.com/bids-standard/bids-2-devel/issues/59 \r\n  - relates to inheritance principle: common metadata could still be inherited from the top folder, or top folder could provide a \"unique summary\" over metadata like we do in heudiconv (example: http://datasets.datalad.org/?dir=/dbic/QA)\r\n- extended/alternative metadata (schema) support: (TODO: file/link to an issue) to allow in .json (sidecar) file a more extended schema-driven record with clear association on what that schema is (may be we would all use linkml.io at some point). There it could be hierarchical \r\n\r\nTODOs:\r\n- [ ] get/include pointers to examples of the specific data/metadata (@dyf)"
  comments: []
- number: 59
  title: Allow composition of a BIDS dataset (dataset level) from smaller (subj or subj/ses) level
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/59
  author: yarikoptic
  assignees: []
  labels:
  - modularity
  createdAt: '2023-10-25T15:43:05Z'
  updatedAt: '2024-09-20T18:09:30Z'
  closedAt: null
  body: "**Main goal/use-case**: What if we allowed e.g. `sub-X[/ses-Y]` to be a BIDS dataset on its own!\r\n\r\nUse cases\r\n\r\n- https://github.com/AllenNeuralDynamics (TODO: ref the issue after failed)\r\n- BIDS apps operation/parallelization across subj/sess -- now requires (eg. for fmriprep) some obnoxious (IMHO) \"filtering\" way or some tech-specific (git/datalad) way to create \"slim down\" version of dataset.\r\n  - see references below for more similar use-cases\r\n\r\nAnalogous developments / already present in BIDS conventions which are generally in line with this:\r\n\r\n- https://bids.neuroimaging.io/bep035 (MEGA - Modular extensions for individual participant data mega-analyses) is pretty much a composition of otherwise separate BIDS datasets into higher level at `study-/` entity.\r\n- `derivatives/{tool}-{version}` is also composition of BIDS datasets\r\n- `sourcedata/raw` (and others) could also contain BIDS datasets\r\n- https://github.com/bids-standard/bids-specification/pull/1861\r\n\r\nComplications/approaches to consider:\r\n- \"inheritance principle\": (meta)data on above levels might be missing at lower. Could be verified using validator\r\n  - pretty much relates to e.g. `participants.tsv` (and any other metadata) now needing to be replicated (only relevant subject) from higher levels to lower ones.\r\n  - Need to figure out referencing/reuse of external resources which are typically located on top and reused across subjects (such as `stimuli/`). Might want to be considered while describing nested subdataset layout in the scope of #54 \r\n    - may be allow for \"explicitly\" referencing such resources from a common location (top level BIDS dataset)... todo: review current approach to [bids-uri](https://bids-specification.readthedocs.io/en/stable/common-principles.html#resolution-of-bids-uris) \r\n    - dedicated tooling could help to fill in/populate/sync desired references in subdatasets from the top level one.\r\n  - #65  could help to reduce confusion by demanding duplicated metadata being consistent\r\n\r\nOther developments/use-cases/approaches this proposal aligns with:\r\n\r\n- aligns well with #54 which then would allow for the \"flat\" (no folders) within that dataset -- its `dataset_description.json` would just say that.\r\n\r\n- aligns with the work of @neuromechanist @dorahermes @VisLab on extending formalization of stimuli directory. If that directory starts to follow BIDS principle/organization itself, e.g. following suggested by me https://github.com/bids-standard/bids-specification/issues/751 (stimuli BEP) but without hierarchy (#TODO issue on alternative hierarchies) then we make it all consistent. \r\n\r\n- https://github.com/bids-standard/bids-specification/issues/1371#issuecomment-2051859738\r\n\r\n- similarish approach is taken by a2cps (attn @patrick....)  on converting each subj session into independent bids dataset for processing and then \"Collating\" them together for the release.\r\n\r\n- brainlife.io composes a single \"subject/session\" BIDS dataset from its internal data types to provide for processing for a BIDS-App which expects a bids-dataset. see [bl2bids script](https://github.com/brainlife/abcd-spec/blob/dc05aeb587c1c13ea271a88f82fa31cc693c79bd/hooks/bl2bids.py#L4) . To a degree it also suggests that ability to get a single subject/session is great for scaleable compute.\r\n\r\n<details>\r\n<summary>some notes on edits </summary> \r\n\r\nedit: previously had \"study\" in the title but IMHO it is misleading, replaced with \"dataset level\"\r\n</details>"
  comments: []
- number: 58
  title: Remove the suffix and exclusively use entities in the filename.
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/58
  author: robertoostenveld
  assignees: []
  labels:
  - 'impact: medium'
  - common-principles
  - entities
  - suffixes
  createdAt: '2023-09-08T10:02:21Z'
  updatedAt: '2024-12-19T08:31:51Z'
  closedAt: null
  body: "The discussion https://github.com/bids-standard/bids-specification/issues/1602 shows that there is no universal agreement on when some information is to be coded as a suffix (at the end of the filename just prior to the extension, e.g., `_bold`) or as an entity (like `<key>-<value>`).   \r\n\r\nI propose to remove that source of conflict in BIDS 2 by removing the suffix altogether. To me the suffix serves the same purpose as the value in an entity, except that the name has been left out. I.e., I propose that `_bold.nii.gz` were to become `_suffix-bold.nii.gz`. Instead of `suffix`, another name (or names) could be given to these entities. \r\n\r\nThe consequence would be that the whole filename up to the first period `.` (which indicates the start of the file extension, see *) can be parsed on the underscore to separate entities, and each entity can be parsed on the dash to split its name and value.\r\n\r\n*) The file extension (e.g., `.tsv`, `.h5`, `.nii.gz`) would remain as it is and provide information about how the file is technically to be parsed as an ascii and/or binary stream.\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
  comments:
  - author: oesteban
    createdAt: '2023-09-08T10:17:52Z'
    body: "As I mentioned in the other thread, this inevitably leads to discussing that the new entity `suffix-` if you will, is given priority to appear the last. And with that, a strict definition of the ordering of entities.\r\n\r\nIn my opinion, removing the suffix damages human readability with a meager return.\r\n"
  - author: robertoostenveld
    createdAt: '2023-09-08T13:12:44Z'
    body: "The BIDS standard already specifies a strict ordering of the entities, and I am not proposing to change that.\r\n\r\n> The ordering of entities, and whether each is OPTIONAL, REQUIRED, or MUST NOT be specified for a given file type, is specified in the [Entity Table](https://bids-specification.readthedocs.io/en/stable/appendices/entity-table.html).\r\n\r\n"
  - author: oesteban
    createdAt: '2023-09-08T13:31:39Z'
    body: "> The BIDS standard already specifies a strict ordering of the entities, and I am not proposing to change that.\r\n> \r\n> > The ordering of entities, and whether each is OPTIONAL, REQUIRED, or MUST NOT be specified for a given file type, is specified in the [Entity Table](https://bids-specification.readthedocs.io/en/stable/appendices/entity-table.html).\r\n\r\nSure, that's manageable for BIDS \"raw\". But the problem scales with the number of entities, and BIDS Derivatives is set out to define a fair bunch.\r\n\r\n> The discussion [bids-standard/bids-specification#1602](https://github.com/bids-standard/bids-specification/issues/1602) shows that there is no universal agreement on when some information is to be coded as a suffix (at the end of the filename just prior to the extension, e.g., `_bold`) or as an entity (like `<key>-<value>`).\r\n\r\nThat proposal does not point at such a problem, only the discussion after it could be interpreted in that way. This proposal (i.e., removing the suffix) does not describe what it is solving. It just opens some flexibility with two goals:\r\n1. to add a name to the suffix entity so that strong opinions can be tempered and say, \"if you don't like `modality-`, we create one more suffix-like entity (i.e., last required) that is of your liking, what about `sampling-`\"; and \r\n2. the suffix is not under a controlled vocabulary anymore, so the user has total flexibility over what goes last.\r\n\r\nI think (1) is just a countermeasure to open space of agreement on a problem we currently don't have, and (2) leads to total flexibility that will require additional metadata to describe the dataset. (2) is not theoretically a bad idea, but I would honestly move into other alternatives (I said NIDM a bunch of times) with more programmatic and reliable foundations to describe the data. BIDS should offer something easy-to-use and highly readable for humans.\r\n\r\n"
  - author: yarikoptic
    createdAt: '2023-09-08T14:25:00Z'
    body: "In general I agree with the motivation for the change. I would only vote to not add again semantically meaningless `_suffix-` but see to which entities current values would need to be mapped, and start from looking at current ones and provide such a mapping at least for a good portion of them.  But it would require some thought about semantic meaningful entities. FTR -- ATM we seems to have 103 suffixes within [suffixes.yaml](https://github.com/bids-standard/bids-specification/blob/master/src/schema/objects/suffixes.yaml).  `_mod-` could have absorbed `T1w`, `inplaneT1` since that is where currently we specify for those suffixes to be placed when creating a derived (e.g. `_defacemask`) image.  But something like `_defacemask` and `_mask` would then not be fitting `_mod`.  What would that be?\r\n"
  - author: oesteban
    createdAt: '2023-09-08T14:58:03Z'
    body: "> In general I agree with the motivation for the change.\r\n\r\nAnd what is that motivation? I truly don't know what it is."
  - author: yarikoptic
    createdAt: '2023-09-08T15:36:42Z'
    body: "ATM suffix has no clear semantic meaning. ATM it aims to be a \"human accessible term best describing what is in the file\", values for which is a mix of \r\n- contrast within neuroimaging modalities (all the `_T1w`, ...)\r\n- actual modality (e.g., `_eeg` but not some \"bands\" within eeg modality),\r\n- frequently used/needed derived measure (e.g, `_defacemask`)\r\n- generic type of some spacial specific derived measures such as quantization (e.g., `_dseg`), \r\n- (soon, variety of BEPS) various mixing `_???map`s per [now formalized guidelines](https://github.com/bids-standard/bids-extensions/blob/main/docs/general_guidelines.md#guidelines)\r\n- etc.\r\n\r\nI think it is as a result of this absent semantical clarity, while contemplating new \"suffixes\" it becomes unclear what should go into the suffix vs some other entity - should a new suffix be created or an entity be created, or a mix of the two, etc. And that is what I think prompted @robertoostenveld to file this issue.\r\nIn my memory I remember us stumbling on how to formalize naming of derived files, and that is how IIRC `_mod` for `_mod-T1w_defacemask` was born since we had to place existing suffix somewhere."
  - author: TheChymera
    createdAt: '2024-02-20T06:14:17Z'
    body: "@oesteban \r\n\r\n> And with that, a strict definition of the ordering of entities.\r\n\r\nDon't we already have this? I've always seen subject and session first, or is this slated to be removed in BIDS2?"
  - author: yarikoptic
    createdAt: '2024-02-20T14:58:28Z'
    body: "yes, we have clear ordering and AFAIK always had so far. What to be done for BIDS 2.0 or either there would be effect from \r\n- #54 \r\n\r\nis yet to be decided about.  Not sure what @oesteban had in mind while talking about derivatives since, as @robertoostenveld pointed out the order is universal across modalities and specified in https://github.com/bids-standard/bids-specification/blob/master/src/schema/rules/entities.yaml . Note that `_mod` which is the closest somewhat in possibly absorbing the suffix, is in the middle of the ordering."
  - author: yarikoptic
    createdAt: '2024-12-18T17:02:28Z'
    body: 'Above I think I have forgotten to mention another potential suffix purpose (or may be the only one to leave in the scope of #54 ) - `{entity_plural}.{tsv,json}` as to generalize already present

      - `participants.{tsv,json}` -- we just do not have (yet) subjects under another level of entity, but in the scope of #11 , it could easily be `center-DBIC/center-DBIC_participants.tsv`

      - [`*_electrodes.{tsv,json}`](https://bids-specification.readthedocs.io/en/stable/modality-specific-files/electroencephalography.html#electrodes-description-_electrodestsv)

      - ... any other similar kind happen we define an entity for it (we do already have some -- e.g. for sessions and descriptions!)


      ```shell

      ❯ grep ''^[^ ]*s:'' ./src/schema/objects/suffixes.yaml | grep -v -E ''nirs''

      channels:

      descriptions:

      electrodes:

      events:

      markers:

      optodes:

      scans:

      sessions:

      svs:

      ```'
  - author: robertoostenveld
    createdAt: '2024-12-19T08:30:01Z'
    body: "Let me revisit this. The reason to raise this issue in the first place was the discussions that pursued in the drafting stage of multiple BEPs that I followed closely, whether something new should become a new suffix, or whether it should be coded as a (new or existing) entity. This unclarity in the different and quite diverse BEP teams shows that people in general don't understand or agree on the difference between a suffix and an entity. Removing the suffix - as I proposed - would be a way to avoid this, albeit a crude way that certain people appear to dislike.\n\nYarek raises the plurality in `{entity_plural}.{tsv,json}` as a rationale that is already used in different tabular files in different modalities that contain lists of multiple things (hence plural). Him pointing to `participants.tsv` triggered another thought with me, namely that considering consistent file naming rules for _all_ files is interesting. Whereas most files use `<entities>_<suffix>.<extension>`, the `participants.tsv` stands out, as well as for [microscopy](https://bids-specification.readthedocs.io/en/stable/modality-specific-files/microscopy.html#required-samples-file) the `samples.tsv`, and possibly some others. Although I never thought about these files in this way,  you could say that in that case `participants` or `samples` is the suffix, as we would also say that `channels` and `electrodes` are the suffixes for the respective files in [EEG](https://bids-specification.readthedocs.io/en/stable/modality-specific-files/electroencephalography.html#channels-description-_channelstsv). \n\nImagine (note this is a thought experiment, not a real proposal) that we were to drop all entities from any file name in a simple BIDS dataset, as already the case for `participants.tsv` and `samples.tsv`. If the files were not to have a suffix to start with, there would not be a file name left, only the file extension. Not having a file name is undesired if you ask me and has unintended consequences on unix file systems where the files would become hidden, so in that case I would say that `mri.nii` or `pet.nii` or `eeg.edf` or `meg.fif` would be the minimal full filenames that would convey meaning about the file content (the name) and the file format (the extension). This minimal \"content+format\" rule might help to clarify what goes in a suffix, whereas additional information/metadata to document and distinguish files goes in the `key-val` entities. \n\nNote that `dataset_description.json` is an odd one out where my rule does not apply, since if `description` were the suffix, the preceding `dataset` is not a list of `key-val` entities. Note also that the [agnostic](https://bids-specification.readthedocs.io/en/stable/modality-agnostic-files.html) `README`, `CHANGES` and `LICENSE` file are also inconsistent under the \"content+format\" rule, but `CITATION.cff` is consistent again, and for `README` it is allowed (but not required) to have one of three extensions (txt, rst, md)."
- number: 57
  title: Overarching agenda for 2.0
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/57
  author: yarikoptic
  assignees: []
  labels: []
  createdAt: '2023-07-27T19:06:46Z'
  updatedAt: '2024-10-25T16:14:56Z'
  closedAt: null
  body: "Short description of overarching theme/goals behind BIDS 2.0 . To make BIDS\n\n- **more flexible** as capable to accommodate new fields of neuroscience and use cases and possibly avoid breeding of \"BIDS-like\" offsprings\n  - Use-cases:\n     - https://github.com/bids-standard/bids-2-devel/issues/62\n     - https://github.com/bids-standard/bids-2-devel/issues/60\n- **more consistent**:\n  - added from [below](https://github.com/bids-standard/bids-2-devel/issues/57#issuecomment-1655813711) by @tsalo:  *address any inconsistencies or inefficiencies that we had to incorporate into BIDS to maintain backwards compatibility. For example:*\n     -  *dropping either IntendedFor or B0FieldIdentifier/B0FieldSource*,\n     -  *removing deprecated elements like the phase suffix*, \n     - *and addressing how space is used inconsistently across modalities*.\n   - see [issues labeled with \"deprecation\"](https://github.com/bids-standard/bids-2-devel/labels/deprecation) (**most** should get addressed)\n   - see [issues labeled with \"consistency\"](https://github.com/bids-standard/bids-2-devel/labels/consistency) (many should get addressed)\n- **more modular**\n   - see [issues labeled with \"modularity\"](https://github.com/bids-standard/bids-2-devel/labels/modularity) (some should get addressed)\n- **more tools-friendly**\n  - even more assumptions should migrate from human written documentation into machine-readable form (schema, and auxilary metadata, such as `DatasetType` etc)\n- **more user-friendly**\n   - largely via \"more consistent\"\n   - some rules could be relaxed or made more stringent to again reduce ambiguity \n- **easy to adopt/migrate to**: analogy could be \"python 2 to 3 migration\" -\n  - it should largely remain the same\n  - \"migration\" helper  should be provided to automagically upgrade from  1.x to 2.x. Ref: https://github.com/bids-standard/bids-2-devel/issues/67 .\n\nSome operating principles\n\n- **do not touch/modify supported data file types** -- that would simplify migration (e.g. simply via their symlinks)\n\nWith that in mind, **not all issues in this repository will be approached for 2.0**. Please vote with :+1: or :-1: on [existing issues](https://github.com/bids-standard/bids-2-devel/issues)\n\n<details>\n<summary>some items which were removed etc</summary> \n\nPostponed/reconsidered from initial composition:\n- make BIDS better \"integrated\" in the Web ecosystem, i.e. to become part of the linked web data\n\nRemoved/heavily rephrased:\n-  should either remain compatible with BIDS 1.0 as any BIDS 1.0 dataset would remain compatible with BIDS 2.0. (Exclusions might happen, should be weighted through usage)\n</details> \n\n\n<details>\n<summary>Robert: What would be selling points for users to migrate to BIDS 2.0?</summary> \n\n- some BIDS-like standards would get \"one step closer\" so may be some users jump over to BIDS from non-BIDS\n- new tools would be supporting BIDS 2.0\n- easy to migrate with migration script\n- some new features (e.g. modular composition #59) would allow for easier distributed processing \n</details>\n\n<details>\n<summary>Ariel: User concern -- \"should I now duplicate my dataset?\"</summary> \n\n- @yarikoptic: in dandi-cli (`dandi organize`) we solved it in part via \"symlinks\"\n- @effigies : git branches could be used as well if datalad is used\n</details>"
  comments:
  - author: poldrack
    createdAt: '2023-07-27T19:09:55Z'
    body: I would suggest some discussion that is focused on use cases and user stories.  What are the most important use cases for the current version of the standard, and how would the proposed changes impact the different users?  Conversely, what are the use cases/user stories that are currently impeded by the standard and how would the changes enable those?  
  - author: yarikoptic
    createdAt: '2023-07-28T03:07:47Z'
    body: "Note that many issues collected in this repository already come from users and their cases/stories.  We had a few dozens of them IIRC.\r\nFor an \"overarching\" agenda I wanted to really see high(er) level goals. The ones I have stated might have got overfitted to the issues I had in mind, so may be people could suggest even better generalizations and more overarching?\r\n\r\nNB. I think I should refactor this issue as a PR so we could have better means to adjust wording/statement...  "
  - author: tsalo
    createdAt: '2023-07-28T14:46:11Z'
    body: Rather than remaining compatible with BIDS 1.0, one goal should, I think, be to address any inconsistencies or inefficiencies that we had to incorporate into BIDS to maintain backwards compatibility. For example, dropping either `IntendedFor` or `B0FieldIdentifier`/`B0FieldSource`, removing deprecated elements like the `phase` suffix, and addressing how `space` is used inconsistently across modalities.
  - author: yarikoptic
    createdAt: '2023-07-28T22:20:47Z'
    body: "sounds good -- that is why I mentioned \"Exclusions\" so it could sound like \"Remove kludges from the growth pains of the BIDS 1.0\". ;-)   \r\nWhat I meant is that we are unlikely to introduce as radical changes as `sub-` to `par-` (for \"participant\") or the other way change `participants.tsv` to `subjects.tsv` to bring consistency in that entity, which would break virtually every BIDS dataset... WDYT? "
  - author: yarikoptic
    createdAt: '2024-01-26T19:58:27Z'
    body: "In recent @bids-standard/steering meeting we decided to announce 2024 is the \"The year of BIDS adoption\". And thus it could be one of the guiding principles -- what we need to do for BIDS 2.0 to increase adoption. And IMHO it is the issues like\n\n- #11\n- #38\n- #60\n\nand proposed approaches \n- #54 \n- #59\n"
