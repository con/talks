  body: "ATM Authors field is just a list of free form strings. That complicates interlinking bids datasets easily across authors/contributors, as expressed e.g. by @lzehl in their pipeline for inclusion of BIDS datasets within openMINDs KG etc. ATM we have in the  \r\nhttps://github.com/bids-standard/bids-specification/blob/HEAD/src/schema/objects/metadata.yaml#L207\r\n we have\r\n\r\n```yaml\r\nAuthors:\r\n  name: Authors\r\n  display_name: Authors\r\n  description: |\r\n    List of individuals who contributed to the creation/curation of the dataset.\r\n  type: array\r\n  items:\r\n    type: string\r\n```\r\n\r\nI feel that we better start defining some notion of a Person which would have clear mapping schema.org's [Person](https://schema.org/Person) record. Critically\r\n- separate first (given) from last (family) name\r\n\r\nIdeally, provide additional metadata relevant per person\r\n- ORCID\r\n- Affiliation(s), also in a standardized form\r\n\r\nIf we solve the critical issue, we could then rely on CITATION.cff to be the one which would provide necessary more structured data (ORCID, affiliations), but need to keep in mind some of already identified shortcomings (which might later be worked out in CITATION.cff):\r\n\r\n- https://github.com/citation-file-format/citation-file-format/issues/268\r\n\r\nand unfortunately CITATION.cff not really seeing much of \"development\" in the past year(s). "
  comments:
  - author: kabilar
    createdAt: '2024-09-25T03:37:25Z'
    body: "Thanks Yarik.  I like the idea of disambiguating the authors list in the `dataset_description.json`, and using the `CITATION.cff` for ORCID, affiliations, etc.  A couple of additional suggestions are below.\r\n\r\n1. If we are using both the `Authors` key in the `dataset_description.json` file and the `CITATION.cff` file, perhaps we will need to change the current docs:\r\n\r\n    `Requirement level` for `Authors` key in [dataset_description.json](https://bids-specification.readthedocs.io/en/stable/modality-agnostic-files.html#dataset_descriptionjson):\r\n  \r\n    > ``` RECOMMENDED if CITATION.cff is not present ```\r\n\r\n    [CITATION.cff](https://bids-specification.readthedocs.io/en/stable/modality-agnostic-files.html#citationcff)\r\n  \r\n    > ```For most redundant fields between CITATION.cff and dataset_description.json, the CITATION.cff SHOULD take precedence. To avoid inconsistency, metadata present in CITATION.cff SHOULD NOT be be included in dataset_description.json, with the exception of Name and DatasetDOI, to ensure that CITATION.cff-unaware tools can generate references to the dataset. In particular, if CITATION.cff is present, the \"Authors\" field of dataset_description.json MUST be omitted, and the \"HowToAcknowledge\", \"License\" and \"ReferencesAndLinks\" SHOULD be omitted in favor of the CITATION.cff fields message/preferred-citation, license and references.```\r\n\r\n2. Perhaps BIDS validators should test for inconsistencies between the authors listed in the `dataset_description.json` and the `CITATION.cff`."
  - author: Remi-Gau
    createdAt: '2024-09-25T06:29:54Z'
    body: Since bids can already have citation.cff in them to curate authors information in a more structured manner, I am not sure what this issue is meant to bring.
  - author: Remi-Gau
    createdAt: '2024-09-25T06:37:20Z'
    body: If anything for bids 2 I would remove authors from the dataset description all together and force it in citation.cff
  - author: kabilar
    createdAt: '2024-09-25T14:36:24Z'
    body: "> If anything for bids 2 I would remove authors from the dataset description all together and force it in citation.cff\r\n\r\nThanks @Remi-Gau.  For the BIDS 1.x to BIDS 2.0 migration script, would we then parse the `Authors` key from the `dataset_description.json`, generate a `CITATION.cff` file if it doesn't already exist, and add the authors to the `CITATION.cff`?"
  - author: Remi-Gau
    createdAt: '2024-09-25T14:46:06Z'
    body: 'I had started working on a CLI tool to help with this a long time ago, but I was waiting for the bids validator to validate citation.cff file to get back to it.


      https://github.com/Remi-Gau/bids2cite


      So I should probably start dusting it up.'
  - author: lzehl
    createdAt: '2024-09-25T14:54:41Z'
    body: 'Hi. To put this into context from our side: any clear recommendation from bids on how to write an author string within the specifications would already lower the variability across bids datasets. Of course long-term we would definitely prefer a structured registration of authors through e.g. the cff'
  - author: kabilar
    createdAt: '2024-09-26T19:33:45Z'
    body: "> I had started working on a CLI tool to help with this a long time ago, but I was waiting for the bids validator to validate citation.cff file to get back to it.\r\n> \r\n> https://github.com/Remi-Gau/bids2cite\r\n> \r\n> So I should probably start dusting it up.\r\n\r\nThis is great.  Thank you @Remi-Gau."
  - author: kabilar
    createdAt: '2024-09-26T19:34:46Z'
    body: "> Hi. To put this into context from our side: any clear recommendation from bids on how to write an author string within the specifications would already lower the variability across bids datasets. Of course long-term we would definitely prefer a structured registration of authors through e.g. the cff\r\n\r\nThank you @lzehl.  I definitely agree."
  - author: yarikoptic
