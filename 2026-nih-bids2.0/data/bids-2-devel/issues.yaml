- number: 4
  title: Remove RepetitionTime metadata field
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/4
  author: tsalo
  assignees: []
  labels:
  - metadata
  createdAt: '2020-08-03T12:43:35Z'
  updatedAt: '2020-08-05T11:56:22Z'
  closedAt: null
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\nThis information is already stored in the NIfTI header (as the current field description seems informed of). Apparently this field isn't intended to override the header either (which would have been a bad idea anyway), so it's basically useless data duplication, with all the potential inconsistency issues that brings. I would recommend entirely removing this field in order to minimize ambiguity.\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original authors**: Unknown"
  comments:
  - author: tsalo
    createdAt: '2020-08-03T12:45:06Z'
    body: "@marcelzwiers wrote:\r\n\r\n> This information is already stored in the NIfTI header\r\n\r\nYou mean in pixdim4? True but kind of cumbersome to read, and the standard tools and libraries can't do it"
  - author: tsalo
    createdAt: '2020-08-03T12:45:31Z'
    body: "@effigies wrote:\r\n\r\n> I would recommend entirely removing this field in order to minimize ambiguity.\r\n\r\nI would oppose this on the grounds that TR may not be constant (see VolumeTiming), in which case pixdim4 is insufficient metadata."
  - author: effigies
    createdAt: '2020-08-03T12:51:37Z'
    body: 'RepetitionTime is mutually exclusive with VolumeTiming, so I don''t see that as problematic.


      Also, what tools have problems with pixdim4?'
  - author: neurolabusc
    createdAt: '2020-08-05T11:56:22Z'
    body: 'In general, the NIfTI and BIDS headers store mutually independent information, which prevents issues of precedence for conflicting information.For most MR sequences, RepetitionTime and pixdim4 are the same. I also commented on this during the development of BIDS. One major reason for storing this is that [SPM would not retain pixdim4](https://neurostars.org/t/info-spm12s-slicetiming-sets-tr-value-in-the-nifti-header-to-zero/2698). Therefore, if SPM was used at any time to modify a NIfTI image, the resulting image would no longer include pixdim4. Therefore, the inclusion of RepetitionTime for BIDS had strong pragmatic motivation. '
- number: 3
  title: Deprecate phase and magnitude suffixes in favor of part and echo entities for field maps
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/3
  author: tsalo
  assignees: []
  labels:
  - deprecation
  - entities
  - suffixes
  createdAt: '2020-08-03T12:31:00Z'
  updatedAt: '2024-09-20T19:31:18Z'
  closedAt: null
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\nIf bids-standard/bids-specification#424 is merged, then there will be an entity that delineates magnitude/phase in the specification. There already is one that delineates multi-echo data (echo). These two entities can replace the existing func suffix “phase” and the existing fmap suffixes “phase1”, “phase2”, “magnitude1”, and “magnitude2”. I’m not sure how best to label “phasediff” with the current proposal, but I’m sure we can figure out a way.\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original title**: Deprecate phase, phase1, phase2, phasediff, magnitude1, magnitude2 suffixes in favor of part and echo entities\r\n**Original authors**: @tsalo \r\n"
  comments:
  - author: tsalo
    createdAt: '2020-08-03T16:13:08Z'
    body: "To clarify with examples:\r\n\r\n- fmap/\r\n    - sub-X_run-1_magnitude1.nii.gz --> sub-X_run-1_echo-1_part-mag_epi.nii.gz\r\n    - sub-X_run-1_magnitude2.nii.gz --> sub-X_run-1_echo-2_part-mag_epi.nii.gz\r\n    - sub-X_run-1_phase1.nii.gz --> sub-X_run-1_echo-1_part-phase_epi.nii.gz\r\n    - sub-X_run-1_phase2.nii.gz --> sub-X_run-1_echo-2_part-phase_epi.nii.gz\r\n- func/\r\n    - sub-X_task-Y_run-1_bold.nii.gz --> sub-X_task-Y_run-1_part-mag_bold.nii.gz\r\n    - sub-X_task-Y_run-1_phase.nii.gz --> sub-X_task-Y_run-1_part-phase_bold.nii.gz"
  - author: tsalo
    createdAt: '2020-08-20T17:05:07Z'
    body: "Does anyone have any idea how we would want to support phase-difference images here?\r\n\r\nWould a new suffix like `epiDiff` work? Or maybe a new entity?"
  - author: oesteban
    createdAt: '2020-12-08T23:51:11Z'
    body: "Phase[diff] are typically not acquired with EPI (which would imply analytically invert a generally nondiffeomorphic deformation).\r\n\r\n_fieldmap are not acquired with EPI.\r\n\r\nWhy epi - which is the only sequence-mapped suffix allowed under fmap/ that doesn't actually measure the field map?"
  - author: tsalo
    createdAt: '2020-12-09T00:14:16Z'
    body: "> Why epi - which is the only sequence-mapped suffix allowed under fmap/ that doesn't actually measure the field map?\r\n\r\nThe reason is that I don't know that much about the sequences going into field maps \U0001F61E.  I just assumed phase-difference field maps were EPIs with short echo times. It sounds like the two ideas you proposed in https://github.com/bids-standard/bids-specification/pull/424 would be much more accurate, so I'll post them here.\r\n\r\nFrom https://github.com/bids-standard/bids-specification/pull/424#issuecomment-741196216:\r\n```\r\nfmap/\r\n   sub-1_part-mag_echo-1_gre.nii.gz       # gre = gradient-recalled echo; equiv. magnitude1\r\n   sub-1_part-mag_echo-2_gre.nii.gz       # equiv. magnitude2\r\n   sub-1_part-phase_echo-1_gre.nii.gz     # equiv. phase1\r\n   sub-1_part-phase_echo-2_gre.nii.gz     # equiv. phase2\r\n   sub-1_part-mag_sei.nii.gz              # sei = spiral-echo imaging; equiv. to magnitude\r\n   sub-1_part-phase_sei.nii.gz            # equiv. to _fieldmap\r\n   sub-1_part-mag_gre.nii.gz              # equiv. to _magnitude1 corresponding to phasediff\r\n   sub-1_part-phase_gre.nii.gz            # equiv. to phasediff\r\n```\r\n\r\nFrom https://github.com/bids-standard/bids-specification/pull/424#issuecomment-741208903:\r\n\r\n```\r\nfmap/\r\n   sub-1_part-mag_echo-1_phasediff.nii.gz       # equiv. magnitude1\r\n   sub-1_part-mag_echo-2_phasediff.nii.gz       # equiv. magnitude2\r\n   sub-1_part-phase_echo-1_phasediff.nii.gz     # equiv. phase1\r\n   sub-1_part-phase_echo-2_phasediff.nii.gz     # equiv. phase2\r\n   sub-1_part-mag_phasediff.nii.gz              # equiv. to _magnitude1 corresponding to phasediff\r\n   sub-1_part-phase_phasediff.nii.gz            # equiv. to phasediff\r\n   sub-1_part-mag_fieldmap.nii.gz               # equiv. to magnitude\r\n   sub-1_part-phase_fieldmap.nii.gz             # equiv. to _fieldmap\r\n```\r\n\r\nOne thing I would note about the `gre`/`sei` idea is that I think the SWI BEP includes a `GRE` suffix and BEP001 includes an `MEGRE` suffix, so I'd make both suffixes upper-case.\r\n\r\nRegarding the `phasediff` suffix idea, I think `phasediff` is a little confusing. I'd automatically interpret it as the difference of phase images, as it's defined in the current specification. Having `part-mag` with that would be a little weird."
  - author: oesteban
    createdAt: '2020-12-09T08:47:09Z'
    body: "> The reason is that I don't know that much about the sequences going into field maps \U0001F61E. I just assumed phase-difference field maps were EPIs with short echo times. It sounds like the two ideas you proposed in [bids-standard/bids-specification#424](https://github.com/bids-standard/bids-specification/pull/424) would be much more accurate, so I'll post them here.\r\n\r\nGotcha :). This is why we are working through PR, so I'm happy to see that there's not a strong opinion behind that proposal and therefore, you are looking forward to make all the changes it takes. Thanks for pushing on this -a bit abandoned- part of the MRI specifications.\r\n\r\n\r\n\r\n> One thing I would note about the `gre`/`sei` idea is that I think the SWI BEP includes a `GRE` suffix and BEP001 includes an `MEGRE` suffix, so I'd make both suffixes upper-case.\r\n\r\nYes, I don't love these particular two. To make it worse - for instance, Philips generates fieldmaps in Hz (meaning, they are phase-unwrapped, ready to use), and I have no clue as to whether they use GRE and use software to provide you the b0_map (that's apparently their vendored sequence name) or they use SEI. Also, it is not unthinkable at all that, e.g. Siemens, starts spitting phase difference maps with the phase unwrapped.\r\n\r\nSo, the definite, more compact way to represent these fieldmaps would be:\r\n\r\n```\r\nfmap/\r\n   sub-1_part-mag[_echo-{1,2}]_fieldmap.nii.gz\r\n   sub-1_part-phase[_echo-{1,2}]_fieldmap.nii.gz\r\n```\r\n\r\nAnd make MANDATORY two metadata fields:\r\n```JSON\r\n{\r\n  \"Units\": \"rad/s\",\r\n  \"PhasedWrapped\": true\r\n}\r\n```\r\n\r\nWhen units are not `rad` or `rad/s`, the `PhaseWrapped` MUST be `false`. Because units are \"rad/s\" here (and this fieldmap should not define `echo-`) you would know this is a phasediff and the `EchoSpacing` OR `EchoTime1&2` metadata is MANDATORY.\r\n\r\nWhen units are `rad` then `echo-` MUST be defined. `echo-` should also make MANDATORY to define `EchoTime` on the JSON sidecar. And we know this is the phase1/2 type of fieldmap.\r\n\r\nFinally, when units are `Hz` (or `ppm`, if you want to look fancy and add a potential complication point for no clear reason), then you know this is a direct *B<sub>0</sub>* measurement (i.e., the old `_fieldmap`).\r\n"
  - author: oesteban
    createdAt: '2020-12-09T08:52:29Z'
    body: "And, if you don't want to reuse `_fieldmap` because of the obvious overlap with the current specs, please replace the above pattern with:\r\n\r\n```\r\nfmap/\r\n   sub-1_part-mag[_echo-{1,2}]_B0.nii.gz\r\n   sub-1_part-phase[_echo-{1,2}]_B0.nii.gz\r\n```\r\nwith the big B (do not please suggest a small b).\r\n\r\nAnd if you want to be a purist:\r\n```\r\nfmap/\r\n   sub-1_part-mag[_echo-{1,2}]_deltaB0.nii.gz\r\n   sub-1_part-phase[_echo-{1,2}]_deltaB0.nii.gz\r\n```\r\n\r\nor even more so:\r\n```\r\nfmap/\r\n   sub-1_part-mag[_echo-{1,2}]_B0diff.nii.gz\r\n   sub-1_part-phase[_echo-{1,2}]_B0diff.nii.gz\r\n```\r\n\r\nMore context for this is given here: https://www.nipreps.org/sdcflows/api/sdcflows.workflows.fit.fieldmap.html"
  - author: tsalo
    createdAt: '2021-02-06T22:01:27Z'
    body: "I like both `deltaB0` and `B0diff`. So it looks like this, then?\r\n\r\n```\r\nfmap/\r\n   sub-1_echo-1_part-mag_B0.nii.gz          # equiv. magnitude1\r\n   sub-1_echo-2_part-mag_B0.nii.gz          # equiv. magnitude2\r\n   sub-1_echo-1_part-phase_B0.nii.gz        # equiv. phase1\r\n   sub-1_echo-2_part-phase_B0.nii.gz        # equiv. phase2\r\n   sub-1_part-mag_B0.nii.gz                 # equiv. magnitude\r\n   sub-1_part-phase_B0.nii.gz               # equiv. fieldmap\r\n   sub-1_echo-1_part-mag_B0.nii.gz          # equiv. magnitude1 corresponding to phasediff\r\n   sub-1_part-phase_<B0diff|deltaB0>.nii.gz # equiv. phasediff\r\n   sub-1_dir-AP_epi.nii.gz                  # same as before\r\n   sub-1_dir-PA_epi.nii.gz                  # same as before\r\n```\r\n\r\nTwo things I want to take into account from the qMRI BEP:\r\n\r\n1. The use of `w` and `map` in suffixes to indicate that a map is \"weighted\" by a contrast or is quantitative, respectively. E.g., `T1w` vs. `T1map`. Should that come into play here? Maybe by having what is currently called `_fieldmap` as `B0map` and the others as `B0w`? Does that make sense?\r\n2. B1+/- mapping. I know next to nothing about this, but 2.0 is an opportunity to synchronize B0 and B1+/- mapping terminology. Perhaps we can pull in some qMRI folks for that part."
  - author: yarikoptic
    createdAt: '2024-09-20T16:17:21Z'
    body: FWIW, `phase` is already marked deprecated for `func` data. But there is no deprecated labels for fmap suffixes yet. Should this be worked on further to aim for BIDS 2.0?
  - author: tsalo
    createdAt: '2024-09-20T16:20:16Z'
    body: Yes absolutely. If others agree, then I think we could propose these new suffixes in BIDS 1.x and then drop the old versions in 2.0.
  - author: yarikoptic
    createdAt: '2024-09-20T19:31:17Z'
    body: Sounds good!
- number: 1
  title: Welcome! And migration from Google Doc to this repo
  state: CLOSED
  url: https://github.com/bids-standard/bids-2-devel/issues/1
  author: sappelhoff
  assignees: []
  labels: []
  createdAt: '2020-08-02T11:44:35Z'
  updatedAt: '2020-09-03T07:44:47Z'
  closedAt: '2020-09-03T07:44:01Z'
  body: "Welcome to this new repository everybody!\r\n\r\nPlease see this message on how to work with the suggestions in this repo: https://github.com/bids-standard/bids-2-devel/issues/1#issuecomment-669023081\r\n\r\n---\r\n\r\nFor context, please see the messages in the BrainHack Mattermost starting approximately with [this message by @tsalo ](https://mattermost.brainhack.org/brainhack/pl/ooomx4kx3p8t5k1btfid8izc4o).\r\n\r\nNext steps:\r\n\r\n1. [x] migrate all existing suggestions and discussions\r\n1. [x] render the BIDS 2.0 google doc \"view only\"\r\n1. [x] label the new issues\r\n\r\n\r\nWe need to migrate all suggestions / comments and preferably also discussions from the [BIDS 2.0 google doc](https://docs.google.com/document/d/1LEgsMiisGDe1Gv-hBp1EcLmoz7AlKj6VYULUgDD3Zdw/edit?ts=5ec29f62#) to this repository.\r\n\r\n- Who wants to help?\r\n- How should we proceed?\r\n- What's important to keep in mind?\r\n"
  comments:
  - author: tsalo
    createdAt: '2020-08-02T13:27:40Z'
    body: "I'm happy to help! It seems pretty straightforward to copy over the contents of the Doc, but the big problem, as far as I can tell, is attributing ideas to individuals. Most of the suggestions for ideas have already been accepted, so it would be pretty difficult to go through the history and track down each person who contributed an idea, and then figure out their GitHub handle, if they even have an account.\r\n\r\nI recommend the following: \r\n1. We start opening issues for suggestions.\r\n2. When we know who came up with the idea, we tag them. Otherwise, we just let it go. People can always tag themselves later, if need be.\r\n3. When there are comments, we add them as new comments on the issue. When we know the GitHub handle of the commenter, we tag them in the comment (e.g., \"@tsalo said: \"). Otherwise, we use the person's name. We can always edit the comments to replace names with handles later.\r\n\r\nFrom there, we can use Project boards or labels to collect the suggestions into more manageable groups. I think the same labels as `bids-specification` should be good to start."
  - author: tsalo
    createdAt: '2020-08-02T13:38:22Z'
    body: "What about an issue template with the following?\r\n\r\n```\r\n# content of suggestion\r\n\r\nOriginal authors:\r\n```\r\n\r\nWe leave \"original authors\" empty until we know the authors, then we can edit the issue with handles or names as needed. The \"content of suggestion\" would be the text from the Doc, with the issue title obviously being the title of the suggestion."
  - author: tsalo
    createdAt: '2020-08-02T18:42:28Z'
    body: "Here's a list of the issues we need to open, with a first attempt at attribution:\r\n- [x] Remove RepetitionTime Metadata Field\r\n- [x] Change FLASH for non-proprietary name\r\n- [x] Add magnetization transfer\r\n- [x] Allowing hyphens in filename key values: @\\bthirion\r\n- [x] Keep the filenames short: @\\ccraddock\r\n- [x] Allow tabs in .bvec/.bval\r\n- [x] Exchange “-” with “_” and vice versa: @\\andrebeu\r\n- [x] Multi-site/center studies: @\\jpellman\r\n- [x] Revert to one directory per scan\r\n- [x] Extended BIDS for animals\r\n- [x] Remove inheritance rule: @\\ccraddock\r\n- [x] Add a compulsory header to every JSON file: @\\ccraddock\r\n- [x] Allow expressing parameters in different units: @\\ccraddock\r\n- [x] Make key/value pair: _run-XX suffix mandatory\r\n- [x] File format for raw data\r\n- [x] Replacing “task” with “trial”: @\\TheChymera\r\n- [x] Support for multiple 3D files in addition to 4D filed for bold: @\\gllmflndn\r\n- [x] Replace `_scans.tsv` with `_recordings.tsv`\r\n- [x] One directory per modality\r\n- [x] Store date/time information in the JSON sidecar instead of _scans.tsv file: @\\chrisgorgo\r\n- [x] Make capitalization of suffixes consistent: @\\jbpoline\r\n- [x] Drop sidecar JSON files and store all metadata in the header\r\n- [x] Use IETF RFC 2119 keywords to indicate requirement levels\r\n- [x] Use Augmented Backus–Naur form instead of definition templates\r\n- [x] Harmonizing sequence/contrast names: Martijn Mulder (not sure about GitHub handle)\r\n- [x] Addition of scan length in the JSON sidecar: @\\tyarkoni\r\n- [x] Consider replacing data dictionaries with Table Schema\r\n- [x] Consider replacing TSV files with a fileformat that supports built in metadata\r\n- [x] Change RepetitionTime definition to the same one as DICOM field 0018,0080: @\\mharms\r\n- [x] Enforce TE ordering for multi-echo fMRI data: @\\emdupre\r\n- [x] Allowed characters in labels/keys\r\n- [x] Alternative location for raw data\r\n- [x] MINOR: Replace “units” with “unit” in channels.tsv\r\n- [x] Homogenize “Subject” Nomenclature: @\\TheChymera\r\n- [x] N/A vs NaN for missing values: @\\CPLambert\r\n- [x] Phenotypes\r\n- [x] Deprecate phase, phase1, phase2, phasediff, magnitude1, magnitude2 suffixes in favor of part and echo entities: @\\tsalo\r\n- [x] Move and Rename IntendedFor field from fieldmap to functional image: @\\akimbler"
  - author: sappelhoff
    createdAt: '2020-08-03T09:49:00Z'
    body: Thanks for the initiative and energy @tsalo - I just gave you maintainer permissions for this repository so that you can create project boards as you see fit. I think approach is reasonable and we can take it step by step from here
  - author: tsalo
    createdAt: '2020-08-03T14:29:09Z'
    body: "I've opened the issues now, so I think the next step should be to label them. Many of these issues are >=3 years old, and at least some of them might have already been incorporated into the specification (e.g., #6 and #18 are both part of BEP-001, I believe).\r\n\r\nI'm leaning toward the following labels:\r\n\r\n- `1.0-compatible`: These can be proposed for the specification in its current form. We will probably link these to BIDS 1.0 issues and then close them.\r\n- `folder-structure`: Proposals to reorganize files in the specification.\r\n- `characters`: Proposals to change accepted characters throughout the specification.\r\n- `deprecation`: Proposals to remove entities, suffixes, etc. that are currently implemented.\r\n- `common-principles`: Proposals to change common principles (e.g., remove inheritance rule, add required header to JSON files).\r\n- `entities`: Changes to entities.\r\n- `metadata`: Changes to metadata fields/files.\r\n- `suffixes`: Changes to suffixes.\r\n- `impact: [low|medium|high]`\r\n\r\nEDIT: I've also added links to the issues to the Doc. Would you mind accepting those changes before you lock the Doc?"
  - author: sappelhoff
    createdAt: '2020-08-03T14:47:49Z'
    body: Done, and the labels sound good, feel free to go ahead and create them. I think we are ready to render the Gdoc "view only" now, WDYT?
  - author: tsalo
    createdAt: '2020-08-03T14:51:11Z'
    body: I just had to add links for the last two issues, but now it's good to lock.
  - author: jbteves
    createdAt: '2020-08-04T21:42:47Z'
    body: How should we indicate approval/disapproval on various items? And is commentary limited to existing BIDS community members?
  - author: tsalo
    createdAt: '2020-08-04T21:46:10Z'
    body: 'I don''t think commentary should be limited to BIDS contributors (although being familiar with the standard is important), and I think :+1: and :-1: should be good for simple approval/disapproval, with comments if you have a more nuanced take.'
  - author: sappelhoff
    createdAt: '2020-08-05T07:10:47Z'
    body: "> How should we indicate approval/disapproval on various items?\r\n\r\nI think a standalone :+1: is fine, but :-1: SHOULD be accompanied with a reason.\r\n\r\n\r\n> And is commentary limited to existing BIDS community members?\r\n\r\nWe are an open community, there is no \"application form\" or something like it :-) just comment."
  - author: sappelhoff
    createdAt: '2020-09-03T07:44:01Z'
    body: migration is done, closing this.
- number: 47
  title: Allow ``IntendedFor`` and make ``task-`` optional for ``_sbref.ext``
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/47
  author: oesteban
  assignees: []
  labels: []
  createdAt: '2019-07-03T00:20:13Z'
  updatedAt: '2021-02-22T12:46:17Z'
  closedAt: null
  body: "Related to bids-standard/bids-specification#239.\r\n\r\nSome fMRI studies will not acquire one SBRef for every multiband BOLD scan (this is probably true for DWI too, and thus bids-standard/bids-specification#239).\r\n\r\nCurrently, the `task-Name` entity needs to be defined for SBRefs. Doing it optional, would allow the following:\r\n\r\n```\r\nfunc/\r\n  sub-3010_sbref.nii.gz\r\n  sub-3010_task-discountFix_run-1_bold.nii.gz\r\n  sub-3010_task-manipulationTask_run-1_bold.nii.gz\r\n  sub-3010_task-motorSelectiveStop_run-1_bold.nii.gz\r\n  sub-3010_task-rest_run-1_bold.nii.gz\r\n  sub-3010_task-rest_run-1_sbref.nii.gz\r\n  sub-3010_task-stopSignal_run-1_bold.nii.gz\r\n```\r\n\r\nWhere, by the inheritance principle, ``sub-3010_sbref.nii.gz`` is intended for all tasks but `rest` because a particular `sbref` exists for that one.\r\n\r\nAdditionally, I propose to allow defining the ``IntendedFor`` metadata for SBRefs, so the same behavior can be implemented without missing the provenance about what task was acquired closest to the sbref, e.g.:\r\n\r\n```\r\nfunc/\r\n  sub-3010_task-discountFix_run-1_bold.nii.gz\r\n  sub-3010_task-discountFix_run-1_sbref.json\r\n  sub-3010_task-discountFix_run-1_sbref.nii.gz\r\n  sub-3010_task-manipulationTask_run-1_bold.nii.gz\r\n  sub-3010_task-motorSelectiveStop_run-1_bold.nii.gz\r\n  sub-3010_task-rest_run-1_bold.nii.gz\r\n  sub-3010_task-rest_run-1_sbref.nii.gz\r\n  sub-3010_task-stopSignal_run-1_bold.nii.gz\r\n```\r\n\r\nwhere `sub-3010_task-discountFix_run-1_sbref.json` has an `IntendedFor` field:\r\n\r\n```\r\n{\r\n  \"IntendedFor\": [\r\n    \"sub-3010_task-discountFix_run-1_bold.nii.gz\",\r\n    \"sub-3010_task-manipulationTask_run-1_bold.nii.gz\",\r\n    \"sub-3010_task-motorSelectiveStop_run-1_bold.nii.gz\",\r\n    \"sub-3010_task-stopSignal_run-1_bold.nii.gz\"\r\n  ]\r\n}\r\n```"
  comments: []
