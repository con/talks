  createdAt: '2020-08-03T13:53:45Z'
  updatedAt: '2020-08-08T16:04:27Z'
  closedAt: null
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\nhttps://groups.google.com/forum/?utm_medium=email&utm_source=footer#!msg/bids-discussion/btpHFtu9xWo/dProjNAmAwAJ \r\n\r\nIt seems the discussion converged to use a `_part-xxx` key/value pair in the filename for data stored in multiple files. Could the same principle be used to allow 3D NIfTI files as well as 4D NIfTI files? This was already mentioned in another thread:\r\n\r\nhttps://groups.google.com/forum/#!msg/bids-discussion/zFkdHeLcuMc/eDORAobIAAAJ\r\n\r\nbut the suggestion was lost in the discussion.\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original authors**: @gllmflndn\r\n"
  comments:
  - author: jbteves
    createdAt: '2020-08-04T22:18:20Z'
    body: I feel it would be better to offer some samples on how to squeeze 3-D files into one 4-D file or offer a BIDS tool to assist with this. 4-D files are very common in the major software packages.
  - author: tsalo
    createdAt: '2020-08-05T14:41:36Z'
    body: I also prefer retaining 4D files. Also, I would like to note that `_part-XX` has been adopted for complex-valued data (i.e., mag/phase or real/imag) and the MEG separation functionality has been moved to `_split-XX`.
- number: 29
  title: Replace _scans.tsv with _recordings.tsv
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/29
  author: tsalo
  assignees: []
  labels:
  - suffixes
  - auto-migrate
  createdAt: '2020-08-03T13:52:01Z'
  updatedAt: '2025-12-04T15:20:50Z'
  closedAt: null
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\nRight now the `_scans.tsv` file keeps track of which acquisitions exist within a particular session. The word “scans” is a little domain-specific, especially as people begin to write BIDS formats for things like electrophysiology. Why not call this `recordings`, as this is more domain-general and still reflects the same overall idea?\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original authors**: Unknown\r\n"
  comments:
  - author: tsalo
    createdAt: '2020-08-03T13:52:41Z'
    body: "@jgrethe wrote:\r\n\r\nOr perhaps _data.tsv which would be more domain agnostic"
  - author: robertoostenveld
    createdAt: '2020-08-03T15:01:57Z'
    body: "For me it is also not clear what precisely should go in the `_scans.tsv` file, i.e., what qualifies as data (or acquisitions) and what not.\r\n\r\nIn case of task-fMRI with events, a single line (with the `bold.nii`) would be added.\r\nIn case of behavior only (no scanner involved), would the 'events.tsv` be added?\r\n\r\nIn case of EEG with recorded/digitized electrode positions, the `eeg.vhdr` file would be added but not the electrode positions ( I guess).\r\nBut if only electrode positions are recorded and no EEG, as in [this study](https://doi.org/10.1016/j.jneumeth.2019.108378) and [this corresponding data](https://data.donders.ru.nl/collections/di/dccn/DSC_3015055.01_493), would the `electrodes.tsv` be added?\r\n\r\n "
  - author: jbteves
    createdAt: '2020-08-04T22:19:57Z'
    body: 'I would propose "acquisitions" though I will also advocate for #27, which would render this issue irrelevant.'
  - author: tsalo
    createdAt: '2020-08-05T15:05:36Z'
    body: "In [Common Principles](https://bids-specification.readthedocs.io/en/stable/02-common-principles.html#definitions), acquisition refers to \"a continuous uninterrupted block of time during which a brain scanning instrument was acquiring data according to particular scanning sequence/protocol.\" I actually think adopting \"acquisitions\" for the tsv file would be a great idea, @jbteves, independent of #27. \r\n\r\nHere's my reasoning:\r\n\r\n1. `scans` is currently confusing, as @robertoostenveld says. Acquisitions, on the other hand, are quite concrete. There may be edge cases, but generally speaking we know what an acquisition refers to.\r\n2. In addition to different simultaneously acquired data types (e.g., fMRI + events), we have several entities that generally separate files from the same acquisition (e.g., `echo`). If, however, we have our (optional) tsv file dedicated to _acquisitions_, then we can pop out all of those pesky entities and get one acquisition time that applied to the whole file group, along with any other acquisition-specific information.\r\n3. We could even perhaps include a column to provide acquisitions with identifiers, which could tie into https://github.com/bids-standard/bids-specification/issues/529. Basically, the \"grouped scan collections\" (scans from separate acquisitions that are parametrically linked and must be analyzed together) could be defined with this new \"group_identifier\" column in the \"acquisitions\" tsv."
  - author: yarikoptic
    createdAt: '2024-04-12T03:08:27Z'
    body: "There is a need also very similar to \r\n- https://github.com/bids-standard/bids-specification/issues/1771 with the need of temporal alignment of beh recording\r\n\r\nso there `_recordings` is good,\r\n \r\nWith @neuromechanist we are working out `stimuli/` formalization they have. With stimuli we have a need to align the stimuli whenever it is a video/audio covering entire run.  But it is not collected data, and might not even be in that folder but rather just referenced from under `stimuli/`. But the point is that it also would relate to temporal alignment of various files pertinent to the experiment.  If we decide somehow for it to be reflected in this file, then `_recordings."
  - author: tsalo
    createdAt: '2024-04-12T12:59:08Z'
    body: Recently, we started using `descriptions.tsv` to define values in `desc` entities in a dataset, and I have proposed extending that to other entities, including `recording` and `acq` (see https://github.com/bids-standard/bids-specification/issues/1706). I think the proposals in this issue would conflict with that.
  - author: yarikoptic
    createdAt: '2024-04-12T14:04:35Z'
    body: Good point, and 👍 on such generalization. Let's think alternative name
