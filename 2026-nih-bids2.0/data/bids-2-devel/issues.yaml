    body: "FWIW zenodo also pretty much switched from their custom json format to support CITATION.cff as the target one, which is :+1: for considering to support it within BIDS . But with that in mind someone should indeed review CITATION.cff format as to expressiveness to describe contributors roles etc. I think the starting reference is\r\n- https://github.com/citation-file-format/citation-file-format/issues/27#issuecomment-1725075915\r\n- https://github.com/citation-file-format/citation-file-format/issues/112\r\n\r\nI immediately had a \"question\" - what about some contactPerson or https://schema.org/ContactPoint? there is `contact:` in CITATION.cff e.g. see [example](https://github.com/citation-file-format/citation-file-format/blob/79290ebbc3ba8595b92ab323aff7f01c8a5965af/examples/1.0.3/software-without-a-doi-closed-source/CITATION.cff#L13)."
  - author: Remi-Gau
    createdAt: '2024-02-28T07:53:51Z'
