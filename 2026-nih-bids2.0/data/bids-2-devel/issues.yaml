- number: 12
  title: N/A vs NaN for missing values
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/12
  author: tsalo
  assignees: []
  labels:
  - characters
  createdAt: '2020-08-03T13:15:13Z'
  updatedAt: '2020-09-02T19:46:41Z'
  closedAt: null
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\nSo this may seem like a minor gripe, but the specification is currently very clear on the “Missing and non-applicable values MUST be coded as n/a” [overt caps in the original]. I am currently battling to BIDs align large multimodal datasets across many different types of pipelines/sources (not just imaging), and for several reasons this edict has proven to be particularly unhelpful. I would suggest relaxing (or changing) the rule in 2.0 (I personally have given up and will simply adding a caveat to my readme and .json files).\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original authors**: @CPLambert\r\n"
  comments:
  - author: tsalo
    createdAt: '2020-08-03T13:15:25Z'
    body: "@sappelhoff wrote:\r\n\r\nCould you briefly list the most important reasons why \"n/a\" has \"proven to be particularly unhelpful\"?"
  - author: tsalo
    createdAt: '2020-08-03T13:16:08Z'
    body: "@CPLambert wrote:\r\n\r\n> Could you briefly list the most important reasons why \"n/a\" has \"proven to be particularly unhelpful\"?\r\n\r\nThanks Stefan:\r\n\r\nIn a nutshell (and in my experience): NaNs are trivial to use in MATLAB, can be handled natively as numeric vectors across a whole range of operations with supported functions including logical indexing (e.g. isnan) - This is also true for a wide range of other languages including Python (numpy.isnan), R(is.nan) etc, etc., 'n/a', on the other hand, is not and requires additional conversions because it is treated as a string and needs replacing (NaN<-> 'n/a') in vectors where it occurs when writing/reading/using. \r\n\r\nThis may seem trivial, but when scaled to large mixed multimodal phenotyping datasets with >5000 fields including exports from other databases (e.g. RedCap), I have personally found the capitalised edict to become, as stated, \"particularly unhelpful\", not to mention un-necessarily restrictive and surely counter productive to the broader aim of BIDS? \r\n\r\nAre there any good reasons not to relax (or change) this in version 2.0?\r\n\r\nI can, of course, provide more important reasons if required.\r\n\r\nBW\r\n\r\n-Chris"
  - author: jbteves
    createdAt: '2020-08-05T00:08:05Z'
    body: This is widely used to mean unknown/unavailable for floating-points, I think this would be a good change that makes things easier to parse.
  - author: neurolabusc
    createdAt: '2020-08-05T11:17:20Z'
    body: "Technically, the JSON format [requires numbers to be finite](https://stackoverflow.com/questions/1423081/json-left-out-infinity-and-nan-json-status-in-ecmascript). I recognize that SPM intentionally uses NaNs to mean `out of brain`, and Matlab and NumPy handle infinity and NaN values appropriately. However, since BIDS is based on the JSON format, it is likely that many JSON tools will raise an exception if a value is reported as NaN, +Inf, -Inf (as they should, if they strictly observe the standard). \r\n\r\nThis is actually an issue with dcm2niix, which directly transcribes DICOM tags to JSON. At the moment, if a value is recorded as Infinity in the DICOM, the JSON will list infinity. What should the proper behavior of DICOM to BIDS converters be (e.g. dcm2niix and @xiangruili's dicm2nii):\r\n 1. Transcribe DICOM values directly to JSON to retain all data. This is the general dcm2niix approach, to always assume that the DICOM file is [truthful](https://en.wikipedia.org/wiki/Quis_custodiet_ipsos_custodes%3F).\r\n 2. Generate an exception, as in reality when a DICOM Tag (e.g. EchoTime) is not finite, it virtually always suggests a corrupt DICOM file. \r\n 3. Simply omit the specific BIDS tag, as the value can not be represented (e.g. if a DICOM image reports a Echo Time of Inf+, the BIDS EchoTime tag is not generated, but all other valid tags are generated).\r\n\r\nI have no preference, but wonder if there is a consensus. I generally consider @effigies the arbitrator for all things BIDS, so happy to hear his thoughts.\r\n"
  - author: robertoostenveld
    createdAt: '2020-08-05T12:15:46Z'
    body: "N/A vs NaN not only applies to information that is obtained from DICOM files, but also for information obtained from other raw data files (MEG, EEG, iEEG). I am not aware of information from the MEG, EEG and iEEG raw data files that needs to be specified in the sidecar JSON files where this forms a problem. MEG, EEG and iEEG raw data file headers are simpler than DICOM and usually well-behaved. \r\n\r\nFurthermore, it can apply to information that is acquired by the researcher not using the scanner. E.g. questionnaire data, like age, sex, etc. I believe in that case that the missing data always ends up in a TSV file. Missing data in TSV files can be coded in any form since the TSV can be accompanied by a JSON data dictionary (which for example might specify that -1 is used to code age when it is not known).\r\n\r\nI think it would help to clarify whether \"N/A vs NaN\" is considered a problem in the JSON files, and/or in the TSV files. \r\n\r\n"
  - author: effigies
    createdAt: '2020-08-07T15:17:54Z'
    body: "I think I agree with @robertoostenveld that there's a JSON/TSV conflation happening here. So I will address both:\r\n\r\n#### JSON\r\n\r\nFrom the StackOverflow that @neurolabusc posted, the \"correct\" JSON transcription of `nan`, `inf` and `-inf` is `null`, which will turn into a Python `None`. I'm not sure how MATLAB or R handle those, but making it clear that we follow this convention would allow any BIDS tooling to handle it. It does not appear BIDS says anything about missing values in JSON, probably because you can always omit them.\r\n\r\nReading among Chris' options, I would say option 1 is bad because it produces malformed JSON, but either of the other two would be fine. I would add a further option of normalizing to `null`, which has the advantage of being conformant JSON, marking that a value was present but non-finite, but the disadvantage of possibly being more complicated to tools than dropping.\r\n\r\n#### TSV\r\n\r\nTo summarize my understanding of the issue:\r\n\r\n1) `\"n/a\"` is a missing value, which is a way that curators can say \"It is up to the reader to interpret this field\".\r\n2) `nan` is a valid value, which is a way that curators can say \"this entry is intended to be a `nan`\".\r\n3) When people always interpret `\"n/a\"` as `nan`, then this can be annoying to add the interpretation step to all analysis code.\r\n\r\nApps may fill in `nan`, but they may equally validly do some interpolation. If `nan` can be generated for another reason, then a tool intending to interpolate either `nan` or  there is a loss of information that can lead to incorrect behavior.\r\n\r\nAssuming others agree with my interpretation, I'm not sure how best to describe this in the spec: There *is* flexibility to specify a non-finite value such as NaN, but that imposes the curator's interpretation on all downstream tools.\r\n\r\nFWIW there are MATLAB tools to handle heterogeneous missing values: www.mathworks.com/help/matlab/matlab_prog/clean-messy-and-missing-data-in-tables.html"
  - author: CPLambert
    createdAt: '2020-08-07T16:20:48Z'
    body: "Hi there, \r\n\r\nSo @robertoostenveld JSON/TSV point is spot on. My gripe was pragmatic and arose from the .tsv side, trying to do things correct by BIDs but getting  _mildly_ irritated with n/a -> NaN conversions in tsvs being pulled from different data formats (string, numeric, genetic,imaging) as it started causing problems in downstream (non-neuro) tools, and was making things overly complicated. The wording of the BIDS guidelines seemed a tad restrictive for .tsv data, especially if I could always define my interpretation/use a data dictionary. Plus there's a lot of handy functions to handle NaNs in large matrices across languages e.g. nanmean, but less so for n/a  \r\n\r\nRegarding @effigies point, personally I look at/use NaN as \"unusable data\" for whatever reason (and clearly the reason will be context dependent). Admitted, I am a bit uncertain of a scenario when interpreting n/a as NaN would strictly be wrong, and a counter-example would be useful here."
  - author: fangq
    createdAt: '2020-09-02T19:45:58Z'
    body: "> Re @effigies : From the StackOverflow that @neurolabusc posted, the \"correct\" JSON transcription of nan, inf and -inf is null, which will turn into a Python None. I'm not sure how MATLAB or R handle those\r\n\r\nMATLAB's [`jsonencode`](https://www.mathworks.com/help/matlab/ref/jsonencode.html) converts nan/inf/-inf to `null`  by default, but can convert to `NaN`, `Infinity` and `-Infinity` if `ConvertInfAndNaN` is set to `false` (R2017b or newer)\r\n```\r\n>> jsonencode([1,nan,-inf,inf])\r\nans =\r\n    '[1,null,null,null]'\r\n\r\n>> jsonencode([1,nan,-inf,inf], 'ConvertInfAndNaN', false)\r\nans =\r\n    '[1,NaN,-Infinity,Infinity]'\r\n```\r\nI am not a fan for either of these options, because the first approach loses information, and the 2nd approach produces non-compliant JSON notations.\r\n\r\nin comparison, I've been using string forms `\"_NaN_\"`, `\"_Inf_\"` and `\"-_Inf_\"`  to convert these values in my [JSONLab toolbox](https://github.com/fangq/jsonlab) since 2011, also formalized in this specification\r\n\r\nhttps://github.com/fangq/jdata/blob/master/JData_specification.md#special-constants\r\n\r\nA similar string form was also adopted in the JSON outputs from the MATLAB Production Server, except it does not have the underscores, see\r\n\r\nhttps://www.mathworks.com/help/mps/restfuljson/json-representation-of-matlab-data-types.html#bu6ii47\r\n\r\n"
- number: 11
  title: Multi-site/center studies
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/11
  author: tsalo
  assignees: []
  labels:
  - 'impact: high'
  - folder-structure
  createdAt: '2020-08-03T13:06:46Z'
  updatedAt: '2024-04-24T17:34:30Z'
  closedAt: null
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\nhttps://groups.google.com/forum/?utm_medium=email&utm_source=footer#!msg/bids-discussion/SwH-1KRnBU0/oCx0ynEpBAAJ\r\n\r\nOur group would also be interested in finding a way to incorporate a way of distinguishing between sites for the datasets we work with.  I personally would prefer to use the key 'site-' rather than 'centre-', as 'centre' is not a shared spelling between British and American English.\r\n\r\nMaybe overall, all the participants from a single site could also live within a directory for that site.   So the directory structure might be amended to look like:\r\n\r\n`/site-<site_label>/sub-<participant_label>/[ses-<session_label>/]`\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original authors**: @jpellman\r\n"
  comments:
  - author: tsalo
    createdAt: '2020-08-03T13:07:06Z'
    body: "@thomasbeaudry wrote:\r\n\r\nwhy not add the site to the JSON file?"
  - author: tsalo
    createdAt: '2020-08-03T13:08:20Z'
    body: "@Athanasiamo wrote:\r\n\r\n> why not add the site to the JSON file?\r\n\r\nI have multi-site data and found Chris' advice to very much fit our data and the way our researchers use it. Though, we are not a \"true\" multi-site study, I believe this is a very nice solution (though produces long file names):\r\nhttps://groups.google.com/forum/#!topic/bids-discussion/WV-weqTusNQ"
  - author: tsalo
    createdAt: '2020-08-03T13:09:32Z'
    body: "@alexandreroutier wrote:\r\n\r\n> why not add the site to the JSON file?\r\n\r\nI currently have to work with a multi-site study and in my experience, the simplest and quite efficient solution was to embed the site into the <participant_label> e.g. sub-01CLNC001 where \"01\" is the site id and \"CLNC001\" the participant label and I am quite satisfied with that.\r\n\r\nHowever, the only drawback I see in this approach is that it assumes that the participant does not change site during the study. In that case, we can consider to embed the site at the session."
  - author: tsalo
    createdAt: '2020-08-03T13:10:02Z'
    body: "@chrisgorgo wrote:\r\n\r\nThis is also one of the recommendation from the main spec. See https://docs.google.com/document/d/1HFUkAEE-pB-angVcYe6pf_-fVf4sCpOHKesUvfb8Grc/edit#heading=h.29tn5cduh4ci"
  - author: tsalo
    createdAt: '2020-08-03T13:11:19Z'
    body: "@TKoscik wrote:\r\n\r\nfrom my point of view, site is a critical piece of information that generally denotes batch effects within a particular project. For example, in the ABCD protocol there will be batch effects between sites and scanners and scanner software revisions, etc.\r\n\r\nAlso, a site variable varies independently from subject and session, so lumping this information with other variables seems incorrect.\r\n\r\nhaving a separate folder for each site is also seems to place this variable at the wrong level of analysis as it is a within-project, and potentially within-subjects variable. not to mention that changing the folder structure will impact scripts more than a filename change.\r\n\r\nCurrently we are using the site tag to denote a combination of site, vendor, and relevant scanner/software changes, the benefit is that this makes immediately visiblethe need to explore/correct for batch effects. currentlly we are using a 5 digit code:\r\n- first 2 digits, identify institute, e.g., UIHC = 00\r\n- 3rd digit identifies the scanner vendor, e.g., 1=Siemens, 2=GE, 3=Phillips\r\n- last two digits, identify scanner and software version (and other major changes on each scanner that might cause batch effects in images), e.g., initial scanner setup for a given scanner is 00, every relevant change increments this number.\r\n- e.g., filename = sub-123_ses-12345six_site-00201_*"
  - author: tsalo
    createdAt: '2020-08-03T13:12:38Z'
    body: "@HenkMutsaerts wrote:\r\n\r\n> I personally would prefer to use the key 'site-' rather than 'centre-', as 'centre' is not a shared spelling between British and American English.\r\n\r\nI agree that this is a nice contribution to BIDS. However, in a multi-site study, 1 site can still have multiple scanners, and in most image processing you want to correct per scanner. So instead of 'site', you could consider 'scanner'"
  - author: tsalo
    createdAt: '2020-08-03T13:13:19Z'
    body: "@pvdemael wrote:\r\n\r\n> I agree that this is a nice contribution to BIDS. However, in a multi-site study, 1 site can still have multiple scanners, and in most image processing you want to correct per scanner. So instead of 'site', you could consider 'scanner'\r\n\r\nThis can easily be added to the participants file by adding columns for sites and scanners. IMHO is the scanner very important information but not to be in the filename which is more oriented towards features of the image"
  - author: jbteves
    createdAt: '2020-08-05T00:10:34Z'
    body: My view is that the subject ID should generally encapsulate the site anyway, as discussed above. Additionally, the scanner could be embedded as part of the metadata.
  - author: drmowinckels
    createdAt: '2020-08-10T07:05:29Z'
    body: "Hi. \r\n\r\nWe have ended up using something similar to what @tsalo desribes. We ended up incorporating site into the session tags, because we have subjects that have participated in multiple sites over time.\r\n\r\nFor us now, the session tag numerals counts the sequential scans, while the alphabeticals indicate the site\r\nex. sub-1200131_ses-01siteScanner\r\nAnd the site-information is a combination of site acronym and scanner\r\n\r\nWe found this solution to be the best also because of our longitudinal data. For our specific data, we have decided to change the meaning of \"session\" from standard MRI terms. Having the numerals in the session to mean \"lognitudinal timepoint\", rather than scan session. This was necessary to make a system that made it easy for our staff to recognise what cognitive data fits with which scan data. This was extra important also because some of our participants have within the same lognitudinal timepoint visited several scanners in a single day, so we could try to estimate the error in measurements when participants switch from one scanner to another due to upgrades. \r\n\r\nSo we could have \r\n- sub-1200131_ses-01scannerOne\r\n- sub-1200131_ses-02scannerOne\r\n- sub-1200131_ses-02scannerTwo\r\n- sub-1200131_ses-03scannerTwo\r\n\r\n"
  - author: yarikoptic
    createdAt: '2023-07-27T18:49:57Z'
    body: "#54 could provide a generic way to support overall desired layout for this. The issue could be split into two:\r\n- recommend adding `site` entity. Can be done right now as a PR.  This would allow for annotation but without changes to layout.\r\n- #54"
  - author: yarikoptic
    createdAt: '2024-04-12T20:50:09Z'
    body: Also somewhat relates to https://bids.neuroimaging.io/bep035 where the idea is to aggregate across studies, so adds entity `study`.  But probably semantic is different enough which would warrant to have both `study` and `site`.
  - author: yarikoptic
    createdAt: '2024-04-24T16:47:54Z'
    body: "other pieces of feedback: \r\n- `site` is IMHO better than `scanner` since not MR/CT/...-specific\r\n- `site` is better than `center` since the \"site\" is more generic than \"center.\r\n- indeed `site` can be incorporated either into `sub` or into `ses` depending on the use case, and its utility remains not highly demanded ATM IMHO. At large there is already reliance on some metadata field to tell apart different acquisition equipment \"samples\", versions of their software, etc .  But they are largely spread out and not formalized.  I see formalization of `site` as \"data acquisition site\" as a combination which would give us `sites.tsv` and `sites.json` to aggregate/summarize (see #65) metadata specific to the data acquisition sites.\r\n- there was a promise stated in BIDS 1.0 about \"multi-site\" support since \"the initial markdown\" https://github.com/bids-standard/bids-specification/commit/a364add49e106388338a4dd980aad6f9a4e45eea#diff-82b82851a7dbfdcaec1452e9b42e7d12522fe6caec85998bc85e2c7cf3b341afR2477 -- so we better \"deliver\"\r\n- IMHO there is no point to recommend addition of `_site-` entity outside of the BIDS 2.0 since there is no \"the level\" site should be used - could be over subjects (`site-/sub-`) or under subjects (`sub-/site-` in particular e.g. for \"traveling human phantom\" etc), so at large depends on having \r\n  - #54 \r\n- edit: I would consider `site` entity as OPTIONAL and likely after `subject` entity in the ordering (we can have multiple sessions within `site` but not multiple sites within session for the same `subject`. There could be multiple subjects within a session across sites though in some \"hyperscanning\" etc studies). But as \"OPTIONAL\" it would likely (we are yet to formalize)  require \"manual\" specification of the placement within #54 solution."
- number: 10
  title: Exchange "-" with "_" and vice versa
  state: CLOSED
  url: https://github.com/bids-standard/bids-2-devel/issues/10
  author: tsalo
  assignees: []
  labels:
  - wontfix
  - characters
  createdAt: '2020-08-03T13:01:17Z'
  updatedAt: '2024-02-28T01:03:46Z'
  closedAt: '2024-02-28T01:03:46Z'
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\nStems from https://github.com/INCF/pybids/issues/18.\r\n\r\nCurrently a filename in BIDS would look like: sub-03_ses-audio_run-08_bold.nii.gz. The delimiters are such that _ separates categories and - separates category from its value.\r\n\r\nWhen debugging it is often desirable to scroll fast and systematically through chunks of text at a time instead of hitting the left arrow key and having to scroll through each letter. On my mac I use option+arrow_key.\r\n\r\nThe issue that I want to raise is that the way mac keyboards parse text is it jumps through _ and stops at the -. For that reason I'd like to propose a change to the standard.\r\n\r\nfrom: sub-03_ses-audio_run-08_bold.nii.gz\r\nto: sub_03-ses_audio-run_08-bold.nii\r\n\r\nThis makes scrolling through filenames and paths more attuned to the way keyboards parse text when scrolling and therefore easier to select copy paste chunks that belong together.\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original authors**: @andrebeu\r\n"
  comments:
  - author: tsalo
    createdAt: '2020-08-03T13:02:33Z'
    body: "@thomasbeaudry wrote:\r\n\r\nI disagree with this. we have been programmed to associate underscores with new words, It would require relearning how to parse information"
  - author: tsalo
    createdAt: '2020-08-03T13:02:58Z'
    body: "@chrisgorgo wrote:\r\n\r\nYes - in fact there is a current proposal for doing this withing BIDS 1.x Hava a looka najoin in at https://groups.google.com/forum/#!topic/bids-discussion/ABOJ57ObXGM"
  - author: tsalo
    createdAt: '2020-08-03T13:03:15Z'
    body: "@TheChymera wrote:\r\n\r\nI also disagree with this suggestion. It's a big change and the rationale is really insubstantial."
  - author: TheChymera
    createdAt: '2020-08-03T18:42:25Z'
    body: "@andrebeu I would like to re-state my opposition to this and elaborate. Really this sounds more like an issue with mac or whatever shell implementation you are using. Tweaking a standard to fit to one *particular* UX design I think is a mistake likely to cause a lot more problems in the future. Manual debugging workflows know no bounds in their variety, and a standard cannot be formulated to accommodate them all. But UX choices can be made to allow you to deal with any standard. Perhaps you can tweak your shell (or if impossible, switch to a more hackable shell like zsh) to make your usage of this and any other format easier. \r\n\r\n@thomasbeaudry 's remark I think is correct, and in addition, even in the absence of such a convention, the broader width of the underscore and its lower position compared to the minus make it a visually more substantial delimiter."
  - author: tsalo
    createdAt: '2020-08-03T18:44:57Z'
    body: '@TheChymera To clarify- I''m also opposed to the change. I just copied over existing conversations from the [BIDS 2.0 Google Doc](https://docs.google.com/document/d/1LEgsMiisGDe1Gv-hBp1EcLmoz7AlKj6VYULUgDD3Zdw/edit?ts=5ec29f62#).'
  - author: TheChymera
    createdAt: '2020-08-03T20:23:16Z'
    body: '@tsalo sorry, from the phrasing of the text I thought you were the original author. corrected ^ '
  - author: yarikoptic
    createdAt: '2024-02-28T01:03:44Z'
    body: I think this is a clear `wontfix` so I will just close it
- number: 9
  title: Allow tabs in .bvec/.bval
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/9
  author: tsalo
  assignees: []
  labels:
  - 'impact: low'
  - characters
  createdAt: '2020-08-03T12:59:27Z'
  updatedAt: '2020-08-08T16:14:44Z'
  closedAt: null
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\ndcm2niix and dicm2nii historically output .bvec/.bval that are **tab** separated. BIDS 1.0.0 specifies that those files should be **space** separated. A compromise might involve specifying those files as **whitespace** separated.\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original authors**: Unknown\r\n"
  comments:
  - author: jbteves
    createdAt: '2020-08-05T00:13:19Z'
    body: "Parsing whitespace is trivial in most languages, we could offer examples of how to parse this in major languages. Examples:\r\nPython\r\n```python\r\nvals = valstr.split()\r\n```\r\nMATLAB\r\n```matlab\r\nvals = strsplit(valstr)\r\n```"
  - author: neurolabusc
    createdAt: '2020-08-05T11:39:50Z'
    body: To clarify, prior to the creation of BIDS, dcm2niix would generate tab separated bvec and bval files. During the development of BIDS, @chrisgorgo strongly advocated for space separated bvec and bval files when BIDS files were created. Therefore, current versions of dcm2niix will generate tab-delimited files for `-b n` and space separated files for `-b y`. FSL and all the other tools I know of have no preference between these two. I liked tab-separated files simply because if you copy-paste text into a spreadsheet like Excel, it will treat space-delimited data as a single string, while tab-delimited data is pasted into separate columns. I have no strong preference, and happy to change my software, and believe that the impact of the` -b` switch on these files is unintuitive for most users (so happy to use one convention in future). But as @chrisgorgo made an explicit change, I suspect he has thoughts on this.
- number: 8
  title: Keep the filenames short
  state: OPEN
  url: https://github.com/bids-standard/bids-2-devel/issues/8
  author: tsalo
  assignees: []
  labels:
  - 'impact: high'
  - entities
  - metadata
  createdAt: '2020-08-03T12:54:24Z'
  updatedAt: '2020-08-05T17:34:58Z'
  closedAt: null
  body: "<!--\r\nWrite the content of the suggestion here.\r\nAdd comments to the suggestion as separate comments in the issue thread.\r\n-->\r\nhttps://groups.google.com/forum/#!topic/bids-discussion/IdWe0R8OFyw \r\n\r\n1. ALL parameters should be included in the JSON file, regardless of their inclusion in the filename or path, and that values in the JSON file be lists, so that they can easily accommodate 4D files when necessary. For example, flip angle would be a list that could be more flip angles.\r\n2. The length of the filename should be restricted to be no longer than 32 characters. We can discuss the actual length, but given that we can expect a long path the proceed the filename, and need to rely on the entire file path, it should not be too long. I believe that the current max length for filenames in AFNI is 255 characters and anything beyond that gets truncated, but even if AFNI increases this value to 1024, or 102040 there will always be a max, and we need to enforce some length restriction in the spec. I also challenge the human readability of a filename that is this long. \r\n3. That we do not add any new key value pairs to the filename other than the ones in the current standard. \r\n4. That we allow the \"-\" character to occur inside values. We can then state that for a key value pair, the value before the first hyphen is the key and everything after is the value. This would accommodate Bertrand's concerns regarding subject identifiers, as well as allow the ACQ field to be overloaded to contain more key value pairs for software and users that wish to overload the ACQ tag to include more information, such as MT-ON, Echo-1, or otherwise. Software that does not support this overloaded would then just interpret the entire ACQ value as a string that points them to the correct .json file. As Chris points out, this may break some pre-existing implementations, but since it wasn't clearly defined before, we need to pin it down.\r\n\r\n\r\n<!--\r\nList the original authors' GitHub handles or names here.\r\n-->\r\n**Original authors**: @ccraddock\r\n"
  comments:
  - author: tsalo
    createdAt: '2020-08-03T12:55:44Z'
    body: "@CPernet suggested:\r\n\r\n> 3. That we do not add any new key value pairs to the filename other than the ones in the current standard.\r\n\r\n> 3. That we do not add any new **[mandatory?]** key value pairs to the filename other than the ones in the current standard.\r\n\r\nrelates to a case where we want to add info about contrast agent so we have a new optional key called ce (contrast enhancement) and the value is the product used (+a description in the json file) -- see email thread with Pauline Roca"
  - author: tsalo
    createdAt: '2020-08-03T12:57:01Z'
    body: "@TheChymera  wrote:\r\n\r\n> 3. That we do not add any new [mandatory?] key value pairs to the filename other than the ones in the current standard.\r\n\r\nI agree with this suggestion. We need to allow people to add fields. A missing field and a strict requirement thereof could be a major reason for not using the standard."
  - author: tsalo
    createdAt: '2020-08-03T12:58:28Z'
    body: "Robert Welsh wrote:\r\n\r\nI realize is comment could be here as well: \r\n\r\nSince there are tag/value pairs actually as part of the file names, should the order even matter? that is, scripts should scan for \"sub\" or \"task\" in the name and then grab the value. That would allow for much needed flexibility in the naming. Thus, a name such as \r\n- run-01_task-rest_sub-001.nii.gz\r\n- run-01_sub-001_task-rest.nii.gz\r\n- task-rest_run-01_sub-001.nii.gz\r\n- task-rest_sub-001_run-01.nii.gz\r\n- sub-001_run-01_task-rest.nii.gz\r\n- sub-001_task-rest_run_01.nii.gz\r\n\r\nwould all be BIDS compliant. I would push for this type of flexibility."
  - author: jbteves
    createdAt: '2020-08-05T00:18:43Z'
    body: "Tagging @afni-rickr and @leej3 : is this filename max length of 256 accurate? If so, could it be amended easily and does it include the full path, or is that a separate max length requirement?\r\n\r\nI'm not thrilled about allowing dashes inside the labels, as I discuss in #17. However, I will say that inhumanly readable filenames can also be quite challenging and this is therefore a balancing act."
  - author: afni-rickr
    createdAt: '2020-08-05T16:36:34Z'
    body: "Hi @jbteves , I think the 256 limit comes from the file system, rather than from AFNI.  I cannot even \"touch\" a file of over that length (either on my ext4 file system, or on the gpfs file system used for the HPC cluster).\r\nAFNI has a limit of 999 for a dataset prefix (which then might be moot), and a separate limit of over 4000 for the path to it."
  - author: jbteves
    createdAt: '2020-08-05T17:34:57Z'
    body: 'I see, thanks for clarification! I''d forgotten about that being a filesystem limitation. '
