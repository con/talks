    body: '## New tool "IP-Freely"


      The core work that has been done in the course of the last couple of weeks is an independent, from-scratch implementation of the Inheritance Principle, interpreted as written in different versions of the specification.


      https://github.com/Lestropie/IP-freely/pull/15


      #### Rule sets


      I have defined in code a list of different rulesets that define what is and is not permissible under the Inheritance Principle under retrospective, current, and proposed future specifications.


      These include:


      -   The [original text](https://bids-specification.readthedocs.io/en/v1.1.2/02-common-principles.html#the-inheritance-principle) in specification 1.1.2 (the earliest version that is rendered online).


      -   The [codified version](https://bids-specification.readthedocs.io/en/v1.7.0/02-common-principles.html#the-inheritance-principle) from 1.7.0 onwards as committed in [#946](https://github.com/bids-standard/bids-specification/pull/946).


      -   The change committed in [#1834](https://github.com/bids-standard/bids-specification/pull/1834) to be included in 1.11.0 that precludes overrides of individual metadata key-values.


      -   Proposed augmentations to make the Inheritance Proposal more powerful: one [rejected Pull Request #1003](https://github.com/bids-standard/bids-specification/pull/1003); another [discussed in Issue #1195](https://github.com/bids-standard/bids-specification/issues/1195).


      -   A "ruleset" that prohibits any and all manifestations of the Inheritance Principle. This could be used to, for instance, *audit* for the presence of IP usage in data stores by "validating" them against this alternative rule set.


      My software defines what is vs. is not permitted under each of these definitions of the IP.

      A test barrage then ensures that the outcomes of validation of each of the example datasets (see below) under each of these rule sets conforms to my own *a priori* expectation given their respective definitions and the content of each dataset (NB. this is *not* purely regression testing; I''ve defined my expectations independently of software outcomes).


      #### Conversion


      The ultimate goal of this Tool was to be able to convert datasets to conform to different instantiations of the Inheritance Principle.

      My work has however focused on existing support for the IP rather than enhancing the ecosystem in this regard,

      given the volume of issues to report.


      For now, there is one conversion possible: by nominating the output ruleset as "forbidden", the tool will produce an alternative version of the dataset where use of the Inheritance Principle is zero. This might be useful, for instance, in running BIDS Apps that fail to properly consider the Inheritance Principle against BIDS datasets that make use of the Inheritance Principle, by performing the requisite intermediate conversion.


      I will hopefully get the chance to come back to this and improve my implementations of dataset modifications.

      For instance I hope to use this tool to highlight how more complex datasets (eg. multi-modality, derivatives) may look depending on whether BIDS 2.0 were to choose to remove vs. augment the Inheritance Principle.'
